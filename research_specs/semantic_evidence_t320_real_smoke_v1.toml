    "CUDA initialization",
    "model construction",
    "checkpoint loading",
    "dataset image access",
]

[resource_contract.submission_gate]
operator_may_submit_only_after = [
    "this contract passes independent verification",
    "this contract is committed",
    "the smoke runner and launcher are implemented",
    "the runner passes independent verification",
    "committed-HEAD readiness passes",
]
this_task_provides_sbatch_command = false

##############################################################################
# 12. TELEMETRY CONTRACT
##############################################################################

[telemetry_contract]
required_fields = [
    "slurm_job_id", "node", "gpu_model", "cuda_runtime_version",
    "cuda_driver_version", "total_wall_time_ns", "preflight_wall_time_ns",
    "model_construction_and_checkpoint_loading_wall_time_ns",
    "dataset_image_preparation_wall_time_ns", "model_forward_wall_time_ns",
    "graph_construction_wall_time_ns", "recurrence_wall_time_ns",
    "stitching_finalization_wall_time_ns",
    "artifact_validation_install_wall_time_ns", "peak_host_rss_bytes",
    "peak_gpu_allocated_bytes", "peak_gpu_reserved_bytes", "gpu_total_memory_bytes",
]
wall_timing_clock = "time.perf_counter_ns"
cuda_sync_requirement = "torch.cuda.synchronize() immediately before AND after every measured GPU region"
gpu_memory_stat_reset_point = "torch.cuda.reset_peak_memory_stats() after model setup completes and before smoke execution begins"
memory_ordering_requirement = "allocated <= reserved <= total (all in bytes)"
timing_non_negativity_requirement = "all timing fields are non-negative integers (nanoseconds)"
profiling_must_not_alter_scientific_digests = true
full_dataset_runtime_estimation_from_this_smoke_prohibited = true

##############################################################################
# 13. RESULT ARTIFACT SCHEMA
##############################################################################

[result_schema]
example_filename = "smoke_result.json"
required_top_level_fields = [
    "schema", "complete", "final", "identity_and_dependency_bindings",
    "repository_commit_tree_cleanliness", "implementation_hashes",
    "external_weight_bindings", "selected_image_ids",
    "runtime_derived_image_dimensions", "ordered_window_records",
    "window_count_and_digest", "forward_snapshot_graph_trajectory_update_counts",
    "image_scoped_stitch_finalize_counts",
    "t0_preservation_comparisons_per_window", "t0_t320_repeat_digests",
    "prediction_equality_results", "non_finite_counts_by_stage",
    "tensor_shapes_dtypes", "timing_telemetry", "rss_vram_telemetry",
    "scope_disclosures", "no_gt_no_metric_fields", "final_smoke_outcome",
]

[result_schema.outcomes]
pass_value = "PASS_REAL_E3_T320_INTEGRATION_SMOKE"
fail_value = "FAIL_REAL_E3_T320_INTEGRATION_SMOKE"
pass_requires_all_of = [
    "scientific checks (Part 9/section 9 of this authority) pass",
    "count relations (determinism_contract) pass exactly",
    "determinism checks (two repeats) pass exactly",
    "scope checks (no GT/metric path exercised) pass",
    "artifact checks (schema-complete, atomically installed, post-install-verified) pass",
]
warning_only_bypass_to_pass_prohibited = true

##############################################################################
# 14. ARTIFACT INSTALLATION POLICY
##############################################################################

[artifact_policy]
output_root = "scratch-only"
fresh_destination_required = true
overwrite_prohibited = true
force_mode_prohibited = true
staging_location = "sibling temporary directory"
staged_validation_before_installation_required = true
installation_method = "atomic directory rename"
reopen_after_installation_required = true
public_verifier_rerun_after_installation_required = true
success_message_before_post_install_verification_prohibited = true
partial_artifact_as_final_prohibited = true
failure_preserves_prior_state = true
temporary_residue_removed_or_reported = true
result_artifact_committed_to_git = false

##############################################################################
# 15. CLOSURE
##############################################################################

[closure]
complete = true
final = true
contract_only = true
implements_smoke_runner = false
executes_real_inference = false
accesses_image_pixels = false
accesses_annotations_or_gt = false
loads_checkpoint_tensors = false
initializes_cuda = false
submits_job = false
implements_interventions = false
executes_96_image_feasibility_study = false
trains_anything = false
evaluates_accuracy_or_miou = false
stages_or_commits_files = false
