##############################################################################
# 8. WINDOW GEOMETRY (RUNTIME-DERIVED WINDOW COUNT, FROZEN RULE)
##############################################################################
# This contract freezes crop/stride/patch and the canonical window-ordering
# RULE. It does NOT fabricate the two images' window counts -- image pixel
# access is prohibited to this contract task, so per-image dimensions and
# hence window counts are unknown until future smoke preflight resolves the
# two authorized image files. Window count is RUNTIME_DERIVED_AND_RECORDED.

[window_geometry]
crop_pixels = [448, 448]
stride_pixels = [224, 224]
patch_size_pixels = [14, 14]
crop_stride_patch_source = "src/open_vocabulary_segmentation/segmentation/configs/_base_/datasets/stuff.py test_cfg = dict(mode='slide', stride=(224,224), crop_size=(448,448)); patch14 from src/local_weights.py DINO_MODEL_INFO['dinov2_vitb14_reg']"
canonical_window_builder_source = "src/open_vocabulary_segmentation/segmentation/evaluation/dinotext_seg.py DINOTextSegInference.slide_inference"
canonical_window_ordering = "row-major: window_index = h_idx * w_grids + w_idx, both loop variables 0-indexed (dinotext_seg.py slide_inference 'for h_idx in range(h_grids): for w_idx in range(w_grids)')"
flush_right_flush_bottom_behavior = "matches slide_inference's own clamped final-window placement exactly (last window in each row/column is pulled inward to stay within image bounds when stride does not evenly divide (H - crop) or (W - crop)); no independent reimplementation of this clamping logic is authorized -- the future runner must call/mirror slide_inference's own window-generation logic, not invent a new one"
window_count_status = "RUNTIME_DERIVED_AND_RECORDED"
window_count_fabrication_prohibited = true
debug_subset_or_max_window_override_prohibited = true

[window_geometry.future_preflight_requirements]
resolvable_image_ids = ["000000567197", "000000367680"]
image_dimension_read_without_gt_authorized = true
window_universe_generation_required = true
every_window_record_must_be_persisted = true
canonical_ordered_window_digest_required = true
no_window_may_be_dropped_sampled_reordered_or_replaced = true
result_must_record = [
    "per-image dimensions",
    "per-image window counts",
    "total window count N",
    "all ordered window coordinates",
    "canonical digest",
]

##############################################################################
# 9. SCIENTIFIC SMOKE CHECKS
##############################################################################

[one_forward_contract]
real_e3_model_forwards_equals_N = true
adapter_snapshots_equals_N = true
second_e3_forward_prohibited = true
candidate_specific_or_t320_specific_forward_prohibited = true
masked_forward_or_component_path_prohibited = true

[preservation_contract]
description = "For every window, compare the ordinary E3 per-window reference output from the single real forward (extract_e3_window_snapshot's second return value, ordinary_mask_output) against the adapter/T0 reconstruction from the same forward's snapshot (internal_upsample(snapshot.s0, grid_hw, output_hw))."
comparison_strength = "bitwise_equal"
comparison_rationale = "Both quantities are produced from the identical simmap/mask_pre_resize tensors of the SAME single forward_seg call via the SAME torch.sigmoid + F.interpolate(align_corners=True) operations (ordinary_mask_output computed directly in extract_e3_window_snapshot; T0's internal_upsample independently re-applies the identical torch.sigmoid then F.interpolate(align_corners=True) to the captured raw S0). No random, non-deterministic, or reduced-precision operation lies between them and no reduction/accumulation across windows has occurred yet at this comparison point, so bitwise equality is the strongest supported requirement, not an arbitrary tolerance."
score_or_mask_tensors = "bitwise_equal (torch.equal)"
prediction_tensors = "exactly_equal (torch.equal on argmax-if-computed)"
shape_and_dtype = "exactly_equal"
mismatch_action = "fail the smoke (FAIL_REAL_E3_T320_INTEGRATION_SMOKE)"

[t320_execution_contract]
graph_constructions_per_target_generation_repeat_per_window = 1
recurrence_trajectories_per_repeat_per_window = 1
updates_per_trajectory = 320
recurrence_domain = "raw pre-sigmoid S0 (unbounded)"
sigmoid_occurrences_per_window_per_repeat = 1
sigmoid_timing = "applied exactly once, after update 320, inside internal_upsample -- never before or during recurrence"
internal_interpolation_mode = "bilinear"
internal_interpolation_align_corners = true
stitching_domain = "sigmoid-domain overlap averaging (uniform, by overlap count only)"
final_rescale_mode = "bilinear"
final_rescale_align_corners = false
prediction_rule = "ordinary torch.argmax(dim=1); no custom tie-break"

[determinism_contract]
description = "Reuse the same immutable real snapshots (from the single real forward per window); run the pure T0/T320 target generation (generate_t0_t320_targets) twice without another model forward. generate_t0_t320_targets is IMAGE-SCOPED (single scalar canvas_h/canvas_w, every snapshot in one call must match that canvas -- src/semantic_evidence_t320.py:371-410): one call processes exactly one image's windows and performs exactly one T0 stitch_windows + one T0 finalize_prediction + one T320 stitch_windows + one T320 finalize_prediction. Window-scoped operations (model forward, graph construction, recurrence, sigmoid) therefore scale with the total window count N across both images; image-scoped operations (stitching, finalization) scale with the selected image count M, not with N."
target_generation_repeats = 2

# Window-scoped: one unit of work per window, per target-generation repeat.
# Applies to model_forwards/snapshots (repeat-independent: taken once per
# window, reused for both repeats) and to graph/recurrence/sigmoid
# (repeat-dependent: repeated fresh in each of the R pure-generation calls).
[determinism_contract.window_scoped_expected_counts]
unit = "per_window (model_forwards, snapshots); per_window_per_repeat (all others)"
model_forwards = "N"
snapshots = "N"
t0_sigmoid_conversions = "N*R"
t320_graph_constructions = "N*R"
t320_trajectories = "N*R"
t320_recurrence_updates = "N*R*320"
t320_sigmoid_conversions = "N*R"

# Image-scoped: generate_t0_t320_targets is called once per image per
# repeat (never once for the whole multi-image campaign -- doing so would
# require a single shared canvas_h/canvas_w across images with different
# real dimensions, which the function's own snapshot.canvas_h/canvas_w
# equality check rejects, and would corrupt stitching even where shapes
# coincidentally matched). Each such call performs exactly one stitch and
# one finalize per variant (T0, T320).
[determinism_contract.image_scoped_expected_counts]
unit = "per_image_per_repeat"
selected_image_count = 2
target_generation_repeat_count = 2
expression = "selected_image_count * target_generation_repeat_count"
t0_stitch_calls = 4
t0_finalize_calls = 4
t320_stitch_calls = 4
t320_finalize_calls = 4

[determinism_contract.required_between_repeats]
identical_window_order = true
identical_t0_scientific_digest = true
identical_t320_scientific_digest = true
exact_prediction_equality = true
zero_non_finite_values = true
snapshot_bytes_tensors_unchanged = true

[determinism_contract.claims]
cross_device_bitwise_determinism_claim = false
determinism_scope = "same-job, same-device, same-input repetition only"

[validity_contract]
require_finite = [
    "raw S0", "graph values", "propagated scores", "sigmoid masks",
    "stitched scores", "final scores",
]
require_valid_class_dimension = true
require_valid_image_geometry = true
require_valid_prediction_shape = true
require_no_input_mutation = true
require_no_empty_result = true
require_no_out_of_range_window = true

