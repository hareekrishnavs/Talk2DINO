no_orphaned_temporary_files = true
previous_valid_generation_preserved_on_failure = true
resume_must_not_alter_scientific_content = true

[lifecycle_contract.determinism_identity]
requirement = "for all scientific digests and final decision fields: clean fresh execution == interrupted execution + resume == complete-but-unfinalized + finalize-only"

[lifecycle_contract.scope]
elaborate_generation_system_beyond_48_image_run_prohibited = true

##############################################################################
# 12. STATISTICAL EXECUTION CONTRACT (inherited exactly; see section 5)
##############################################################################

[statistical_execution_contract]
predecessor_table = "statistics"
adaptive_thresholds_prohibited = true
tuning_on_discovery_outcomes_prohibited_unless_predecessor_defines_it = true
predecessor_defines_tuning_on_discovery_outcomes = false
holdout_inspection_during_discovery_fitting_or_evaluation_prohibited = true
degenerate_discovery_sample_behavior = "fail closed to the predecessor-defined stop outcome (INCONCLUSIVE, per [gates.outcome].inconclusive_handling)"
minimum_data_requirements_predecessor_table = "statistics.minimum_data_requirements"
min_eligible_query_correctness_rows_discovery = 500

##############################################################################
# 13. GATE AND DECISION CONTRACT
##############################################################################
# Every one of Gates B, C, D and the overall [gates.outcome] proceed/stop
# decision structurally requires locked_holdout evaluation
# ([gates.B]/[gates.C].*_holdout, [gates.D].rule comparing model pairs on the
# same evaluated population as B/C, [statistics.fit_evaluate].evaluate_partition
# = "locked_holdout"). Holdout access is out of scope for this authority.
# Therefore this authority freezes Gates A and E as discovery-side-computable
# now, and freezes B, C, D, and the overall outcome as NOT_COMPUTABLE_WITHOUT_HOLDOUT
# -- never silently PASSed, SKIPped, or assumed. This is the same
# computable_under_this_contract pattern the feasibility contract itself
# already uses for Gate C pending T320 binding, extended to the new reason.

[gate_contract]
predecessor_table = "gates"
use_predecessor_outcome_strings_exactly = true
proceed_value = "PROCEED_TO_DEPLOYABLE_SIGNAL_SPECIFICATION"
stop_value = "STOP_SEMANTIC_EVIDENCE_INTERVENTION_TRACK"
inconclusive_handling = "INCONCLUSIVE counts as STOP for this bounded project, UNLESS caused by a mechanical implementation defect repairable without changing population or scientific definition"
post_hoc_threshold_changes_authorized = false

[gate_contract.A]
name = "intervention_validity"
predecessor_table = "gates.A"
min_structural_validity_fraction = 0.95
max_gt_dependent_intervention_records = 0
max_non_finite_scores = 0
reliability_range = [0.0, 1.0]
computable_under_this_contract = true
computed_over = "discovery-phase generated records only (48 images); the same Gate A is independently re-evaluated over locked_holdout by a future successor holdout authority before the overall [gates.outcome] decision is reached"

[gate_contract.B]
name = "query_correctness_information"
predecessor_table = "gates.B"
min_auroc_improvement_holdout = 0.03
paired_bootstrap_95_lower_bound_required = "> 0"
computable_under_this_contract = false
computable_note = "requires locked_holdout evaluation ([gates.B].auroc_improvement_definition explicitly evaluates on locked_holdout anchor_query rows); out of scope for this discovery-only authority; model fits 1/2 ARE fit on discovery by this authority, but their holdout evaluation is deferred"
status = "NOT_COMPUTABLE_WITHOUT_HOLDOUT"

[gate_contract.C]
name = "propagation_outcome_information"
predecessor_table = "gates.C"
min_auroc_improvement_holdout = 0.03
paired_bootstrap_95_lower_bound_required = "> 0"
computable_under_this_contract = false
computable_note = "T320 is now bound (see [t0_t320_target_authority]), resolving the feasibility contract's original blocking reason; Gate C nonetheless still requires locked_holdout evaluation and remains out of scope for this discovery-only authority; model fits 3/4 ARE fit on discovery by this authority, but their holdout evaluation is deferred"
status = "NOT_COMPUTABLE_WITHOUT_HOLDOUT"

[gate_contract.D]
name = "subgroup_sanity"
predecessor_table = "gates.D"
subgroups = ["predicted_boundary_vs_interior", "thing_vs_stuff_gt_category", "low_vs_high_unary_margin"]
min_subgroup_size_for_check = 100
max_negative_auroc_difference = -0.01
computable_under_this_contract = false
computable_note = "the rule compares AUROC differences on the same evaluated population as Gates B/C, i.e. locked_holdout; out of scope for this discovery-only authority"
status = "NOT_COMPUTABLE_WITHOUT_HOLDOUT"

[gate_contract.E]
name = "compute_feasibility"
predecessor_table = "gates.E"
max_h100_hours_96_image_feasibility_run = 2.0
max_h100_hours_1000_image_projection = 8.0
projection_formula_and_uncertainty_disclosure_required = true
deployment_runtime_claim_authorized = false
computable_under_this_contract = true
computed_over = "discovery-phase (48-image) Slurm elapsed time only, projected; job elapsed time is operational metadata per [artifact_contract], never a scientific field, and the smoke's own profiling defects (see [smoke_prerequisite]) must not be inherited into this projection's methodology"

[gate_contract.outcome]
overall_status = "PENDING_HOLDOUT_EVALUATION"
overall_status_reachable_by_this_authority = false
discovery_decision_values = ["DISCOVERY_FEATURES_READY_FOR_HOLDOUT_AUTHORITY", "DISCOVERY_STOP_GATE_A_FAILED", "DISCOVERY_INCONCLUSIVE"]
discovery_decision_definition = "DISCOVERY_FEATURES_READY_FOR_HOLDOUT_AUTHORITY iff Gate A passes on discovery-side records AND Gate E passes on the discovery-side compute projection AND all four model fits complete without a degenerate-sample stop; DISCOVERY_STOP_GATE_A_FAILED iff Gate A fails; DISCOVERY_INCONCLUSIVE iff a degenerate discovery sample or Gate E failure occurs"
discovery_decision_is_not_the_predecessor_gates_outcome = true
discovery_pass_authorizes_only = "creation of a successor holdout authority"
discovery_pass_does_not_authorize = ["holdout execution", "the full 96-image gate decision", "any accuracy or mIoU claim", "any paper claim"]
discovery_stop_ends_research_direction_under_frozen_hypothesis = true

