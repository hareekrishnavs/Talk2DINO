[artifact_contract.final_result]
schema_name = "semantic_evidence_discovery_result"
schema_version = "1.0.0"
required_fields = [
    "schema", "complete", "final", "identity_and_dependency_bindings",
    "population_binding", "implementation_binding",
    "discovery_image_ids_ordered", "gt_free_feature_digest",
    "gt_dependent_label_digest", "scientific_collection_digest",
    "model_fit_summaries", "primary_metrics", "bootstrap_intervals",
    "gate_inputs", "gate_pass_fail", "final_frozen_outcome",
    "holdout_accessed", "full_evaluation_accessed",
]

[artifact_contract.decision_document]
