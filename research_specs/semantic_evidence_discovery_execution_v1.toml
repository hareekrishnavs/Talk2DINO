    "schema", "gate_a_discovery_side", "gate_e_discovery_side",
    "gate_b_status", "gate_c_status", "gate_d_status",
    "overall_gates_outcome_status", "discovery_decision", "next_step",
]

[artifact_contract.closed_schema_requirements]
unknown_keys_rejected = true
missing_keys_rejected = true
nested_mappings_closed = true
strict_scalar_container_types = true
boolean_as_integer_rejected = true
nan_infinity_rejected = true
