##############################################################################
# 3. ANCHOR-CONTENT GEOMETRY CONTRACT (the selected scientific measurement)
##############################################################################

[anchor_content_geometry]
schema_version = "1.0.0"
scope = "Phase A T0/T320 predicted-class point lookup, Phase B GT majority-vote 14x14 patch footprint, and the protected 42x42 intervention-view core mask -- whenever a canonical window's native extent, per axis independently, differs from the fixed grid_side*patch_size backbone-tokenization canvas (448 = 32*14)."
applies_when = "native_size != canvas_size, evaluated independently per axis (height and width may be clamped independently, e.g. a window may be native-height-clamped while its width remains exactly 448)"
governs_anchor_content_only = true
does_not_govern_output_placement = "align_corners=True grid-to-native prediction-rendering upsampling (semantic_evidence_t320.internal_upsample; DINOText.generate_masks, dinotext.py:340-346) is a separate, unrelated transform, unchanged by this authority"

[anchor_content_geometry.point_rule]
name = "input_tokenization_inverse_pixel_index"
applies_to = "Phase A T0/T320 predicted-class lookup only"
historical_definition = "i*patch_h + patch_h//2 (the historical, always-448 patch-center pixel index)"
formula = "native_index = round_half_away_from_zero((center_448 + 0.5) * native_size / canvas_size - 0.5), per axis, clipped to [0, native_size - 1]"
identity_at_native_448 = "exact by construction (scale factor 1): reduces to center_448 unchanged, no special-casing"

[anchor_content_geometry.boundary_rule]
name = "input_tokenization_inverse_boundary_linear_scaling"
applies_to = "Phase B GT majority-vote 14x14 patch footprint, and the protected 42x42 intervention-view core (mapped by a discovery-local wrapper; the protected core_pixel_bounds function itself is never edited or reimplemented)"
historical_definition = "[i*patch_h, (i+1)*patch_h) for the patch; the protected core_pixel_bounds's own 42-pixel, 3-patch interval for the core"
formula = "native_boundary = round_half_away_from_zero(edge_448 * native_size / canvas_size), per axis, clipped to [0, native_size]"
identity_at_native_448 = "exact by construction (scale factor 1): reduces to edge_448 unchanged, no special-casing"
fails_closed_on_empty_region = true

[anchor_content_geometry.rounding]
tie_rule = "round_half_away_from_zero"
tie_rule_definition = "0.5 always rounds away from zero (floor(x+0.5) for x>=0, ceil(x-0.5) for x<0); never Python's built-in round() (round-half-to-even / banker's rounding), which is a different, unstated convention"
is_explicit_contract_choice = true
not_automatically_forced_by_bilinear_interpolation = true

[anchor_content_geometry.measurement_claim]
claim = "This rule computes a rounded geometric measurement (a pixel index or a half-open pixel interval), derived from and empirically verified against model.image_transforms' real T.Resize((448,448)) forward operation (this repo's own production venv: torch 2.12.0 / torchvision 0.27.0)."
disclaimed_claim = "This rule does NOT claim to reproduce the complete nonzero bilinear-kernel support of that resize (a 2-tap bilinear kernel's true support extends up to roughly one native pixel further on each side than this rounded boundary). It is a chosen geometric measurement contract, not a claim of exact kernel-support equivalence."

[anchor_content_geometry.window_extent_source]
rule = "native_h/native_w are computed from each canonical window's own (top, left, bottom, right) box (bottom-top, right-left), never from the full image height/width"

