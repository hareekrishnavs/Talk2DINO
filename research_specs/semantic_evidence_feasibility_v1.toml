##############################################################################
# 10. ANCHOR SELECTION (PER-WINDOW, PATCH LEVEL) -- UNCHANGED BY THIS REVISION
##############################################################################

[anchor_selection]
anchor_namespace = "talk2dino-semantic-evidence-anchor-selection-v1"
anchor_key_algorithm = "SHA256( UTF8(anchor_namespace) || 0x00 || ASCII(canonical_image_id) || 0x00 || ASCII(canonical_window_index) || 0x00 || ASCII(canonical_patch_index) ).hexdigest()"
anchor_key_ascii_encoding_note = "canonical_window_index and canonical_patch_index are encoded as their base-10 ASCII decimal string representation, no leading zeros, no separators beyond the single 0x00 bytes already specified"
sort_key = ["anchor_key", "canonical_patch_index"]
target_anchors_per_window = 8
strata = ["boundary_low", "boundary_high", "interior_low", "interior_high"]
anchors_per_stratum = 2
boundary_definition = "an eligible patch is 'boundary' if ANY of its (unconditionally all 8, per e3_geometry.eligible_patches_always_have_8_grid_neighbors) 8-connected grid neighbors has a different unary_top1 class than the patch itself"
interior_definition = "an eligible patch that is not 'boundary'"
unary_margin_definition = "top1_score - top2_score, using the raw (pre-sigmoid) unary scores of the patch's own unary_top1 and unary_top2 classes"
median_split_population = "computed separately within each window: the median of unary_margin is computed over the window's boundary-eligible patches and, separately, over the window's interior-eligible patches"
median_tie_rule = "a patch whose unary_margin equals its group's median value is assigned to the LOW stratum of that group (boundary_low or interior_low)"
stratum_selection_rule = "within each of the 4 strata, sort member patches ascending by (anchor_key, canonical_patch_index) and take the first 2"
fill_rule = "if a stratum has fewer than 2 member patches, fill the missing anchor slot(s) for that window from the remaining eligible patches NOT already selected as an anchor in this window, in ascending global (anchor_key, canonical_patch_index) order across strata, until 8 total anchors are reached for the window; no duplicate patch may be selected twice within one window"
gt_or_correctness_forbidden_in_selection = true
queries_per_anchor = 2
query_definition = "query_1 (q1) = the anchor patch's own unary_top1 class; query_2 (q2) = the anchor patch's own unary_top2 class. No GT class may be substituted or inserted. q1 is, by construction, identical to [propagation_target_authority].t0_definition's predicted class at that anchor."

##############################################################################
# 11. FIXED REGION AND INTERVENTION DEFINITIONS -- UNCHANGED BY THIS REVISION
##############################################################################

[region]
unit = "patch-aligned 3x3-patch core region centered on the selected anchor patch"
core_patch_count = 9
core_patch_count_derivation = "eligible anchors always have row,col in [1,30] on a [0,31] grid, so the 3x3 block (row-1..row+1, col-1..col+1) always lies fully within the grid: exactly 9 complete patches, no truncation"
core_pixel_size = [42, 42]
core_pixel_size_derivation = "3 patches x 14 pixels/patch = 42 pixels per side, for the confirmed 14-pixel patch size; if a future source read contradicts patch_size_pixels=14, the implementer must stop and report the contradiction rather than silently recompute this value"
operates_on = "the E3 crop, BEFORE E3 normalization (T.Normalize) and BEFORE the model's BGR-to-RGB channel swap (dinotext.py:316)"
dtype_range_preservation_requirement = "the implementation must preserve the actual input dtype/range present at that pipeline stage; this contract does not itself fix a dtype/range value"

[interventions]
views = ["ORIGINAL", "CONTEXT_BLURRED", "REGION_BLURRED", "AREA_MATCHED_CONTROL"]

[interventions.ORIGINAL]
definition = "the unmodified E3 crop"

[interventions.CONTEXT_BLURRED]
definition = "core pixels unchanged bit-exactly; pixels outside the core replaced by the deterministic Gaussian-blurred version of the same crop (see [gaussian_blur])"
unchanged_domain = "core (3x3 patches, 42x42 px, centered on anchor)"
replaced_domain = "everything outside the core"

[interventions.REGION_BLURRED]
definition = "pixels outside the core unchanged bit-exactly; core pixels replaced by the deterministic Gaussian-blurred version of the same crop"
unchanged_domain = "everything outside the core"
replaced_domain = "core (3x3 patches, 42x42 px, centered on anchor)"

[interventions.AREA_MATCHED_CONTROL]
definition = "anchor core unchanged; a non-overlapping 3x3-patch control region elsewhere in the same window is replaced by the deterministic Gaussian-blurred version of the same crop"
unchanged_domain = "anchor core, and everything outside both the anchor core and the chosen control region"
replaced_domain = "the chosen non-overlapping 3x3-patch control region"
control_center_selection_rule = "among eligible patches whose 3x3 core does not overlap the anchor's 3x3 core (no shared patch, including diagonally), select the control center by ascending (anchor_key, canonical_patch_index) using the SAME anchor_key algorithm and anchor_namespace as [anchor_selection] applied to the CONTROL candidate patch (not the original anchor)"
no_valid_control_behavior = "if no eligible, non-overlapping 3x3-patch center exists for a given anchor, that anchor's AREA_MATCHED_CONTROL view -- and therefore that anchor -- fails closed and is excluded from all downstream scoring and statistics; it is not silently skipped, it is recorded as EXCLUDED_NO_VALID_CONTROL"

##############################################################################
# 12. GAUSSIAN BLUR -- PADDING MODE NOW EXPLICITLY FROZEN (FINDING 4 REPAIR)
##############################################################################

[gaussian_blur]
source = "torchvision.transforms.functional.gaussian_blur"
kernel_size = [31, 31]
sigma = [8.0, 8.0]
padding_mode = "reflect"
padding_mode_prohibited_alternatives = ["constant", "zero", "replicate", "circular"]
padding_mode_rationale = "The scientific contract defines reflection padding explicitly and independently of any library default, so a later implementation must reproduce reflect-padding semantics even if a future torchvision version changes its own default behavior."
padding_mode_verification_method = "static source read (not imported/executed) of the installed torchvision package"
padding_mode_verified_torchvision_version = "0.27.0+computecanada"
padding_mode_verified_source_path = "/scratch/haree/venv/talk2dino-a100/lib/python3.11/site-packages/torchvision/transforms/_functional_tensor.py"
padding_mode_verified_source_lines = "746-764"
padding_mode_verified_evidence = "the installed tensor-path implementation computes padding=[kernel_size[0]//2]*2+[kernel_size[1]//2]*2 and calls img = torch_pad(img, padding, mode=\"reflect\") before conv2d; this matches the documented behavior in transforms/functional.py's gaussian_blur docstring ('The convolution will be using reflection padding corresponding to the kernel size, to maintain the input shape.'). This version (0.27.0) also matches the TorchVision version recorded in the Step 0 GPU smoke-test log (output/e3-paired-soft-routing-tau010/log.txt and closure job 22357843), confirming it is the actually-relevant environment, not an unrelated one."
randomness = false
color_jitter = false
resize_applied = false
crop_change_applied = false
inpainting_applied = false
generative_model_used = false
feathering_applied = false
gt_used = false
deterministic = true
intervention_domain = "the already-frozen tensor/value domain established by [region].operates_on (BEFORE E3 normalization, BEFORE the model's BGR-to-RGB channel swap)"
unchanged_region_verification_requirement = "the later implementation must verify, for every generated view, that pixels in the required-unchanged domain (the frozen region mask from [interventions.*].unchanged_domain) are bit-exactly identical to ORIGINAL before that view's scores are used"

##############################################################################
# 13. SCORE DEFINITIONS (FROZEN FORMULAS) -- FORMULAS UNCHANGED; EXPLICIT
# FAIL-CLOSED INPUT/OUTPUT PRECONDITIONS ADDED (FINDING 3 REPAIR)
##############################################################################

[scores]
cosine_score_range = [-1.0, 1.0]
score_location = "the center anchor patch position, native 32x32 patch-grid resolution, evaluated within the SAME single 448x448 window used for anchor/query selection"

[scores.formulas]
s_original_q = "pre-sigmoid cosine score at the center anchor patch in ORIGINAL, for query class q"
s_context_q = "pre-sigmoid cosine score at the center anchor patch in CONTEXT_BLURRED, for query class q"
s_region_q = "pre-sigmoid cosine score at the center anchor patch in REGION_BLURRED, for query class q"
s_control_q = "pre-sigmoid cosine score at the center anchor patch in AREA_MATCHED_CONTROL, for query class q"
context_change_q = "abs(s_context(q) - s_original(q))"
region_drop_q = "max(0, s_original(q) - s_region(q))"
control_change_q = "abs(s_control(q) - s_original(q))"
context_stability_q = "1 - min(1, context_change(q) / 2)"
specific_region_drop_q = "max(0, region_drop(q) - control_change(q))"
region_necessity_q = "min(1, specific_region_drop(q) / 2)"
intervention_reliability_q = "context_stability(q) * region_necessity(q)"
intervention_reliability_range = [0.0, 1.0]

[scores.validity]
input_finiteness_required = true
input_range_required = [-1.0, 1.0]
input_fields_checked = ["s_original(q)", "s_context(q)", "s_region(q)", "s_control(q)"]
input_check_order = "every one of the four input fields is checked for finiteness AND for membership in [-1.0, 1.0] BEFORE any min, max, subtraction, division, or multiplication in [scores.formulas] is evaluated for that (anchor, q) record"
input_failure_behavior = "if ANY input fails either check, the derived formulas (context_change, region_drop, control_change, context_stability, specific_region_drop, region_necessity, intervention_reliability) are NOT evaluated for that record; the record is marked STRUCTURALLY_INVALID, an explicit non_finite_or_out_of_range_input counter is incremented, and this counts against [gates.A].max_non_finite_scores (which must be exactly 0) and against [gates.A].min_structural_validity_fraction"
input_failure_prohibited_actions = ["clamp", "impute", "replace_with_default", "silently_launder_into_a_finite_output"]
output_finiteness_required = true
output_range_required = [0.0, 1.0]
output_fields_checked = ["intervention_reliability(q)"]
output_check_note = "output finiteness/range is a SEPARATE, second check performed AFTER formula evaluation, for records that already passed the input check; it exists to catch arithmetic-level failures distinct from bad inputs and is NOT a substitute for the input check"
nan_laundering_hazard_acknowledged = true
nan_laundering_hazard_note = "Python's builtin min(1, x) and max(0, x), with the constant listed FIRST (exactly the argument order used in [scores.formulas].context_stability_q, region_necessity_q, region_drop_q, specific_region_drop_q), do NOT propagate NaN: min(1, float('nan')) == 1 and max(0, float('nan')) == 0 (confirmed empirically against CPython 3.11). A NaN s_original(q) can therefore reach a finite, in-range, Gate-A-passing intervention_reliability of exactly 0.0 unless the mandatory input_finiteness_required/input_range_required check above runs BEFORE, not instead of, the formulas."
loader_enforcement_requirement = "the identity loader and its tests must reject any contract mutation that removes, weakens, or reorders away either the input-finiteness/input-range requirement or the output-finiteness/output-range requirement"

[scores.constraints]
no_threshold_introduced = true
no_temperature_introduced = true
no_learned_coefficient_introduced = true
no_normalization_statistic_introduced = true
no_per_class_tuning_introduced = true
primary_signal_name = "intervention_reliability"

