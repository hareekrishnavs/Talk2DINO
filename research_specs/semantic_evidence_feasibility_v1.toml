[propagation_target_authority.t0_definition]
concept = "the original, unmodified E3 unary prediction"
computed_from = "the ORIGINAL view only (no intervention view, no propagation)"
score_field = "the committed E3 pre-sigmoid cosine score field; see [scores].score_location and [e3_geometry].unary_score_definition"
predicted_class_rule = "argmax over the frozen 171-class order (lowest class index on ties)"
