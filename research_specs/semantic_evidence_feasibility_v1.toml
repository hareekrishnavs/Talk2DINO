patch_grid_indexing = "row-major, 0-indexed: patch_index = row * 32 + col, for row,col in [0,31]"
patch_grid_indexing_source = "dinotext.py:335-337 reshape from (b, num_patches, c) to (b, np_h, np_w, c) assumes the flattened patch sequence is row-major (standard ViT flattening convention)"
window_mode = "slide"
crop_size_pixels = [448, 448]
stride_pixels = [224, 224]
window_geometry_source = "src/open_vocabulary_segmentation/segmentation/configs/_base_/datasets/stuff.py:38 test_cfg = dict(mode='slide', stride=(224,224), crop_size=(448,448))"
window_ordering = "row-major over the sliding-window grid: window_index = h_idx * w_grids + w_idx, both loop variables 0-indexed"
window_ordering_source = "dinotext_seg.py:87-88 slide_inference: 'for h_idx in range(h_grids): for w_idx in range(w_grids):'"
border_excluded_patch_rings = 1
eligible_grid_range = [1, 30]
eligible_grid_range_derivation = "32x32 grid, 0-indexed 0..31; excluding the one-patch outer border leaves row,col in [1,30] inclusive: 30x30 = 900 eligible patches per window"
eligible_patches_always_have_8_grid_neighbors = true
eligible_patches_always_have_8_grid_neighbors_derivation = "for any (row,col) with row,col in [1,30] on a [0,31] grid, all 8 neighbors (row+-1,col+-1) also lie within [0,31]; therefore 'valid 8-neighbor' for any eligible patch is unconditionally all 8 grid neighbors, with no edge truncation"
tie_behavior = "lowest class index (PyTorch argmax/topk convention: first occurrence among exact ties)"
tie_behavior_source = "dinotext_seg.py:143 simple_test: prediction = self.inference(...).argmax(dim=1); Step 0 baseline_report.md section 2"
prompt_template_set = "sub_imagenet_template"
prompt_template_count = 7
prompt_template_source = "src/open_vocabulary_segmentation/datasets/templates.py:99-107"
pamr_active = false
pamr_source = "output/e3-paired-soft-routing-tau010/log.txt:135 'pamr=False'; resolved config evaluate.pamr=false"
unary_score_definition = "the raw, pre-sigmoid cosine similarity value (the 171-dimensional 'simmap' tensor from DINOTextMasker.forward_seg, masker.py, BEFORE torch.sigmoid) at a single patch position, computed from a single 448x448 window in isolation -- NOT the sliding-window-accumulated, softmax-normalized, cross-window final prediction used for whole-image mIoU"
unary_top1_top2_definition = "unary_top1 = argmax over the 171-dim unary score vector at the patch (lowest class index on ties); unary_top2 = the class with the second-highest unary score at the same patch (lowest class index on ties, excluding the top-1 class)"

