##############################################################################
# FROZEN CONTRACT: talk2dino semantic-evidence feasibility study, v1
#
# This file is a closed specification. It defines a bounded feasibility
# study; it is not an implementation and it authorizes no execution beyond
# what [authorization] explicitly grants. See docs/semantic_evidence_feasibility_protocol.md
# for prose explanation. src/semantic_evidence_feasibility_identity.py is the
# Torch-free loader/validator for this file and for
# evaluation_subsets/semantic_evidence_feasibility_96.json.
#
# Do not edit values in this file after independent verification without
# re-running that verification. Changing any frozen value after results are
# observed defeats the purpose of freezing it.
#
# REVISION NOTE (RESOLVE_SEMANTIC_EVIDENCE_CONTRACT_BLOCKERS): this revision
# repairs five findings from an independent adversarial verification:
#   1. T0/T320 propagation-target source authority was undefined -> added
#      [propagation_target_authority]; T0 is now bound, T320 is explicitly
#      DEFERRED and non-computable.
#   2. The statistical unit of analysis was ambiguous between anchor-level
#      and anchor-query-level rows -> [statistics] rewritten into two
#      explicit tasks (query_correctness, propagation_outcome) and exactly
#      four named model fits.
#   3. The frozen score formulas could silently launder NaN into a finite,
#      Gate-A-passing output under Python's constant-first min/max ordering
#      -> added [scores.validity] with mandatory input/output fail-closed
#      preconditions.
#   4. Gaussian-blur padding/border behavior was unspecified -> added
#      padding_mode = "reflect" to [gaussian_blur], independently verified
#      against the installed torchvision==0.27.0+computecanada source.
#   5. The external projection-checkpoint path field name risked being read
#      as a git-tracked-repository claim -> renamed to
#      external_untracked_checkout_relative_path with explicit git_tracked
#      = false evidence.
# The 96-image population, its order, its 48/48 split, and every frozen
# digest are UNCHANGED by this revision.
##############################################################################

[schema]
name = "semantic_evidence_feasibility_contract"
version = "1.1.0"
created_at_utc = "2026-09-21T02:00:00Z"
revised_at_utc = "2026-09-21T04:00:00Z"
task = "FREEZE_SEMANTIC_EVIDENCE_FEASIBILITY_CONTRACT"
