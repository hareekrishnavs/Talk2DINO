##############################################################################
# 16. SIMPLE CONTROL FEATURES (NON-GT)
##############################################################################
# Controls 1 and 8 are now explicitly query-parameterized (Finding 2 repair):
# control 1 was previously hardcoded to query_1 regardless of which row's
# query it fed, and control 8 was previously a same-anchor average over both
# queries. Both are now defined as functions of "the row's own query q",
# with q bound per-task in [statistics.tasks.*.feature_order] (q1 or q2 for
# query_correctness rows, always q1 for propagation_outcome rows).

[[control]]
id = 1
name = "top1_unary_score"
formula = "s_original(q) -- the raw pre-sigmoid cosine score of the anchor patch's query class q, in ORIGINAL. q is parameterized per the consuming task: for query_correctness rows q is the row's own query (q1 or q2); for propagation_outcome rows q is fixed at q1."
finite_required = true

[[control]]
id = 2
name = "top1_minus_top2_margin"
formula = "unary_margin at the anchor patch (see [anchor_selection].unary_margin_definition), in ORIGINAL"
finite_required = true

[[control]]
id = 3
name = "unary_entropy"
formula = "-sum(p_i * log(p_i)) over i in 1..171, where p = numerically_stable_softmax(raw 171-dim unary score vector at the anchor patch, ORIGINAL); numerically_stable_softmax subtracts the max logit before exponentiation"
finite_required = true

[[control]]
id = 4
name = "dino_neighbor_cosine_similarity"
formula = "cosine_similarity(anchor_patch_dino_feature, mean(eight_neighbor_dino_features)), using the raw (unprojected) DINOv2 patch embeddings, ORIGINAL view only. Per e3_geometry.eligible_patches_always_have_8_grid_neighbors, this is always defined for eligible anchors with no edge case."
finite_required = true

[[control]]
id = 5
name = "normalized_distance_to_nearest_boundary"
formula = "raw_distance = min over all boundary-flagged eligible patches p_b in the window of Euclidean distance, in patch-grid units, between the anchor patch coordinates and p_b's coordinates (0 if the anchor itself is boundary); normalized_distance = min(1, raw_distance / normalization_constant)"
normalization_constant = 41.012193308819754
normalization_constant_derivation = "sqrt((30-1)^2 + (30-1)^2) = sqrt(29^2 + 29^2), the maximum possible Euclidean distance in patch-grid units between two patches within the 30x30 eligible region ([1,30]x[1,30])"
missing_value_condition = "the window contains zero boundary-flagged eligible patches (fully interior-uniform window)"
missing_value_treatment = "recorded as null/NOT_AVAILABLE for that anchor's control 5; the anchor is not excluded from other controls on this account alone, but is excluded from any statistical model that requires control 5 to be non-missing (see [statistics].missing_value_policy)"
finite_required = "when not missing"

[[control]]
id = 6
name = "local_top1_agreement_fraction"
formula = "(count of the patch's 8 grid neighbors whose unary_top1 class equals the anchor patch's own unary_top1 class) / 8"
finite_required = true

[[control]]
id = 7
name = "ordinary_augmentation_score_change"
status = "NOT_AVAILABLE_IN_E3"
justification = "src/open_vocabulary_segmentation/segmentation/configs/_base_/datasets/stuff.py test_pipeline includes a RandomFlip transform, but it is constructed with flip=False (both in the MultiScaleFlipAug wrapper and the transform itself), making it an unconditional no-op. No other deterministic ordinary augmentation is applied in the E3 evaluation preprocessing pipeline. Per task instruction, this control is recorded as unavailable rather than inventing a new augmentation to populate it."
used_by_any_task = false

[[control]]
id = 8
name = "area_matched_control_change"
formula = "control_change(q) as defined in [scores.formulas], parameterized by the SAME q as control 1 for the current row (the row's own query for query_correctness rows; fixed q1 for propagation_outcome rows) -- NOT hardcoded to q1, NOT averaged over both queries"
finite_required = true

[statistics.missing_value_policy]
rule = "a row is excluded from ALL statistical fitting and evaluation populations (both discovery and locked_holdout, for the row's own task) if it has any missing/non-finite required control value for the model being fit, a missing/non-finite intervention_reliability value (Model B only), or is EXCLUDED_NO_VALID_CONTROL or STRUCTURALLY_INVALID (see [scores.validity]). Excluded rows are counted and reported as EXCLUDED_MISSING_FEATURE; no imputation is performed."

