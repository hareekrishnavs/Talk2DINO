##############################################################################
# 1. RESEARCH QUESTION AND CLAIM BOUNDARY
##############################################################################

[research_question]
primary_question = """
Can controlled region-preserving and region-removing image interventions
identify whether a local visual region provides reliable evidence for a text
concept, beyond information already available from confidence, DINO
similarity, spatial location, predicted boundaries, and ordinary augmentation
consistency?
"""
study_type = "feasibility_study"
study_evaluates = "whether_a_signal_exists"
required_terms = [
    "controlled intervention",
    "intervention-derived reliability",
    "evidence reliability",
]
causal_claim_prohibited = true
causal_claim_condition = "A future successor task may use causal language only if it supplies and independently verifies the causal assumptions this contract does not establish (e.g. no-unmeasured-confounding, consistency, positivity for the intervention-as-treatment framing). This contract makes no such claim and no such verification."

disallowed_claims = [
    "a final segmentation method",
    "a causal effect",
    "an accuracy improvement",
    "a +1.5 mIoU result",
    "a deployable adapter",
    "a propagation replacement",
    "a world-model method",
    "training",
    "a full evaluation",
    "publication novelty",
    "a runtime improvement",
]

