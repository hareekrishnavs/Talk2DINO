required_symbol = "build_directed_topk_graph"
node_source = "L2-normalized DINO patch features, tensor shape [N, D] (N = patch-grid nodes, D = embedding dim)"
node_ordering = "the caller's own patch-grid row-major flattening order; graph.py imposes no reordering"
patch_grid_ordering = "external to graph.py; inherited from the [D-dim feature, N-node] tensor layout the caller supplies"
k = 12
similarity_formula = "cosine similarity, realized as the plain dot product of already-L2-normalized features: affinities = features_float @ features_float.T (features_float = dino_features cast to float32; input L2-normalization is validated, not performed, by this function -- non-unit-norm input raises ValueError)"
negative_affinity_handling = "clamp_min_(0) applied before raising to affinity_power -- negative cosine similarities are floored to exactly 0.0"
affinity_power = 3.0
affinity_power_application = "affinities.pow_(affinity_power), applied after the clamp_min_(0) floor"
self_loop_policy = "affinities.fill_diagonal_(-inf) excludes self-similarity from top-k neighbor selection; a node's own index is never among its k neighbors UNLESS it falls into the zero-degree fallback path below"
directed_symmetric_behavior = "directed, row-stochastic; explicitly NOT symmetrized (graph.py docstring: 'COVER-DR uses a directed row-stochastic graph. Do not symmetrize')"
deterministic_neighbor_tie_breaking = "torch.argsort(affinities, dim=1, descending=True, stable=True)[:, :k] -- a stable sort, so for exactly-tied affinity values the lower original column index is selected first"
normalization_direction = "row-wise: each row of transition_weights sums to 1 over its k selected edges (right-stochastic / row-stochastic), computed as edge_affinities / row_sums per row"
zero_degree_behavior = "if a row's k selected edge_affinities all sum to exactly 0 (self_loop_fallback), that row's neighbor_indices[:,0] is set to the row's own node index and transition_weights[:,0] is set to 1.0 -- a self-loop with weight 1, not an error and not a uniform-degree fallback"
dtype = "float32 (dino_features is cast to torch.float32 via features_float = dino_features.detach().to(torch.float32) before any arithmetic)"
device_preserving = "no .cpu()/.cuda() call; all constructed tensors are created on dino_features.device"
matmul_orientation = "DirectedTopKGraph.matmul(rhs) computes A @ rhs as (transition_weights * rhs[neighbor_indices]).sum(dim=1) -- a gather-weight-reduce over each node's own k outgoing edges, i.e. row i of the output is the weighted sum of P at row i's k selected neighbors"
matmul_dtype_behavior = "transition_weights are cast to rhs.dtype before multiplication (weights.to(dtype=rhs.dtype)); matmul output dtype follows the caller-supplied rhs dtype, not a value hardcoded inside graph.py"

