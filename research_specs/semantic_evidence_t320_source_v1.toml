required_symbol = "finite_step_propagate"
formula = "P(0) = S0; P(t+1) = alpha * A @ P(t) + (1 - alpha) * S0, for t = 0 .. steps-1, evaluated for exactly steps=320 completed updates"
alpha = 0.98
restart_coefficient = 0.02
restart_coefficient_derivation = "1 - alpha = 1 - 0.98 = 0.02, applied as exactly one (1-alpha) factor per step (docstring: 'Exactly one (1-alpha) factor is applied per step')"
steps = 320
initialization = "p = s0_owned.clone(); s0_owned = s0.detach().clone() taken once, before the loop"
matrix_multiplication_orientation = "alpha_value * graph.matmul(p) -- graph.matmul realizes A @ p per [graph_contract].matmul_orientation; p is a [N, C] tensor (N nodes, C = class/score channels)"
tensor_axes = "[N, C]: dim 0 = node (patch), dim 1 = channel (class score)"
update_order = "p is REASSIGNED each iteration to a new tensor (p = alpha_value * graph.matmul(p) + one_minus_alpha * s0_owned); s0_owned is read every step and never itself updated"
s0_mutation = "s0 is never mutated in place: a defensive .detach().clone() is taken immediately on entry, before the loop starts"
no_convergence_test = true
no_early_stopping = true
no_tolerance = true
no_adaptive_step_count = true
no_cgls_gmres_dense_solve_or_fallback = true
steps_type_requirement = "exact positive int, minimum=1; bool rejected (isinstance(steps, bool) is checked and rejected before the int check)"
alpha_type_requirement = "finite float satisfying 0 <= alpha < 1"
propagation_dtype_note = "finite_step_propagate itself is dtype-agnostic: FiniteStepTrace.dtype = p.dtype, inherited from whatever dtype s0 arrives as; it does not internally cast to float32. The concrete float32 usage bound below is a property of the caller's S0 preparation, independently cross-confirmed against 5 frozen identity TOMLs (including evaluation_identities/e12_matched_k11_k12_t320.toml: compute_dtype = \"float32\", output_dtype = \"float32\")"
