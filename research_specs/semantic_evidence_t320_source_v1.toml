non_finite_failure_policy = "_require_finite_tensor(p, ...) raises FiniteStepRegimeError if the final result p, or any captured snapshot, contains a non-finite value; checked after the loop completes, for the final result and every requested snapshot"
deterministic_behavior_requirement = "graph.matmul's gather-weight-reduce (not index_add_ with repeated destinations) is deterministic on both CPU and CUDA; graph.py's own docstring notes the incoming-edge order is precomputed specifically because CUDA index_add_ with repeated destinations is nondeterministic -- that nondeterministic path is not used by matmul (only by transpose_matmul, which finite_step_propagate does not call)"
