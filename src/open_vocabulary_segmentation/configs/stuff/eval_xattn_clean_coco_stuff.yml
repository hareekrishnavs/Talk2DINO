_base_: xattn_clean_coco_stuff.yml

method_name: Talk2DINO_XAttnBridge_Clean

evaluate:
  pamr: false
  cars_enabled: false
  vpa_enabled: false
  template: sub_imagenet_template
  task:
    - coco_stuff
  coco_stuff: src/open_vocabulary_segmentation/segmentation/configs/_base_/datasets/stuff.py

cars:
  enabled: false
  hidden_dim: 64
  dropout: 0.0
  base_scale: 0.25
  delta_scale_max: 0.10
  alpha_min: 0.05
  alpha_max: 0.50
  init_zero: true
  allow_missing_init: false
  force_fixed_alpha: false
  fixed_alpha: 0.25

vpa:
  enabled: false

postprocess:
  mode: none
