_base_: "eval.yml"

data:
  batch_size: 256
  pin_memory: true
  num_workers: 0
  seed: ${train.seed}
  dataset:
    meta:
      gcc3m:
        type: img_txt_pair
        path: ./data/gcc3m
        prefix: gcc-train-{000000..00347}.tar
        length: 2881393
      gcc12m:
        type: img_txt_pair
        path: ./data/gcc12m
        prefix: cc-{000000..001175}.tar
        length: 11286526
    train:
      - gcc3m
      - gcc12m

  img_aug:
    deit_aug: true
    img_size: 224
    img_scale: [0.08, 1.0]
    interpolation: bilinear
    color_jitter: 0.4
    auto_augment: 'rand-m9-mstd0.5-inc1'
    re_prob: 0.25
    re_mode: 'pixel'
    re_count: 1
  text_aug: null

train:
  start_step: 0
  total_steps: 50000
  warmup_steps: 20000
  ust_steps: 0
  base_lr: 1.6e-3
  weight_decay: 0.05
  min_lr: 4e-5
  clip_grad: 5.0
  fp16: true
  fp16_comm: true # use fp16 grad compression for multi-node training
  seed: 42
  auto_resume: false
  save_every_steps: 5000
  debug_one_step: false
  max_steps: null
  max_train_hours: 8
  hard_stop_hours: 10

  lr_scheduler:
    name: cosine

  optimizer:
    name: adamw
    eps: 1e-8
    betas: [0.9, 0.999]

evaluate:
  pamr: false
  kp_w: 0.0
  bg_thresh: 0.5

  save_logits: null

  eval_only: false
  eval_during_training: true
  eval_freq: 5000
  template: simple
  task:
    - voc
    - voc20
    - context
    - context59
    - coco_stuff
    - coco_object
    - cityscapes
    - ade20k

sg_gate:
  enabled: false
  ablation_mode: full_e1_e2_e3
  debug_force_raw_output: false
  debug_force_raw_apply_pamr: false
  sg_path_raw_baseline_miou: null
  cluster_method: connected_components
  compute_dense_affinity: false
  use_spectral_clustering: false
  e0_no_pamr_miou: null
  e0_pamr_miou: null
  sg_no_pamr_best_miou: null
  sg_full_soft_pamr_best_miou: null
  sg_path_raw_pamr_miou: null
  e1_seed_only_pamr_miou: null
  full_sg_soft_pamr_miou: null
  shuffle_prior:
    enabled: false
    mode: class_permutation
    seed: 42
  random_prior:
    enabled: false
    mode: matched_seed_density
    seed: 42
    match_density_source: seed_only
  seed_overlap_clusters:
    min_seed_overlap: 0.01
  raw_fallback:
    enabled: true
    min_area_ratio: 0.60
    max_area_ratio: 1.60
    min_agreement_iou: 0.35
    min_raw_area_pixels: 16
    allow_sg_when_raw_empty: false
    fallback_if_sg_empty: true
    fallback_if_raw_empty_and_no_anchor: true
  dense_raw_fallback:
    enabled: true
  soft_reweight:
    enabled: true
    disable_hard_overwrite: true
    lambda_boost: 0.10
    topk_guard: 5
    margin_guard: 0.05
    normalize_prior: true
    score_scale: std
    candidate_source: anchored_clusters
    min_soft_gate_score: 0.35
    require_semantic_anchor: true
    raw_support_topk: 5
    min_cluster_raw_topk_support: 0.10
    guard_mode: current_or
    uncertainty_margin: 0.03
    apply_pamr_after_soft: false
    only_trusted_clusters: false
  alignment_audit:
    enabled: true
    max_logged_examples: 0
    save_debug_images: false
    save_debug_tensors: false
  top_percent: 3.0
  tau_edge: 0.55
  max_clusters: 16
  min_cluster_area: 8
  score_anchor_threshold: 0.30

  tau_pos_thing: 0.45
  tau_ignore_thing: 0.30
  tau_pos_stuff: 0.35
  tau_ignore_stuff: 0.22

  use_scratch_cache: false
  scratch_cache_dir: null

  strict_eval: true
  diagnostic_ignore_eval: false

xattn_bridge:
  enabled: false
  type: text_queries_dino
  d_model: 256
  num_heads: 4
  num_layers: 1
  dropout: 0.0
  use_residual_mlp: true
  gamma_init: 1.0
  freeze_clip: true
  freeze_dino: true
  train_bridge_only: true
  normalize_text: true
  normalize_patches: true
  debug_base_only: false
  force_gamma_zero: false
  disable_correction: false
  debug_compare_base_projection: false
  debug_tensor_parity: false
  hard_return_base: false
  safe_init: true
  zero_init_out_proj: true
  normalize_correction: true
  correction_ratio_clamp: true
  max_correction_base_ratio: 0.05
  base_source: original_talk2dino_proj
  gamma_max: null
  correction_ratio_warn: 0.20
  correction_ratio_stop: null

postprocess:
  mode: none


checkpoint:
  resume: ''
  save_topk: 0
  save_all: false  # if true, save every evaluation step


model_name: "default"  # display name in the logger
output: ???
tag: default
print_freq: 20
seed: 42
wandb: false
