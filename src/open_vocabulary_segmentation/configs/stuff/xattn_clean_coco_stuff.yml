method_name: Talk2DINO_XAttnBridge_Clean

data:
  batch_size: 64
  num_workers: 16
  pin_memory: true
  prefetch_factor: 1
  shard_cache_size: 2
  preload_cache: false
  persistent_workers: false
  features_name: disentangled_self_attn
  visual_features_name: disentangled_self_attn
  patch_features_name: disentangled_self_attn
  allow_patch_visual_same_fallback: true
  text_features: ann_feats
  mmap_features: false
  train_ann_path: /scratch/haree/talk2dino_features/coco_stuff2017_vitb/train.pth
  train_image_dir: /scratch/haree/coco_stuff164k/images/train2017

model:
  type: DINOText
  model_name: dinov2_vitb14_reg
  resize_dim: 448
  backbone_weights: /scratch/haree/weights/dinov2_vitb14_reg4_pretrain.pth
  clip_model_name: ViT-B/16
  clip_model_path: /scratch/haree/weights/ViT-B-16.pt
  proj_class: vitb_mlp_infonce
  proj_model: ProjectionLayer
  proj_name: vitb_mlp_infonce
  pre_trained: true
  use_avg_text_token: false
  keep_cls: false
  keep_end_seq: false

bridge:
  clip_dim: 512
  dino_dim: 768
  d_model: 256
  num_heads: 4
  num_layers: 1
  dropout: 0.0
  residual_gamma_init: 0.01
  residual_gamma_max: 0.05
  clamp_delta_base_ratio: 0.10
  base_guided_attention: true
  base_guidance_beta: 1.0
  base_guidance_stopgrad: true
  base_guidance_normalize: true
  base_guidance_temperature: 1.0

xattn_safety:
  enabled: true
  delta_l2_weight: 0.001
  ratio_target: 0.07
  ratio_penalty_weight: 0.02
  min_base_mapped_cosine: 0.98
  cosine_penalty_weight: 0.01
  attn_prior_weight: 0.01
  attn_prior_temperature: 0.07
  patch_preserve_weight: 0.005
  patch_preserve_temperature: 0.5
  stop_if_ratio_above: 0.30
  warn_if_ratio_above: 0.20

ccr:
  enabled: false

cpa:
  enabled: true
  version: v1
  num_prototypes: 4
  hidden_dim: 256
  prototype_scale: 0.10
  prototype_aggregation: logsumexp
  prototype_temperature: 0.07
  normalize: true
  topk: 5
  residual_scale: 0.25
  residual_clip: 0.5

cpa_loss:
  enabled: true
  prototype_infonce_weight: 0.20
  preserve_weight: 0.01
  temperature: 2.0
  confident_margin: 0.20
  diversity_weight: 0.001
  diversity_margin: 0.90
  residual_l1_weight: 0.001

vcdd:
  enabled: true
  compact_attention: true
  train_attention_path: /scratch/haree/talk2dino_features/coco_stuff2017_vitb/vcdd_attention_lift_train_fp16.pt
  val_attention_path: /scratch/haree/talk2dino_features/coco_stuff2017_vitb/vcdd_attention_lift_val_fp16.pt
  hidden_dim: 256
  dropout: 0.0
  scale: 0.05
  residual_clip: 0.25
  topk: 5
  topk_source: cpa
  detach_attention: true

vcdd_loss:
  enabled: true
  ce_weight: 0.05
  kl_weight: 0.02
  preserve_weight: 0.01
  residual_l1_weight: 0.001
  teacher_temperature: 0.07
  kl_temperature: 0.07
  preserve_temperature: 0.07
  min_prob: 0.30
  min_margin: 0.10
  max_entropy: 0.70
  min_reliable_fraction: 0.05
  entropy_sharpen_weight: 0.0

cpa_router:
  enabled: false

usrc:
  enabled: false

extract:
  batch_size: 64
  shard_size: 500
  max_items: null

train:
  epochs: 100
  batch_size: 64
  max_batches: null
  auto_resume: true
  resume: null
  progress_interval: 10
  shuffle: true
  lr: 1.0e-4
  contrastive_temperature: 0.07
  min_lr: 1.0e-6
  weight_decay: 0.01
  fp16: true
  save_every: 10

evaluate:
  pamr: false
  ccr_enabled: false
  cpa_enabled: true
  vcdd_enabled: true
  cpa_router_enabled: false
  usrc_enabled: false
  template: sub_imagenet_template
  xattn_delta_scale: 0.5
  xattn_logit_alpha: 0.5
  xattn_uncertainty_gate_enabled: true
  xattn_margin_gate_enabled: false
  xattn_margin_threshold: 0.05
  task:
    - coco_stuff
  coco_stuff: src/open_vocabulary_segmentation/segmentation/configs/_base_/datasets/stuff.py

postprocess:
  mode: none
