timeout_must_not_silently_relax_limit = true
runtime_claim_before_real_job_executed_forbidden = true

# ---------------------------------------------------------------------
# Checkpoint / resume contract.
# ---------------------------------------------------------------------

[checkpoint_resume_contract]
accepted_modes = ["fresh", "resume", "finalize_only_via_resume"]
checkpoint_state_machine_source = "dependency_bindings.e22_artifacts [checkpoint_schema.state_machine]"
