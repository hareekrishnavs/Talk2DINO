atomic_final_installation_required = true
staged_validation_required = true
post_install_reopen_and_reverification_required = true
artifact_write_policy_source = "dependency_bindings.e22_artifacts [artifact_write_policy]"

# ---------------------------------------------------------------------
# Authorization boundary.
# ---------------------------------------------------------------------

[authorization_boundary]
gpu_execution_authorized_by_this_identity = true
device_type_authorized = "cuda"
gpu_count_authorized = 1
gpu_model_authorized = "h100_80gb"
max_wall_time_authorized = "05:00:00"
development_execution_authorized = true
confirmation_split_access_authorized = false
other_4500_image_access_authorized = false
full_5000_image_evaluation_authorized = false
