# ---------------------------------------------------------------------
# Historical exclusions: identical in spirit to E22's own -- these
# authorities are not real dependencies of a real BALP execution
# either, and E23 does not newly introduce a dependency on any of them.
# ---------------------------------------------------------------------

[historical_exclusions]
list = [
    "e19-dfp-phase1b-conservation-tolerance: rho_g residual tolerance for exact masked-forward provenance; BALP performs no masked-forward propagation",
    "e20-dfp-phase1b-diagnostic-execution: the discontinued exact-provenance 500-image diagnostic runner; a real BALP execution neither executes, resumes, nor checkpoints through it",
    "e21-dfp-phase1b-provenance-features: the eight component-evidence Stage-A fields; BALP constructs no component and consumes none of them",
    "e15-dfp-phase1b-protocol / e15-dfp-phase1b-artifacts / e16-dfp-phase1b-conservation-calibration: the masked-forward Stage-A/Stage-B schemas and 200-window conservation calibration; a real BALP execution's method/split/artifact schemas are independent of all of these",
]
e19_e20_e21_required_by_balp_execution = false
e15_e16_required_by_balp_execution = false
note_on_shared_adapter_identity_loads = "dependency_bindings.production_provider_module's own _load_production_identities also loads the E15 phase1b_identity and E3 identity as part of shared production-adapter infrastructure it reuses from DFP Phase 1A's own driver; these loaded values are never read by BALP's scientific formulas (identical to E22's own historical_exclusions), and E23 does not bind E15 or a specific E3 TOML filename as a scientific dependency -- the exact E3 identity is determined transitively, at load time, by dependency_bindings.e13_protocol's own [parent_identities].e3_identity_path, never independently re-chosen here"

# ---------------------------------------------------------------------
# Precision: bound by reference only, never a new value.
# ---------------------------------------------------------------------

[precision]
compute_dtype_source = "dependency_bindings.matched_evaluator [runtime].compute_dtype"
compute_dtype = "float32"
output_dtype_source = "dependency_bindings.matched_evaluator [runtime].output_dtype"
output_dtype = "float32"
precision_source_description = "full_precision_area_statistics_from_mmseg_pre_eval, identical to dependency_bindings.matched_evaluator's own frozen convention"
new_precision_setting_introduced = false

# ---------------------------------------------------------------------
# Scientific execution contract (section 10 of the authorizing task):
# exactly what a real execution must do per selected window, and what
# it must fail closed on.
# ---------------------------------------------------------------------

[scientific_execution_contract]
model_forwards_per_window = 1
graph_constructions_per_window = 1
recurrence_trajectories_per_window = 1
horizon_snapshots_reused_from_single_trajectory = [0, 16, 32, 64, 320]
candidates_evaluated_per_image_without_additional_recurrence = 16
controls_evaluated_per_image_without_additional_recurrence = 5
second_recurrence_trajectory_per_candidate_forbidden = true

[scientific_execution_contract.fail_closed_on]
list = [
    "model_or_source_binding_mismatch",
    "dataset_order_mismatch",
    "confirmation_or_non_development_image_requested",
    "filename_or_relative_path_identity_mismatch",
    "second_recurrence_trajectory_triggered_by_any_candidate",
    "development_window_universe_binding_mismatch",
]

# ---------------------------------------------------------------------
# Frozen development population and access contract.
# ---------------------------------------------------------------------

[population]
development_image_count = 350
development_image_ids_source = "dependency_bindings.balp_split_artifact development_image_ids, identical order (ranks 0..349)"
confirmation_image_count_accessible = 0
other_validation_images_accessible = 0
window_count = 769
window_count_source = "dependency_bindings.development_window_universe.window_count"
window_universe_digest = "b4672854e38199deef26c154a30e45c1835c201a4dbcf046aa29e7fdf12df9e6"
window_universe_digest_source = "dependency_bindings.development_window_universe.canonical_record_digest"
candidate_count = 16
control_count = 5
candidate_ids_source = "dependency_bindings.e22_preservation [candidate_family.ordered_candidate_ids]"
control_ids_source = "dependency_bindings.e22_preservation [candidate_family.canonical_controls]"

# ---------------------------------------------------------------------
# Resource contract (operational values explicitly authorized by the
# authorizing task prompt; CPU/memory reuse the established H100-class
# launcher precedent, dfp_phase1b_chunk_benchmark_h100.sbatch).
# ---------------------------------------------------------------------

[resource_contract]
device_type = "cuda"
gpu_count = 1
gpu_model = "h100_80gb"
max_wall_time = "05:00:00"
cpus_per_task = 8
host_memory = "80G"
account_convention = "rrg-yangw (GPU jobs, per the repository's own established account/partition convention -- see dfp_phase1b_chunk_benchmark_h100.sbatch; never invented)"
