required_hash_bindings_in_result = [
    "e22_protocol_sha256", "e22_artifacts_sha256", "e23_sha256",
    "e13_protocol_sha256", "matched_evaluator_sha256", "subset_manifest_sha256",
    "balp_split_sha256", "development_window_universe_sha256", "balp_runner_commit",
]
selected_candidate_field_authorized = false
selected_candidate_field_requires = "e22-defined selection_schema (dependency_bindings.e22_artifacts [selection_schema]), applied as a separate later analysis step -- never embedded in the development_result document itself"

# ---------------------------------------------------------------------
# Profiling contract: reuses E22's profiling schema verbatim.
# ---------------------------------------------------------------------

[profiling_contract]
schema_source = "dependency_bindings.e22_artifacts [profiling_schema]"
affects_scientific_digest = false
profiling_on_off_scientific_output_equivalence_required = true

# ---------------------------------------------------------------------
# Output path and overwrite policy.
# ---------------------------------------------------------------------

[output_path_policy]
