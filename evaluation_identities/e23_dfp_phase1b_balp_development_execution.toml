format_version = "talk2dino-dfp-phase1b-balp-development-execution-identity-v1"

# This identity authorizes REAL EXECUTION of the already-frozen BALP
# method (e22-dfp-phase1b-lightweight-boundary-preservation) over the
# already-frozen 350-image development split, via the already-committed
# BALP runner. It defines no new scientific formula, no new metric, no
# new artifact schema, and no new candidate/control -- every scientific
# definition is bound by exact path + SHA-256 to E22 (preservation +
# artifacts) and reused unmodified. This identity's own additions are:
# (1) the real production dataset/geometry/model provider binding E22
# deliberately left unbound (E22 "implements no method, runs no
# inference... authorizes no GPU execution"); (2) the frozen 350-image
# development window universe (image count, window count, canonical
# digest) that a prior task found BLOCKED and this identity's own
# predecessor task resolved by real, independently-verified
# materialization; (3) the GPU/wall-time resource contract; (4) the
# checkpoint/resume mode authorization; (5) an explicit prohibition
# list strictly narrower than or equal to E22's own.
#
# This identity freezes authority only. It runs no inference, submits
# no GPU job, constructs no model, and accesses no image pixel or GT
# annotation.

[identity]
name = "e23-dfp-phase1b-balp-development-execution"
schema_name = "talk2dino-dfp-phase1b-balp-development-execution-identity-v1"
schema_version = 1
description = "Authorizes real BALP evaluation (16 candidates + 5 controls, e22-dfp-phase1b-lightweight-boundary-preservation) on the frozen 350-image development split only, via the committed BALP runner and the committed real dataset/geometry/model provider, on exactly one H100 80GB GPU, wall time at most 05:00:00, in fresh/resume/finalize-only-via-resume modes. Prohibits confirmation-split access, the other 4,500 images, full 5,000-image evaluation, exact masked-forward provenance, candidate-specific recurrence, and overwrite of a completed development result. Freezes authority only -- implements no execute CLI, submits no GPU job, runs no inference."
required_ancestor_commit = "f0bb0eadd8daf63b82f2b9c93f6c15afd78fb890"
working_branch = "dfp-phase1a-diagnostics"
successor_of = "e22-dfp-phase1b-lightweight-boundary-preservation"
mutates_or_version_bumps_earlier_identity = false

