# ---------------------------------------------------------------------
# Historical exclusions: authorities intentionally NOT bound as
# scientific dependencies, and why. Recorded for provenance, never as
# a live dependency edge.
# ---------------------------------------------------------------------

# Note: e22-dfp-phase1b-lightweight-boundary-artifacts binds THIS
# identity by path+SHA-256 (protocol_binding.protocol_identity_sha256),
# never the reverse -- identical, one-directional convention to
# e15-dfp-phase1b-protocol / e15-dfp-phase1b-artifacts, avoiding a
# circular or impossible self-hash design.

[historical_exclusions]
list = [
    "e19-dfp-phase1b-conservation-tolerance: freezes a numeric conservation tolerance for exact masked-forward provenance's rho_g residual family; BALP performs no masked-forward propagation and computes no rho_g residual, so no real dependency exists",
    "e20-dfp-phase1b-diagnostic-execution: freezes the 500-image profiled diagnostic RUNNER for exact masked-forward Stage-A extraction, whose multi-window label/margin domain ambiguity is exactly why this identity exists; BALP does not execute, resume, checkpoint through, or otherwise depend on that runner",
    "e21-dfp-phase1b-provenance-features: freezes compute_component_evidence_features, the eight component-evidence Stage-A fields (k_star, phi, top1_positive_share, ...); BALP constructs no component, no membership, no signed component contribution, and consumes none of those eight fields",
    "e15-dfp-phase1b-protocol / e15-dfp-phase1b-artifacts / e16-dfp-phase1b-conservation-calibration: freeze the masked-forward Stage-A/Stage-B schemas and the 200-window conservation calibration; BALP's method, split, and artifact schemas are independent of all of these",
]
e19_e20_e21_required_by_balp_inference = false

# ---------------------------------------------------------------------
# Method identity.
# ---------------------------------------------------------------------

[method]
scientific_name = "Boundary-Aware Late-Flip Preservation"
short_identifier = "BALP"
method_kind = "inference_time_deterministic_arbitration_rule_over_canonical_horizon_fields"
is_exact_provenance = false
is_oracle = false
is_learned_component_model = false
is_second_propagation_pass = false
runs_masked_forward_propagation = false
constructs_components = false
performs_pullback_or_membership_computation = false
introduces_learned_parameters = false
requires_gt_at_inference = false

# ---------------------------------------------------------------------
# Canonical horizon fields.
# ---------------------------------------------------------------------

[canonical_horizons]
horizon_set = [0, 16, 32, 64, 320]
horizon_set_source = "dependency_bindings.e13_protocol [propagation].horizons -- never independently hardcoded"
recurrence_passes_per_image = 1
recurrence_passes_per_image_rule = "exactly one canonical k12 320-step recurrence, one model forward, one graph -- ALL FIVE horizon snapshots are read from that single pass via dependency_bindings.recurrence_capture_module's existing snapshot_steps mechanism; recurrence/model/graph must never be re-run per horizon or per BALP candidate"
score_field_definition = "S_h(q,x): the canonical evaluator-bound class-score field at final ori_shape resolution for horizon h and class q, produced by (1) the same model forward, (2) the same graph, (3) the same single k12 recurrence trajectory, (4) dependency_bindings.recurrence_capture_module's existing horizon capture, (5) dependency_bindings.horizon_stitching_module's exact existing stitching, (6) dependency_bindings.final_rescale_module's exact existing final crop/rescale (R) to ori_shape -- never a GT-derived shape"
class_order_source = "dependency_bindings.e13_protocol [coco_stuff_dataset].class_names_source (mmseg.datasets.COCOStuffDataset.CLASSES), class_count=171, class_names_digest=0d1caff40f22c2f8de07c9d3016f2521dea096ae8b51889a12d3511bc33a18e7"
ignore_index = 255
ignore_index_source = "dependency_bindings.e13_protocol [coco_stuff_dataset].ignore_index"
argmax_definition = "y_h(x) = argmax_q S_h(q,x)"
argmax_tie_rule = "exact_argmax_ties_select_lowest_class_index"
argmax_tie_rule_source = "dependency_bindings.e13_protocol [dispute_protocol].tie_rule, identical to dependency_bindings.analysis_module's _lowest_index_argmax -- never a second, independently-derived tie convention"
argmax_tie_rule_source_section = "dispute_protocol"
argmax_tie_rule_source_key = "tie_rule"
pamr_in_bound_baseline = false
pamr_status = "PAMR is explicitly excluded from DFP's own graph/recurrence pipeline (dependency_bindings.matched_evaluator [prohibited] list includes 'pamr'); PAMR appears elsewhere ONLY as a separate historical comparison baseline (T0_PAMR/T320_PAMR in e15-dfp-phase1b-protocol), never as part of the canonical S_h fields BALP consumes. S_h is therefore the canonical (non-PAMR) DFP score field, read at its existing pre-refinement location -- there is no refinement stage between recurrence output and S_h."
final_class_scores_relative_to_refinement = "S_h IS the final class score field BALP consumes; no refinement (PAMR or otherwise) exists between dependency_bindings.final_rescale_module's output and S_h"

# ---------------------------------------------------------------------
# Predicted (GT-independent) boundary definition.
# ---------------------------------------------------------------------

[boundary_definition]
connectivity = 8
boundary_formula = "B(y) = {x : at least one in-image 8-connected neighbor x' has y(x') != y(x)}"
image_exterior_is_a_class = false
edge_pixel_rule = "an image-edge pixel is a boundary only if an EXISTING in-image neighbor differs; the image exterior contributes no comparison"
union_boundary_formula = "B_union = B(y_64) union B(y_320)"
dilation_metric = "chebyshev"
dilation_formula = "D_r(B_union) = {x : min_{z in B_union} ||x-z||_inf <= r}"
radii = [0, 1, 2, 4]
erosion_used = false
gt_boundary_used = false
ignore_mask_used_in_boundary_construction = false
label_map_resize_during_boundary_construction = false
computed_at = "ori_shape (final resolution), identical to canonical_horizons.score_field_definition's own resolution"

# ---------------------------------------------------------------------
# Stability, late-flip, and arbitration.
# ---------------------------------------------------------------------

[stability_and_late_flip]
stability_start_horizons = [0, 16, 32, 64]
stability_start_horizons_source = "S = [0,16,32,64] -- the four canonical_horizons.horizon_set members strictly preceding 320"
suffix_definition = "suffix(s): the ordered subset of [0,16,32,64] beginning at s (e.g. suffix(16) = [16,32,64])"
stable_formula = "stable_s(x) = true iff all y_h(x), h in suffix(s), are identical"
late_flip_formula = "late_flip(x) = [y_64(x) != y_320(x)]"
preservation_mask_formula = "P_{s,r}(x) = stable_s(x) AND late_flip(x) AND [x in D_r(B_union)]"
preserved_label_source = "the preserved label is always the stable T64 label (y_64(x)), never a blend, average, or recomputed value"
candidate_score_field_formula = "S_BALP_{s,r}(:,x) = S_64(:,x) when P_{s,r}(x) is true, otherwise S_320(:,x)"
final_prediction_formula = "y_BALP_{s,r}(x) = argmax_q S_BALP_{s,r}(q,x)"
relational_equivalence_required = "y_BALP_{s,r}(x) == y_64(x) when P_{s,r}(x) is true, and y_BALP_{s,r}(x) == y_320(x) otherwise -- the identity loader/tests must independently verify this equivalence, never merely trust the argmax-of-selected-field formula"

[prohibited_method_features]
list = [
    "blending_coefficient", "confidence_threshold", "temperature", "learned_weight",
    "random_choice", "component_feature", "adaptive_iteration_count",
    "masked_forward_propagation", "component_construction", "component_membership",
    "pullback_computation", "signed_component_contribution", "second_recurrence_pass",
    "per_candidate_recurrence_rerun", "gt_input_at_inference",
]

# ---------------------------------------------------------------------
# Candidate family: exactly 16 BALP candidates + 5 canonical controls.
# ---------------------------------------------------------------------

[candidate_family]
stability_starts = [0, 16, 32, 64]
radii = [0, 1, 2, 4]
candidate_count = 16
candidate_id_format = "balp_s{s:03d}_r{r:02d}"
candidate_id_examples = ["balp_s000_r00", "balp_s000_r01", "balp_s000_r02", "balp_s000_r04"]
candidate_ordering_rule = "row-major over (stability_starts, radii) in the exact list order given above -- s outer loop ascending [0,16,32,64], r inner loop ascending [0,1,2,4]"

[candidate_family.ordered_candidate_ids]
list = [
    "balp_s000_r00", "balp_s000_r01", "balp_s000_r02", "balp_s000_r04",
    "balp_s016_r00", "balp_s016_r01", "balp_s016_r02", "balp_s016_r04",
    "balp_s032_r00", "balp_s032_r01", "balp_s032_r02", "balp_s032_r04",
    "balp_s064_r00", "balp_s064_r01", "balp_s064_r02", "balp_s064_r04",
]

[candidate_family.canonical_controls]
list = ["T0", "T16", "T32", "T64", "T320"]
deployment_baseline = "T320"
no_addition_after_results_without_new_successor_authority = true

# ---------------------------------------------------------------------
# GT isolation.
# ---------------------------------------------------------------------

[gt_isolation]
gt_permitted_uses = [
    "confusion_statistic_accumulation", "development_candidate_selection",
    "internal_confirmation", "final_metric_computation",
]
gt_forbidden_influences = [
    "horizon_scores", "predicted_boundaries", "stability", "late_flip_detection",
    "preservation_masks", "candidate_score_fields", "candidate_predictions", "timing_control_flow",
]
predictions_finalized_before_gt_access_required = true
poisoned_gt_verification_required = true
poisoned_gt_verification_definition = "an implementation/verification task must demonstrate that replacing every GT array with a poisoned (e.g. all-ignore-index, or randomly-permuted) value leaves every horizon score, predicted boundary, stability flag, late-flip flag, preservation mask, candidate score field, and candidate prediction byte-identical -- only confusion statistics/metrics computed AFTER prediction finalization may differ"

# ---------------------------------------------------------------------
# Frozen 500-image development design.
# ---------------------------------------------------------------------

[development_split]
source_subset = "dependency_bindings.subset_manifest (coco_stuff_500, 500 images) -- the ONLY source of image IDs for this split; no other image is accessed by this identity"
namespace = "talk2dino-dfp-phase1b-balp-development-split-v1"
encoding = "utf-8"
hash_algorithm = "sha256"
selection_key_formula = "sha256(namespace.encode('utf-8') + b'\\x00' + canonical_image_id.encode('utf-8')).hexdigest() -- lowercase 64-hex"
ranking_key = "(selection_key, canonical_image_id)"
ranking_direction = "ascending"
development_count = 350
confirmation_count = 150
split_rule = "sort all 500 (selection_key, canonical_image_id) pairs ascending by ranking_key; the first 350 records (ranks 0..349) are development; the remaining 150 (ranks 350..499) are confirmation"
persisted_fields = [
    "source_selected_ids_digest", "development_image_ids", "development_selection_keys", "development_ranks",
    "confirmation_image_ids", "confirmation_selection_keys", "confirmation_ranks",
    "development_digest", "confirmation_digest", "full_split_trace_digest",
]
loader_must_reject = [
    "altered_selection_key", "altered_rank", "altered_membership", "altered_ordering",
    "duplicate_image_id", "omitted_image_id", "cross_split_overlap", "wrong_350_150_counts",
]
confirmation_label = "internal_confirmation_split_not_an_independent_dataset_or_untouched_external_benchmark"
future_5000_image_disclosure_required = "the eventual 5,000-image COCO-Stuff result will include these same 500 images (both development and confirmation subsets), and must explicitly disclose that development/confirmation used a frozen 500-image subset of the same validation universe"
other_4500_images_accessed_in_this_task = false

# ---------------------------------------------------------------------
# Metric contract.
# ---------------------------------------------------------------------

[metric_contract]
aggregation_level = "dataset_level_confusion_aggregation"
arithmetic_mean_of_per_image_mious_forbidden = true
class_count_and_order_source = "dependency_bindings.e13_protocol [coco_stuff_dataset]"
ignore_index_source = "dependency_bindings.e13_protocol [coco_stuff_dataset].ignore_index"
absent_class_convention = "identical to dependency_bindings.analysis_module's compute_semantic_metrics own convention -- never a new, independently-invented rule"
evaluated_pixel_convention = "V = (GT != ignore_index), identical to every other bound baseline variant in this repository"
reporting_units = "percentage_points"
precision_rule = "full-precision value selected first (ranking, acceptance-threshold comparison); rounding, if any, is a display-only operation applied strictly after selection"
new_metric_formula_forbidden = "no new metric formula is introduced when dependency_bindings.analysis_module already provides one"
required_sufficient_statistics = [
    "dataset_level_miou", "per_class_iou", "mean_class_accuracy_if_already_governed", "pixel_accuracy_if_already_governed",
    "evaluated_pixel_count", "ignored_pixel_count", "candidate_versus_t320_changed_pixel_count",
    "preservation_mask_pixel_count", "preservation_mask_fraction",
    "boundary_preservation_count", "non_boundary_preservation_count", "classwise_gain_loss_versus_t320",
]
required_for = "every one of the 5 canonical controls and all 16 BALP candidates"

# ---------------------------------------------------------------------
# Candidate selection and rejection.
# ---------------------------------------------------------------------

[candidate_selection]
selection_image_domain = "development (350 images) only"
eligibility_rules = [
    "scientific_output_complete_and_schema_valid",
    "no_gt_isolation_violation",
    "finite_metrics",
    "development_miou_strictly_exceeds_t320",
    "no_recurrence_or_model_duplication",
    "candidate_belongs_to_frozen_16_candidate_family",
]
primary_ranking_order = [
    "highest_full_precision_development_dataset_level_miou",
    "smallest_preservation_fraction",
    "smaller_radius",
    "longer_stability_requirement_ordered_s0_then_s16_then_s32_then_s64",
    "lexicographically_smallest_candidate_id",
]
confirmation_metrics_forbidden_for_selection_or_reranking = true
confirmation_evaluation_rule = "the one frozen winner (if any) is evaluated exactly once on the 150-image internal confirmation split, strictly after development-only selection is finalized"
acceptance_gates = [
    "confirmation_miou_gain_versus_t320_at_least_plus_0_10_pp",
    "no_non_finite_metric",
    "no_gt_isolation_violation",
    "operational_gates_pass",
]
acceptance_threshold_pp = 0.10
no_eligible_development_candidate_outcome = "NO_BALP_CANDIDATE_PROCEEDS"
confirmation_gain_below_threshold_outcome = "NO_BALP_CANDIDATE_PROCEEDS"
post_hoc_grid_expansion_forbidden = true
post_hoc_radii_alteration_forbidden = true
post_hoc_stability_weakening_forbidden = true
post_hoc_candidate_reselection_after_confirmation_forbidden = true
any_of_the_above_requires_new_successor_authority = true

# ---------------------------------------------------------------------
# Operational contract.
# ---------------------------------------------------------------------

[operational_contract]
deployed_candidate_requirements = [
    "reuse_one_model_forward_per_window", "reuse_one_graph", "reuse_one_320_step_recurrence",
    "capture_existing_horizon_snapshots_in_that_recurrence", "no_masked_forward_propagation",
    "no_connected_component_construction", "no_pullback_or_membership_computation",
    "no_optimization_or_iterative_solve", "no_cpu_gpu_synchronization_in_scientific_path",
    "no_learned_parameters", "no_gt_at_inference",
]
paired_benchmark_required = true
paired_benchmark_comparison = ["canonical_T320_baseline", "selected_BALP_candidate"]
paired_benchmark_conditions = "same GPU and software environment, same frozen 500-image order, same model/checkpoint, same process-isolation/warm-up policy"

[operational_contract.acceptance_caps]
total_wall_time_overhead_pct_max = 15
mean_per_image_latency_overhead_pct_max = 15
throughput_reduction_pct_max = 15
peak_allocated_vram_increase_pct_max = 10
peak_reserved_vram_increase_pct_max = 10
host_rss_increase_policy = "report_exactly_no_pass_fail_threshold_unless_already_governed"
raw_measurements_required = true
fabricated_missing_telemetry_forbidden = true
caps_govern_only = "whether BALP may proceed to a later full evaluation -- never a claim about the eventual 5,000-image result itself"

# ---------------------------------------------------------------------
# Exact operational formulas: one self-contained sub-table per governed
# metric, each with its own formula, comparison operator, threshold,
# units, baseline-validity requirement, and finite-value requirement.
# Every threshold value here is numerically IDENTICAL to (never a
# revision of) [operational_contract.acceptance_caps] above -- the
# loader independently cross-checks this equality on every load.
# ---------------------------------------------------------------------

[operational_contract.formulas.total_wall_time_overhead]
formula = "total_wall_time_overhead_pct = 100 * (candidate_total_wall_time_ns - baseline_total_wall_time_ns) / baseline_total_wall_time_ns"
numerator_field = "candidate_total_wall_time_ns"
subtrahend_field = "baseline_total_wall_time_ns"
denominator_field = "baseline_total_wall_time_ns"
comparison_operator = "<="
threshold = 15.0
units = "percent"
baseline_field_must_be_positive = "baseline_total_wall_time_ns"
finite_value_required = true
negative_value_meaning = "the candidate was faster than the baseline"

[operational_contract.formulas.mean_per_image_latency_overhead]
formula = "mean_per_image_latency_overhead_pct = 100 * (candidate_mean_per_image_latency_ns - baseline_mean_per_image_latency_ns) / baseline_mean_per_image_latency_ns"
numerator_field = "candidate_mean_per_image_latency_ns"
subtrahend_field = "baseline_mean_per_image_latency_ns"
denominator_field = "baseline_mean_per_image_latency_ns"
comparison_operator = "<="
threshold = 15.0
units = "percent"
baseline_field_must_be_positive = "baseline_mean_per_image_latency_ns"
finite_value_required = true
negative_value_meaning = "the candidate had lower per-image latency than the baseline"

[operational_contract.formulas.throughput_reduction]
formula = "throughput_reduction_pct = 100 * (baseline_throughput_images_per_second - candidate_throughput_images_per_second) / baseline_throughput_images_per_second"
numerator_field = "baseline_throughput_images_per_second"
subtrahend_field = "candidate_throughput_images_per_second"
denominator_field = "baseline_throughput_images_per_second"
comparison_operator = "<="
threshold = 15.0
units = "percent"
baseline_field_must_be_positive = "baseline_throughput_images_per_second"
finite_value_required = true
negative_value_meaning = "the candidate had higher throughput than the baseline"

[operational_contract.formulas.peak_allocated_vram_increase]
formula = "peak_allocated_vram_increase_pct = 100 * (candidate_peak_allocated_vram_bytes - baseline_peak_allocated_vram_bytes) / baseline_peak_allocated_vram_bytes"
numerator_field = "candidate_peak_allocated_vram_bytes"
subtrahend_field = "baseline_peak_allocated_vram_bytes"
denominator_field = "baseline_peak_allocated_vram_bytes"
comparison_operator = "<="
threshold = 10.0
units = "percent"
baseline_field_must_be_positive = "baseline_peak_allocated_vram_bytes"
finite_value_required = true
negative_value_meaning = "the candidate used less peak allocated VRAM than the baseline"

[operational_contract.formulas.peak_reserved_vram_increase]
formula = "peak_reserved_vram_increase_pct = 100 * (candidate_peak_reserved_vram_bytes - baseline_peak_reserved_vram_bytes) / baseline_peak_reserved_vram_bytes"
numerator_field = "candidate_peak_reserved_vram_bytes"
subtrahend_field = "baseline_peak_reserved_vram_bytes"
denominator_field = "baseline_peak_reserved_vram_bytes"
comparison_operator = "<="
threshold = 10.0
units = "percent"
baseline_field_must_be_positive = "baseline_peak_reserved_vram_bytes"
finite_value_required = true
negative_value_meaning = "the candidate used less peak reserved VRAM than the baseline"

[operational_contract.host_rss_policy]
must_record_baseline_and_candidate = true
absolute_difference_field = "host_rss_absolute_difference_bytes"
absolute_difference_formula = "host_rss_absolute_difference_bytes = candidate_host_rss_bytes - baseline_host_rss_bytes"
percentage_difference_field = "host_rss_percentage_difference_pct"
percentage_difference_formula = "host_rss_percentage_difference_pct = 100 * (candidate_host_rss_bytes - baseline_host_rss_bytes) / baseline_host_rss_bytes"
percentage_difference_requires_positive_baseline = true
percentage_difference_field_nullable_if_baseline_not_positive = true
pass_fail_threshold_authorized = false

[operational_contract.numeric_rules]
comparison_operator_all_caps = "<="
comparison_operator_strict_less_than_forbidden = true
units_are_percent_not_fraction = true
raw_measurements_retained = true
arithmetic_dtype = "float64"
reject_nan = true
reject_infinity = true
reject_bool_as_measurement = true
reject_string_as_measurement = true
reject_null_as_measurement = true
reject_non_positive_baseline = true
negative_overhead_or_reduction_is_a_valid_result = true
display_rounding_never_affects_acceptance = true
denominator_authority = "same_job_t320_control"
historical_1h18m_runtime_status = "contextual_only_never_authoritative"

