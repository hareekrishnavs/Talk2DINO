[authorization_boundary]
e22_authorizes_inference = false
candidate_selected_by_this_identity = false
gpu_execution_authorized_by_this_identity = false
other_4500_image_access_authorized = false
full_5000_image_evaluation_authorized = false
full_5000_image_evaluation_prerequisites = [
    "implementation", "independent_implementation_verification", "committed_head_verification",
