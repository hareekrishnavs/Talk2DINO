    "blending_coefficient", "confidence_threshold", "temperature_parameter", "learned_weight",
    "random_tie_break", "adaptive_iteration_count", "second_recurrence_pass", "per_candidate_model_rerun",
    "candidate_selection_in_this_identity", "gpu_execution_in_this_identity", "full_5000_image_execution",
]
