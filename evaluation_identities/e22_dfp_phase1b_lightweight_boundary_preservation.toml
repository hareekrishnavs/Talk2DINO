format_version = "talk2dino-dfp-phase1b-lightweight-boundary-preservation-identity-v1"

# DFP ("Directed Finite-step Propagation") Phase 1B's exact masked-forward
# provenance runner is DISCONTINUED as of this identity. An independent
# diagnosis (recorded only in conversation/report form, not as a
# committed artifact) established that its multi-window Stage-A
# semantics were ambiguous: it combined an image-global blended label
# field with a window-local margin field, and neither E15 nor E16
# disambiguates which domain is authoritative. Resolving that correctly
# would require a new calibration cycle this identity does not attempt.
#
# This identity freezes a REPLACEMENT, lightweight method family:
# "Boundary-Aware Late-Flip Preservation" (BALP). BALP is a deterministic,
# inference-time arbitration rule over the SAME already-frozen canonical
# (unmasked) DFP Phase 1A horizon score fields DFP already produces --
# it introduces no masked-forward propagation, no connected-component
# construction, no pullback/membership computation, no learned
# parameter, and no oracle/GT input at inference. It is not exact
# provenance, not a second propagation pass, and does not explain or
# reproduce component-level provenance in any way.
#
# This identity implements no method, runs no inference, selects no
# winning candidate, and authorizes no GPU execution. It freezes
# definitions, schemas, and authorization gates only.

[identity]
name = "e22-dfp-phase1b-lightweight-boundary-preservation"
schema_name = "talk2dino-dfp-phase1b-lightweight-boundary-preservation-identity-v1"
schema_version = 1
description = "Freezes the lightweight Boundary-Aware Late-Flip Preservation (BALP) method family over already-frozen DFP Phase 1A canonical horizon score fields: the 16-candidate arbitration-rule family, the deterministic 350/150 development/confirmation split of the frozen coco_stuff_500 subset, candidate-selection and rejection rules, GT-isolation requirements, operational acceptance gates, and the authorization boundary for any future full 5,000-image evaluation. Implements no method, runs no inference, selects no candidate, and authorizes no GPU execution."
required_ancestor_commit = "4032fe7330fff981f666097e8addf621b0964ae0"
working_branch = "dfp-phase1a-diagnostics"
successor_of = "none: BALP is a new, independent method family; it is not a version bump of E13/E15/E16/E19/E20/E21"
mutates_or_version_bumps_earlier_identity = false

