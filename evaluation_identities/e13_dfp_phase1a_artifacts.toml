run_mode_names = ["coco_stuff_500", "ade20k_500"]

[checkpoint_schema]
schema_name = "talk2dino-dfp-phase1a-checkpoint-v1"
schema_version = 1
top_level_key_count = 25
resume_prefix_rule = "completed_image_ids == selected_ids[:next_dataset_index]"
progress_invariant = "next_dataset_index == len(completed_image_ids)"
zero_row_representation = "valid; every per-image NPZ array has shape (0,) at next_dataset_index == 0, never constructed via np.stack([])"
state_transitions = [
    "incomplete: next_dataset_index < image_count_expected, complete = false, final_result_produced = false",
    "complete: next_dataset_index == image_count_expected, complete = true, final_result_produced = false",
    "finalized: complete = true, final_result_produced = true (only settable after the final result installs and self-verifies)",
]
completion_forbids_further_resume = true

[per_image_stats_schema]
schema_name = "talk2dino-dfp-phase1a-per-image-stats-v1"
schema_version = 1
row_axis = "image_index_0_based_matching_the_checkpoints_completed_image_ids_prefix_exactly"
int64_member_names = [
    "dataset_indices", "dispute_pixel_count", "evaluated_pixel_count", "window_count",
    "zero_dispute_window_count", "total_node_count", "total_nonzero_count",
    "total_baseline_recurrence_flops", "total_projected_recurrence_flops",
    "total_chunk_invocations", "total_projected_width", "maximum_projected_width",
    "maximum_peak_planned_bytes",
]
float64_member_names = ["q_w_mean", "q_w_median", "q_w_p90", "q_w_p95", "q_w_p99", "q_w_maximum"]
excluded_by_design = [
    "full_stitched_score_maps", "component_id_masks", "soft_membership_dense_matrices",
    "per_window_variable_length_arrays",
]
excluded_by_design_reason = "the protocol requires only aggregate/statistical persistence of query-compute-projection quantities (mean/median/p90/p95/p99/maximum of |Q_w|, total and worst-window projected width, projected peak memory) and explicitly marks phase1a_propagates_component_masks = false; per-window arrays would additionally have a variable length across images (window count depends on each image's real height/width) and cannot form a fixed-shape NPZ column"

