format_version = "talk2dino-dfp-phase1a-artifacts-identity-v1"

# Storage-only artifact-schema authority for DFP Phase 1A Step 10. This
# identity defines representation and validation only: checkpoint/result
# document schemas, NPZ container member schemas, path policy, and atomic
# install policy. It never rewrites or re-binds
# evaluation_identities/e13_dfp_phase1a_protocol.toml (both frozen Step-2
# subset manifests pin that file's exact SHA-256), and it defines no
# scientific quantity: D, Q_w, R_w, horizons, recurrence, components,
# memberships, compute formulas, oracle definitions, gates, and metrics
# all remain exactly as already frozen by the protocol and by Steps 3-9.
# The per-image statistics this identity's checkpoint schema persists are
# exactly the aggregate query/compute-projection quantities the protocol's
# own [query_compute_projection] section already requires to be reported
# (|Q_w| statistics, R_w-with-nonzero-membership, projected width, total
# and worst-window projected width, projected peak memory) plus the
# dispute-set size Step 3 already defines -- nothing here is invented.

[identity]
name = "e13-dfp-phase1a-artifacts"
schema_version = "talk2dino-dfp-phase1a-artifacts-identity-v1"
description = "Storage-only artifact-schema authority for DFP Phase 1A: binds the frozen scientific protocol, both frozen 500-image subset manifests, and the relevant parent/model identities, then defines the checkpoint document schema, the per-image compute-projection-statistics NPZ schema, the final-result document schema, path policy, and atomic generation/install policy for future Phase 1A diagnostic runs. Implements no evaluator, no inference, and no scientific quantity."
storage_representation_only = true

[protocol_binding]
protocol_identity_relative_path = "evaluation_identities/e13_dfp_phase1a_protocol.toml"
protocol_identity_sha256 = "227549b03ec6b1262c465a18b7fc67529fa5a0b5deef419c33ec79a80feb2173"

