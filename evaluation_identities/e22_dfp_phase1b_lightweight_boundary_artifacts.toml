format_version = "talk2dino-dfp-phase1b-lightweight-boundary-artifacts-identity-v1"

# Storage-only artifact-schema authority for BALP (Boundary-Aware
# Late-Flip Preservation): defines the closed, versioned schemas for
# the development checkpoint, development result, selection artifact,
# profiling artifact, and the FUTURE (not-yet-authorized) 5,000-image
# result. Implements no method, no evaluator, no inference, and
# defines no scientific quantity beyond storage/validation -- every
# formula referenced here is frozen in
# e22-dfp-phase1b-lightweight-boundary-preservation, never redefined.

[identity]
name = "e22-dfp-phase1b-lightweight-boundary-artifacts"
schema_name = "talk2dino-dfp-phase1b-lightweight-boundary-artifacts-identity-v1"
schema_version = 1
description = "Closed, versioned artifact schemas for BALP: development checkpoint (fresh/resume), development result, selection artifact, profiling artifact, and the future 5,000-image result schema (schema only, no execution authorization). Storage-only; defines no scientific formula."
storage_representation_only = true

[protocol_binding]
protocol_identity_relative_path = "evaluation_identities/e22_dfp_phase1b_lightweight_boundary_preservation.toml"
protocol_identity_sha256 = "bcc6db2dce36c3d740cd66cc36125de36c3faf86dd9924cd02218ec60ee5d63d"

# ---------------------------------------------------------------------
# Shared closed vocabularies.
# ---------------------------------------------------------------------

[shared.candidate_ids]
list = [
    "balp_s000_r00", "balp_s000_r01", "balp_s000_r02", "balp_s000_r04",
    "balp_s016_r00", "balp_s016_r01", "balp_s016_r02", "balp_s016_r04",
    "balp_s032_r00", "balp_s032_r01", "balp_s032_r02", "balp_s032_r04",
    "balp_s064_r00", "balp_s064_r01", "balp_s064_r02", "balp_s064_r04",
]
count = 16

[shared.control_ids]
list = ["T0", "T16", "T32", "T64", "T320"]
count = 5

[shared.confusion_sufficient_statistics_member]
dtype = "int64"
shape = "[class_count, class_count]"
rank = 2
non_negative = true
description = "row=GT class, col=predicted class, evaluated pixels only (GT != ignore_index); dataset-level aggregation is the elementwise sum of every image's own confusion matrix -- never an arithmetic mean of per-image mIoUs"

# ---------------------------------------------------------------------
# 1. Development checkpoint schema.
# ---------------------------------------------------------------------

[checkpoint_schema]
schema_name = "talk2dino-dfp-phase1b-balp-development-checkpoint-v1"
schema_version = 1
supports_fresh_resume_without_reordering = true
resume_never_changes_image_order_or_candidate_outputs = true
per_image_scientific_files_required = false
prefer_append_only_aggregate_arrays = true

[checkpoint_schema.top_keys]
list = [
    "schema_name", "schema_version", "identity_bindings", "progress", "aggregate_confusion",
    "per_image_reconstruction_statistics", "complete", "final", "final_result_binding",
]
# Corrected during the second mechanical-completeness repair: this list
# previously omitted "final_result_binding" even though
# checkpoint_schema.flags/state_machine already required that key to be
# present (as null/absent-equivalent for non-final checkpoints, and as
# a valid binding object for finalized ones) -- the closed-key
# enforcement added to validate_checkpoint_single() would otherwise
# have rejected every valid checkpoint document. This is the single
# authoritative top-level key set; validate_checkpoint_single() reads
# it directly from this identity's own canonical leaves rather than
# maintaining a second, divergence-prone hardcoded list.
closed = true


[checkpoint_schema.identity_bindings.keys]
list = [
    "e22_protocol_sha256", "e22_artifacts_sha256", "e13_protocol_sha256", "matched_evaluator_sha256",
    "subset_manifest_sha256", "balp_split_sha256", "development_digest", "run_mode",
]

[checkpoint_schema.progress.keys]
list = [
    "expected_development_image_count", "completed_image_ids", "next_development_index", "generation",
]
expected_development_image_count_value = 350

[checkpoint_schema.aggregate_confusion.keys]
description = "one confusion_sufficient_statistics_member per control (5) and per candidate (16), keyed by shared.control_ids/shared.candidate_ids -- exactly 21 arrays, append-only: each completed image's own confusion matrix is added in place, never replacing a prior partial sum"
required_control_keys = ["T0", "T16", "T32", "T64", "T320"]
required_candidate_keys = [
    "balp_s000_r00", "balp_s000_r01", "balp_s000_r02", "balp_s000_r04",
    "balp_s016_r00", "balp_s016_r01", "balp_s016_r02", "balp_s016_r04",
    "balp_s032_r00", "balp_s032_r01", "balp_s032_r02", "balp_s032_r04",
    "balp_s064_r00", "balp_s064_r01", "balp_s064_r02", "balp_s064_r04",
]

[checkpoint_schema.per_image_reconstruction_statistics.keys]
list = [
    "candidate_versus_t320_changed_pixel_count", "preservation_mask_pixel_count",
    "boundary_preservation_pixel_count", "non_boundary_preservation_pixel_count",
    "evaluated_pixel_count", "ignored_pixel_count", "per_image_confusion_matrix",
]
required_for = "every control (T64/T320 relevant subset) and every one of the 16 candidates, per completed image, accumulated append-only exactly like aggregate_confusion"
per_image_confusion_matrix_purpose = "the [class_count, class_count] confusion matrix for THIS ONE completed image alone (never a running sum) -- persisted specifically so checkpoint_schema.relational_validation's aggregate-equals-sum-of-per-image rule is independently checkable from persisted bytes alone, never re-derived by re-running inference"

[checkpoint_schema.per_image_array_convention]
container_shape = "dict keyed by canonical_image_id -- NOT a flat array with a separate offset array"
offset_array_needed = false
offset_array_not_needed_reason = "every per_image_reconstruction_statistics member is exactly ONE scalar (or one [class_count,class_count] matrix) per completed image per control/candidate -- there is no variable-length per-image segment the way E15's Stage-A disputed-pixel rows require dispute_offsets, so there is nothing for an offset array to index"
exact_length_invariant = "for every control/candidate key, the per-image container holds EXACTLY next_development_index entries, one per completed image, and the entry for completed_image_ids[i] is populated if and only if i < next_development_index"
completion_order_is_development_split_order = "completed_image_ids is always development_image_ids[:next_development_index] (development_split's own ranked order) -- position i in every per-image container corresponds to development_image_ids[i], never filesystem/dict/insertion order"

[checkpoint_schema.flags]
complete_definition = "next_development_index == 350 AND completed_image_ids == development_image_ids (the full frozen 350-image development order)"
final_definition = "complete == true AND final_result_binding is present and valid"
final_implies_complete = true
incomplete_cannot_bind_final_result = "final_result_binding must be absent (or null) whenever complete == false; presence of a valid final_result_binding while complete == false is a fatal schema violation"

[checkpoint_schema.final_result_binding.keys]
list = ["development_result_relative_path", "development_result_sha256", "installed_at_generation"]

[checkpoint_schema.state_machine]
# Every checkpoint document must satisfy EXACTLY one of these four
# named states; no other combination of (next_development_index,
# completed_image_ids, complete, final) is representable.
[checkpoint_schema.state_machine.zero_progress]
next_development_index = 0
completed_image_ids = "empty list"
complete = false
final = false

[checkpoint_schema.state_machine.partial_progress]
next_development_index = "0 < next_development_index < 350"
complete = false
final = false

[checkpoint_schema.state_machine.complete_unfinalized]
next_development_index = 350
completed_image_ids = "exactly all 350 development_image_ids, in order"
complete = true
final = false
final_result_binding = "absent"

[checkpoint_schema.state_machine.finalized]
next_development_index = 350
complete = true
final = true
final_result_binding = "present and valid (sha256 of an existing, schema-valid development_result_schema document)"

[checkpoint_schema.relational_validation]
list = [
    "progress.expected_development_image_count == 350",
    "0 <= progress.next_development_index <= 350",
    "len(progress.completed_image_ids) == progress.next_development_index",
    "progress.completed_image_ids == balp_split.development_image_ids[:progress.next_development_index] (exact frozen-split prefix, never a re-sorted or re-selected subset)",
    "no duplicate id in progress.completed_image_ids",
    "sorted(aggregate_confusion.keys()) covers exactly shared.control_ids union shared.candidate_ids (5 + 16 = 21 keys, no more, no fewer)",
    "candidate keys in aggregate_confusion/per_image_reconstruction_statistics appear in exactly candidate_family.ordered_candidate_ids order",
    "control keys in aggregate_confusion/per_image_reconstruction_statistics appear in exactly shared.control_ids order",
    "identity_bindings.e22_protocol_sha256/e22_artifacts_sha256/e13_protocol_sha256/matched_evaluator_sha256/subset_manifest_sha256/balp_split_sha256/development_digest all equal the identical fields E22 itself pins (never independently re-chosen per checkpoint)",
    "for every control/candidate key k and every completed image i < next_development_index, per_image_reconstruction_statistics[k] has exactly next_development_index entries (checkpoint_schema.per_image_array_convention.exact_length_invariant)",
    "aggregate_confusion[k] == elementwise sum over i in range(next_development_index) of per_image_reconstruction_statistics[k].per_image_confusion_matrix[i], for every control/candidate key k",
    "evaluated_pixel_count and ignored_pixel_count for a given completed image are identical across every control and every candidate (same image, same GT, same ignore mask -- prediction differences never change which pixels are evaluated/ignored)",
    "every candidate key present anywhere in the checkpoint is a member of candidate_family.ordered_candidate_ids -- no foreign candidate id",
    "no id in progress.completed_image_ids appears in balp_split.confirmation_image_ids",
    "no representable state has completed_image_ids that is not a prefix of balp_split.development_image_ids (state_machine is exhaustive and closed)",
]

[checkpoint_schema.cross_generation_invariants]
description = "rules relating an earlier checkpoint C_old to a later checkpoint C_new for the SAME development run (same identity_bindings)"
list = [
    "C_new.progress.next_development_index >= C_old.progress.next_development_index",
    "C_old.progress.completed_image_ids is an exact prefix of C_new.progress.completed_image_ids (never reordered, replaced, or reinterpreted)",
    "for every completed image i < C_old.progress.next_development_index and every control/candidate key k, C_new.per_image_reconstruction_statistics[k][i] is byte-identical to C_old.per_image_reconstruction_statistics[k][i] (both the 6 scalar fields and per_image_confusion_matrix)",
    "C_new's candidate_family/control ordering and identity_bindings are byte-identical to C_old's",
    "for every control/candidate key k, C_new.aggregate_confusion[k] == C_old.aggregate_confusion[k] plus the elementwise sum of per_image_confusion_matrix[i] for the newly-appended i in range(C_old.next_development_index, C_new.next_development_index)",
    "resume never removes, reorders, replaces, or reinterprets a row C_old already completed",
    "profiling_schema fields never appear inside a checkpoint document and can never affect scientific_output_digest (development_result_schema) or any aggregate_confusion/per_image value",
    "a fresh run and a checkpoint-then-resumed run of the SAME development population produce byte-identical final (next_development_index==350) aggregate_confusion and per_image_reconstruction_statistics",
]

# ---------------------------------------------------------------------
# 2. Development result schema.
# ---------------------------------------------------------------------

[development_result_schema]
schema_name = "talk2dino-dfp-phase1b-balp-development-result-v1"
schema_version = 1

[development_result_schema.top_keys]
list = [
    "schema_name", "schema_version", "run_mode", "development_image_count", "identity_bindings",
    "control_results", "candidate_results", "scientific_output_digest", "complete", "final",
]
development_image_count_required_value = 350

[development_result_schema.control_result_member.keys]
list = [
    "control_id", "dataset_level_miou", "per_class_iou", "mean_class_accuracy", "pixel_accuracy",
    "evaluated_pixel_count", "ignored_pixel_count",
]

[development_result_schema.candidate_result_member.keys]
list = [
    "candidate_id", "stability_start", "radius", "dataset_level_miou", "per_class_iou",
    "mean_class_accuracy", "pixel_accuracy", "evaluated_pixel_count", "ignored_pixel_count",
    "candidate_versus_t320_changed_pixel_count", "preservation_mask_pixel_count", "preservation_mask_fraction",
    "boundary_preservation_pixel_count", "non_boundary_preservation_pixel_count", "classwise_gain_loss_versus_t320",
]
candidate_id_closed_set = "shared.candidate_ids"
stability_start_closed_set = [0, 16, 32, 64]
radius_closed_set = [0, 1, 2, 4]

# ---------------------------------------------------------------------
# 3. Selection artifact schema.
# ---------------------------------------------------------------------

[selection_schema]
schema_name = "talk2dino-dfp-phase1b-balp-selection-v1"
schema_version = 1

[selection_schema.top_keys]
list = [
    "schema_name", "schema_version", "development_source_hashes", "candidate_development_metrics",
    "eligibility_outcomes", "tie_break_trace", "selected_candidate", "confirmation_result",
    "acceptance_comparison", "operational_benchmark_status", "complete", "final", "evaluation_stage_label",
]
