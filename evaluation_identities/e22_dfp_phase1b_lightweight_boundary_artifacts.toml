evaluation_stage_label_required_value = "post_gate1_pre_full_evaluation"

[selection_schema.eligibility_outcomes.member_keys]
list = [
    "candidate_id", "scientific_output_complete_and_schema_valid", "no_gt_isolation_violation",
    "finite_metrics", "development_miou_strictly_exceeds_t320", "no_recurrence_or_model_duplication",
    "belongs_to_frozen_16_candidate_family", "eligible",
]

[selection_schema.tie_break_trace.member_keys]
list = [
    "candidate_id", "development_dataset_level_miou", "preservation_mask_fraction", "radius",
    "stability_start", "rank_after_miou", "rank_after_preservation_fraction", "rank_after_radius",
    "rank_after_stability", "rank_after_candidate_id", "final_rank",
]

[selection_schema.confirmation_result.keys]
list = [
    "candidate_id", "confirmation_dataset_level_miou", "confirmation_miou_gain_versus_t320_pp",
    "confirmation_image_count", "no_gt_isolation_violation", "all_metrics_finite",
]
confirmation_image_count_required_value = 150
