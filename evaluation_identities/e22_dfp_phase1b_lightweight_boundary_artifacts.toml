# ---------------------------------------------------------------------
# 4. Profiling artifact schema.
# ---------------------------------------------------------------------

[profiling_schema]
schema_name = "talk2dino-dfp-phase1b-balp-profiling-v1"
schema_version = 1

[profiling_schema.top_keys]
