    "schema_name", "schema_version", "device_record", "software_record", "baseline_record",
    "balp_record", "derived_ratios", "affects_scientific_digest",
]
affects_scientific_digest_required_value = false

[profiling_schema.per_variant_record.keys]
list = [
    "variant_id", "total_wall_time_seconds", "per_image_latency_seconds", "throughput_images_per_second",
