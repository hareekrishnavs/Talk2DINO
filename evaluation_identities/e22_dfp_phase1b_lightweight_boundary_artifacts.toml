]
raw_values_required_alongside_ratios = true
fabricated_missing_telemetry_forbidden = true

# ---------------------------------------------------------------------
# 5. Future 5,000-image result schema (schema only; no authorization).
# ---------------------------------------------------------------------

[future_full_evaluation_schema]
schema_name = "talk2dino-dfp-phase1b-balp-full-evaluation-result-v1"
schema_version = 1
schema_freezing_authorizes_execution = false

[future_full_evaluation_schema.top_keys]
list = [
    "schema_name", "schema_version", "image_count", "t320_control_aggregate_confusion",
    "selected_balp_aggregate_confusion", "miou_and_per_class_results", "latency_throughput_host_rss_peak_vram",
    "overhead_versus_historical_baseline", "overhead_versus_same_job_t320_control",
    "selected_candidate_identity", "upstream_hashes", "development_subset_disclosure", "complete", "final",
]
image_count_required_value = 5000

[future_full_evaluation_schema.overhead_versus_same_job_t320_control]
authoritative = true
description = "the same-job, same-environment T320 control measured in the SAME full-evaluation run is the authoritative overhead comparison"

[future_full_evaluation_schema.overhead_versus_historical_baseline]
authoritative = false
historical_baseline_wall_time_reference = "approximately 1h18m"
description = "contextual only -- never authoritative for pass/fail"

[future_full_evaluation_schema.development_subset_disclosure]
required_field = "development_subset_disclosure_text"
required_content = "must state that the frozen 500-image coco_stuff_500 subset (both the 350-image development and 150-image internal-confirmation partitions) is included within the 5,000-image evaluation universe, and was used for BALP candidate development/confirmation prior to this full run"

# ---------------------------------------------------------------------
# 6. Artifact write/installation/rollback policy. Freezes POLICY only
# -- no filesystem writer is implemented by this identity. Reuses the
# already-proven E15/E20 staged-write-then-atomic-install pattern
# (stage as a sibling on the same filesystem, self-verify the complete
# staged unit, then install with exactly ONE atomic operation), never
# an unsafe sequential multi-file final-location replacement.
# ---------------------------------------------------------------------

[artifact_write_policy]
applies_to = [
    "development_checkpoint", "development_result", "selection_artifact",
    "profiling_artifact", "future_full_evaluation_result",
]
reused_pattern_source = "the already-proven staged-directory-then-atomic-rename pattern established by e20-dfp-phase1b-diagnostic-execution's atomic_write_stage_a_npz/atomic_install_result (stage under an unpredictable temp name on the SAME filesystem, self-verify via the unmodified schema validator, then os.replace/os.rename exactly once) -- reused by convention, never by code dependency (E22 does not import E20)"

[artifact_write_policy.general_path_policy]
output_destination_must_be_explicit = true
lexical_traversal_forbidden = true
physical_containment_required = "resolved (symlink-chased) target must remain inside the resolved (symlink-chased) authorized output root"
symlink_escape_forbidden = true
filename_must_match_schema_name = true
source_artifacts_are_read_only = true
implicit_cwd_output_forbidden = true
overwrite_by_default_forbidden = true
overwrite_requires_separate_explicit_authority = true
e22_grants_overwrite_authority = false

[artifact_write_policy.staging]
staging_location = "a sibling of the final destination on the SAME filesystem (never a different filesystem/device, so the final install step can be a single atomic rename)"
staging_name_uniqueness = "an unpredictable, collision-resistant staging name (e.g. a random hex suffix), never a fixed/reused temp name"
one_generation_per_staging_unit = "every member (JSON/NPZ/etc.) belonging to ONE logical generation is written into the SAME staging unit before any validation begins"
flush_and_close_before_validation = true
member_hashes_computed_from_staged_bytes = true
sibling_manifest_hashes_source = "staged bytes only -- never a hash computed before the staged write completed, and never a hash of the eventual final-location bytes before they exist"
self_verification_before_installation_required = true
self_verification_scope = "closed-schema validation, relational validation (checkpoint_schema.relational_validation / cross_generation_invariants where applicable), and sibling digest-binding validation, ALL run against staged contents before the final install step begins"
partial_final_bundle_forbidden = "the final destination must never contain a subset of a generation's members -- either all members are installed or none are"

[artifact_write_policy.atomic_installation.multi_file_artifacts]
applies_to = ["development_result", "selection_artifact", "profiling_artifact", "future_full_evaluation_result", "a finalized development_checkpoint's result bundle"]
staging_unit = "one staging DIRECTORY containing every member file of the generation"
install_operation = "exactly one atomic directory rename (os.rename/os.replace) from the staging directory into an ABSENT final destination path"
unguarded_sequential_final_renames_forbidden = true
destination_must_be_absent_before_install = true

[artifact_write_policy.atomic_installation.single_file_artifacts]
applies_to = ["a checkpoint pointer/manifest file that is legitimately replaceable across generations"]
staging_unit = "one same-directory temporary file (same directory as the final destination, so the replace is on the same filesystem)"
install_operation = "exactly one atomic os.replace of the validated temporary file onto the final path"
validate_before_replace_required = true
prior_valid_file_preserved_on_validation_failure = true

# -----------------------------------------------------------------
# Post-install reopen and reverification. This is a THIRD, distinct
# requirement from staged pre-install self-verification (staging
# section, above) and from the atomic installation step itself
# (multi_file_artifacts/single_file_artifacts, above) -- both of those
# remain mandatory and unchanged; this section adds a mandatory step
# that happens strictly AFTER the atomic rename completes.
#
# Modeled exactly on e20-dfp-phase1b-diagnostic-execution's own
# atomic_write_stage_a_npz, which -- after os.replace installs the
# NPZ -- reopens the INSTALLED path (never the already-unlinked
# staging/temp path) via np.load and re-runs the unmodified
# validate_stage_a_flat_arrays against those freshly-read bytes,
# raising straight through (no except/rollback) if that reload-verify
# fails. Note this differs from E20's OWN atomic_install_result
# (the multi-file/directory-rename case), which validates staged
# members only BEFORE the rename and defines no post-rename
# reverification at all -- this policy deliberately extends E20's
# proven single-file reopen-verify pattern to also cover E22's
# multi-file bundle installs, since that is exactly what this
# repair requires; it is not a claim that atomic_install_result
# already does this.
# -----------------------------------------------------------------

[artifact_write_policy.atomic_installation.post_install_verification]
reopen_and_reverify_after_install_required = true
applies_to = ["multi_file_artifacts", "single_file_artifacts"]
reopen_source = "the installed destination path only -- never the staging/temporary path, which no longer exists (multi-file: renamed away; single-file: replaced/unlinked by os.replace)"
reopen_timing = "strictly after the atomic rename/replace has completed -- never before, and never substituting for the pre-install staged self-verification"
public_validator_required_against_installed_bytes = true
member_hashes_recomputed_from_installed_bytes = true
sibling_bindings_recomputed_from_installed_bytes = true
success_reported_only_after_post_install_verification_passes = true
post_install_failure_reported_as_installation_failure = true
post_install_failure_never_silently_converted_to_success = true
downstream_advance_forbidden_before_post_install_verification_passes = [
    "current_generation_pointer", "checkpoint.final_result_binding", "checkpoint.final",
    "selection_artifact.selected_candidate", "any_current_or_latest_artifact_reference",
]
cleanup_on_post_install_verification_failure = "reused_from_e20_atomic_write_stage_a_npz: NONE -- the newly-installed (already-renamed) artifact is left on disk exactly as installed, for forensic inspection; the exception propagates straight through with no automatic delete/quarantine/rollback of the just-installed bytes. This is a precise statement of E20's own actual behavior, not a stricter fabricated deletion policy."
overwrite_authorized_by_this_requirement = false
replaces_pre_install_staged_verification = false
both_pre_install_and_post_install_verification_mandatory = true

[artifact_write_policy.generation_protocol]
design = "immutable generation directories plus an atomically-updated latest-generation pointer -- identical in spirit to e20-dfp-phase1b-diagnostic-execution's checkpoint-after-every-completed-image discipline, reused here because it is already proven safe under interruption in this repository and introduces no new safety mechanism"
immutable_generation_directory = "each installed generation (e.g. each finalized checkpoint/result install) is written once, under its own generation identifier, and is NEVER modified or overwritten after a successful atomic install"
latest_pointer_update = "the 'current generation' pointer (if used) is itself updated via the single-file atomic os.replace rule above -- never by editing a pointer file in place"
why_this_protocol = "avoids ANY window where a reader can observe a partially-written generation, and avoids ANY window where a failed write leaves the 'current' pointer referencing a nonexistent or partial generation -- the same guarantee E20's own already-committed, already-exercised atomic_write_checkpoint/atomic_install_result provide"

[artifact_write_policy.failure_behavior]
failure_before_final_rename_leaves_prior_state_untouched = true
staging_residue_removed_on_failure = true
partial_generation_can_never_become_current = true
schema_or_digest_failure_blocks_advancement = true
interruption_between_computation_and_commit_reprocesses_at_most_one_image = "since checkpoints commit after every completed development image (never mid-image), an interruption can cause at most the single in-flight (uncommitted) image to be reprocessed on resume -- never a committed one"
fatal_exceptions_propagate_after_cleanup = true
rollback_failure_must_be_reported_explicitly = "a failure during staging-residue cleanup is itself surfaced (never silently swallowed) -- it must never be reported as if the original write had succeeded, and must never be reported as if no error occurred"
existing_valid_artifacts_byte_identical_after_failed_install = true
source_artifacts_never_mutated = true

[artifact_write_policy.freshness_and_overwrite]
development_result_install_requires_absent_destination = true
selection_artifact_install_requires_absent_destination = true
profiling_artifact_install_requires_absent_destination = true
future_full_evaluation_result_install_requires_absent_destination = true
e22_grants_destructive_overwrite = false
rerun_requires_new_output_destination_unless_later_authority_permits_replacement = true
immutable_checkpoint_generations_never_overwritten = true
temporary_staging_or_backup_entries_not_accepted_as_final_artifacts = true

[artifact_write_policy.sibling_digest_bindings]
list = [
    "checkpoint JSON metadata <-> checkpoint per-image/aggregate arrays: identity_bindings.development_digest and the checkpoint's own recorded array-derived hashes must agree",
    "development_result <-> its source (finalized) checkpoint: development_result_schema.identity_bindings (or equivalent) must record the exact finalized checkpoint's own generation/hash it was produced from",
    "selection_artifact <-> development_result and confirmation_result: selection_schema.development_source_hashes must match the actual installed development_result bytes; confirmation_result must reference the same selected candidate identity",
    "profiling_artifact <-> the selected candidate: profiling_schema records must be keyed to the SAME candidate_id the selection_artifact names as selected -- never a different or unselected candidate",
    "future_full_evaluation_result <-> the selected E22 successor identity: upstream_hashes must include e22_protocol_sha256/e22_artifacts_sha256 of the EXACT E22 version whose selection_artifact authorized proceeding",
]
digest_mismatch_behavior = "reject: a sibling digest-binding mismatch is a fatal schema/relational violation, identical in severity to a closed-schema key-set violation -- never a warning"
