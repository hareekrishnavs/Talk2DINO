    "deriving_the_tolerance_from_any_data_outside_the_verified_200_window_artifact",
    "deriving_or_revising_the_tolerance_from_500_image_or_5000_image_evaluation_results",
    "decimal_rounding_or_a_manually_typed_tolerance_constant",
    "trusting_the_recorded_tolerance_without_recomputation_from_the_200_rows",
    "real_inference_model_or_dataset_access_in_this_task",
    "cuda_initialization_in_this_task",
    "slurm_submission_in_this_task",
    "authorizing_the_500_image_phase1b_diagnostic",
    "authorizing_full_phase1b_execution_or_the_5000_image_evaluation",
    "selecting_a_lightweight_method",
]

[future_step_bindings]
