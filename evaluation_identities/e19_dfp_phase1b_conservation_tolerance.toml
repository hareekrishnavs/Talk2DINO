format_version = "Talk2Dino-DFP-Phase1B-Conservation-Tolerance-Identity-V1"

# ---------------------------------------------------------------------
# E19: an ADDITIVE SUCCESSOR to E16. E16 froze the deterministic
# 200-window conservation-CALIBRATION protocol and closed artifact
# schema, and explicitly defined NO numeric conservation tolerance
# (`e16...[residual_definitions].tolerance_defined_here = false`,
# `e16...[measurement_versus_tolerance_boundary]
#  .later_successor_authority_required_to_bind_verified_artifact_and_freeze_tolerance
#  = true`). This identity is exactly that later, narrowly-scoped step
# E16's own [future_step_bindings] deferred: it binds the completed,
# independently-verified phase1b_conservation_calibration.json (200
# rows, complete=true, final=true, official E16 validator PASS) by
# content hash and freezes the single numeric conservation tolerance
# that the already-committed E15 Stage-A/B artifact schema
# (`e15-dfp-phase1b-artifacts` + `src/dfp_phase1b_artifact_schema.py`)
# already expects to receive from that calibration artifact.
#
# This identity does not modify E16, E15, E14, E13, E17, or E18 in any
# way -- it only relationally re-verifies their SHA-256 on every load.
# It runs no inference, loads no model weights, initializes no CUDA,
# accesses no COCO-Stuff image or annotation, submits no SLURM job,
# and does NOT authorize the 500-image Phase 1B provenance diagnostic
# or the 5,000-image evaluation. See [authorization_boundary] below --
# those booleans are the ground truth for this identity's authority
# boundary, checked directly by the validator, never inferred from
# prose.
#
# POST-CALIBRATION, PRE-EVALUATION TOLERANCE. The tolerance below was
# derived AFTER examining the verified calibration artifact and frozen
# BEFORE any 500-image diagnostic or 5,000-image evaluation result
# exists. It is a DETERMINISTIC FUNCTION of the calibration
# observations -- the smallest exact power of two >= the reconstructed
# maximum absolute governed calibration residual -- with no fitted
# percentile, confidence interval, manually typed constant, decimal
# rounding, or evaluation-derived input. The tolerance module
# recomputes it from the 200 raw calibration rows on every load and
# refuses to trust the recorded value without that recomputation.
# ---------------------------------------------------------------------

[identity]
name = "e19-dfp-phase1b-conservation-tolerance"
schema_name = "talk2dino-dfp-phase1b-conservation-tolerance-identity-v1"
schema_version = 1
status = "frozen_additive_successor_authority"
purpose = "Binds the completed and independently-verified 200-window phase1b_conservation_calibration.json by content hash and freezes the single numeric conservation tolerance for DFP Phase 1B, derived deterministically as the smallest exact power of two greater than or equal to the reconstructed maximum absolute governed (rho_g) calibration residual. Implements no runner, runs no inference, defines no accuracy metric, and authorizes no 500-image diagnostic, full Phase 1B, or 5,000-image execution."
successor_of = "e16-dfp-phase1b-conservation-calibration"
successor_relation = "additive_only: binds but never edits, reinterprets, or re-hashes any E13-E18 file or the verified calibration artifact; consumes the calibration artifact as a read-only input and freezes exactly the one scalar tolerance that e15-dfp-phase1b-artifacts already sources from it"
does_not_modify_e16 = true
required_ancestor_commit = "ae1c7d2daed2a8d77fb2f1fbb013501d5c722a28"
required_ancestor_relation = "required_ancestor_commit must be an ancestor of (or equal to) the executing repository_commit -- verified via 'git merge-base --is-ancestor <required_ancestor_commit> <repository_commit>', exactly like E17/E18's own convention. Every repository-file SHA-256 bound below is valid only for a worktree at or descended from this commit."
working_branch = "dfp-phase1a-diagnostics"

# ---------------------------------------------------------------------
# Scope / operational flags (mirrors e18's [operational_scope] shape).
# ---------------------------------------------------------------------

[operational_scope]
purpose = "post_calibration_numeric_conservation_tolerance_freeze"
scientific_accuracy_metric = false
method_selection_criterion = false
preregistered_hypothesis_test = false
post_calibration = true
pre_evaluation = true
calibration_data_only = true
numeric_tolerance_defined = true
tolerance_derived_from_5000_image_evaluation = false
real_inference_executed_by_task6a = false
