# ---------------------------------------------------------------------
# Governed residual family: exactly one. The already-committed E15
# Stage-A schema (`e15-dfp-phase1b-artifacts`
#  .stage_a_schema ... conservation_residual = "float64",
#  relational rule "sum_component_evidence ~= margin_change (within the
#  separately bound calibration tolerance ...)") and its committed
# Python mirror `src/dfp_phase1b_artifact_schema.py
#  ::validate_stage_a_flat_arrays(*, conservation_tolerance: float)`
# accept exactly ONE scalar tolerance and compare it against
# |sum_component_evidence - margin_change| -- i.e. the rho_g residual,
# which e16-dfp-phase1b-conservation-calibration
#  .[residual_definitions].primary_measurement names as the primary
# measurement. rho_M / rho_0 / rho_320 are RECORDED calibration
# diagnostics; no committed authority binds a tolerance to them, so
# they are NOT governed here. This structure is read directly from
# committed authority, never chosen for convenience.
# ---------------------------------------------------------------------

[governed_residual]
tolerance_structure = "single_scalar"
tolerance_structure_source = "e15-dfp-phase1b-artifacts stage_a_schema (conservation_residual = float64; single 'the separately bound calibration tolerance') and its committed mirror src/dfp_phase1b_artifact_schema.py::validate_stage_a_flat_arrays(*, conservation_tolerance: float), which compares exactly |sum_component_evidence - margin_change| (the rho_g residual) against one scalar"
governed_family = "rho_g"
governed_family_source = "e16-dfp-phase1b-conservation-calibration.[residual_definitions].primary_measurement = 'rho_g'; the only calibration family any committed conservation-acceptance relation references"
governed_family_formula = "rho_g^(w)(x) = sum_r g^(w)_{x,r} - delta_m^(w)(x)  (signed component-contribution sum minus the canonical T320-minus-T0 b(x)-a(x) margin change, after the identical final-resolution operator A_final,w)"
governed_family_units = "final-resolution class-score margin units (same units as margin_change = m320 - m0); real-valued, dimensionless model-score scale; no physical unit"
governed_family_domain = "final-resolution disputed pixels of the selected window's own final-resolution support where a(x) != b(x)"
recorded_but_ungoverned_families = ["rho_M", "rho_0", "rho_320"]
recorded_but_ungoverned_note = "rho_M (membership partition), rho_0 (seed reconstruction), rho_320 (propagated reconstruction) are recorded per E16 so the calibration run itself is independently auditable; no committed authority applies a numeric tolerance to them and this identity freezes none"

# ---------------------------------------------------------------------
# Derivation inputs: the exact per-family statistics reconstructed
# from the 200 calibration rows' lowest-level persisted maxima
# (per-window maximum_absolute_residual), independently re-max'd, and
# cross-checked against the artifact's aggregate_residual_summaries.
# The tolerance module rebuilds every one of these on load and
# rejects any disagreement between row-level reconstruction,
# aggregate statistics, and the values frozen here.
# ---------------------------------------------------------------------

[derivation_inputs]
residual_family_names_in_canonical_order = ["rho_M", "rho_0", "rho_320", "rho_g"]
reconstruction_source = "max over the 200 selected_window_records of record[family].maximum_absolute_residual; independently re-max'd, never read from aggregate_residual_summaries and trusted"
row_count_used = 200

[derivation_inputs.rho_M]
sample_count = 204800
non_finite_count = 0
reconstructed_maximum_absolute_residual = 7.771561172376096e-15
governed = false

[derivation_inputs.rho_0]
sample_count = 4221952
non_finite_count = 0
reconstructed_maximum_absolute_residual = 3.4416913763379853e-15
governed = false

[derivation_inputs.rho_320]
sample_count = 4221952
non_finite_count = 0
reconstructed_maximum_absolute_residual = 1.3007687971189341e-06
governed = false

[derivation_inputs.rho_g]
sample_count = 7887805
non_finite_count = 0
reconstructed_maximum_absolute_residual = 5.889683609150431e-07
governed = true

[derivation_inputs.governed_maximum]
family = "rho_g"
observed_maximum_absolute_residual = 5.889683609150431e-07
observed_maximum_is_exact_power_of_two = false
selected_binary_exponent = -20
selected_binary_exponent_definition = "e = frexp(M)[1] when frexp(M)[0] != 0.5 (M not an exact power of two); the frozen tolerance is ldexp(1.0, e) = 2**e"
previous_power_of_two = 4.76837158203125e-07
previous_power_of_two_strictly_below_observed_maximum = true

# ---------------------------------------------------------------------
# Rule: unambiguous machine-readable executable semantics. Prose is
# secondary; the tolerance module executes exactly this.
# ---------------------------------------------------------------------

[rule]
name = "smallest_exact_power_of_two_ge_observed_maximum_absolute_governed_residual"
aggregation_source = "verified_200_window_calibration_artifact_row_level_maxima_only"
absolute_value_operation = "abs"
maximum_operation = "max_over_all_200_rows_of_per_window_maximum_absolute_residual_for_the_governed_family"
binary_power_of_two_ceiling = "tolerance = 2 ** ceil(log2(M)) for finite M > 0, computed exactly via math.frexp / math.ldexp with no floating-point boundary ambiguity"
exact_power_of_two_input_behavior = "if M is already an exact power of two, tolerance = M (no doubling)"
zero_input_behavior = "if M == 0, tolerance = 0"
comparison_operator = "<="
comparison_semantics = "conservation is accepted for a pixel when absolute_residual <= tolerance; inclusive; strictly identical to src/dfp_phase1b_artifact_schema.py which fails only when residual > tolerance"
scope = "single scalar governing the rho_g conservation residual only"
manually_selected_multiplier_used = false
percentile_used = false
confidence_interval_used = false
fitted_distribution_used = false
decimal_rounding_used = false
manually_typed_constant_used = false
evaluation_result_input_used = false

# ---------------------------------------------------------------------
# The frozen tolerance. Recomputed from [derivation_inputs] and
# [rule] on every load; never trusted as a bare input.
# ---------------------------------------------------------------------

[tolerance]
conservation_tolerance = 9.5367431640625e-07
conservation_tolerance_is_power_of_two = true
conservation_tolerance_binary_exponent = -20
conservation_tolerance_equals_two_pow_exponent = true
governed_family = "rho_g"
comparison_operator = "<="
acceptance_relation = "absolute_residual <= conservation_tolerance"
observed_maximum_absolute_residual = 5.889683609150431e-07
observed_maximum_le_tolerance = true
tolerance_over_observed_maximum_ratio_lt_two = true
source_calibration_artifact_sha256 = "f065b143933cf7881e5a31dd663783719a684e6d430e9e7b2bb314ed7e792d22"
label_post_calibration = "POST-CALIBRATION"
label_pre_evaluation = "PRE-EVALUATION"

