format_version = "talk2dino-dfp-phase1a-qualitative-report-identity-v1"

# Storage/selection/rendering-only reporting authority for DFP Phase 1A
# Step 11. This identity freezes deterministic example SELECTION and
# PRESENTATION only. It never rewrites or re-binds the frozen scientific
# protocol, the Step 10 artifact-schema authority, or either frozen
# 500-image subset manifest -- all three are bound below by SHA-256 and
# re-verified against the live files every time this identity loads. It
# defines no scientific quantity: the dispute-category formulas
# (harmful_washout, beneficial_correction, third_label_transition) are
# taken verbatim from the protocol's own [dispute_categories] section;
# oracle/persistence/reversion-coherence outputs are taken verbatim from
# the already-committed src/dfp_phase1a_analysis.py (Step 3), never
# redefined here.

[identity]
name = "e13-dfp-phase1a-qualitative-report"
schema_version = "talk2dino-dfp-phase1a-qualitative-report-identity-v1"
description = "Deterministic, predeclared qualitative-reporting authority for DFP Phase 1A: freezes example selection (category-conditioned SHA-256 hash selection over the frozen canonical subset order), the qualitative-category set (all reused from Step 3's own analysis outputs, never redefined), the canonical panel order and rendering policy, and the deterministic reporting palette. Implements no evaluator, no inference, and produces no real qualitative conclusion."
storage_representation_only = true

[protocol_binding]
protocol_identity_relative_path = "evaluation_identities/e13_dfp_phase1a_protocol.toml"
protocol_identity_sha256 = "d53cfe6b9632b0fb24a90ed1c1482a00b83dd64255aaa595b0af141cab7febe7"

[artifact_schema_binding]
artifact_schema_identity_relative_path = "evaluation_identities/e13_dfp_phase1a_artifacts.toml"
artifact_schema_identity_sha256 = "76df6986a406a9cc26c91cc702ff4b410c5182c80eb40378aa1a646d2120369e"

[boundary_iou_binding]
boundary_iou_identity_relative_path = "evaluation_identities/e13_dfp_phase1a_boundary_iou.toml"
boundary_iou_identity_sha256 = "b5ca4aed473b19be9e19611cfd316dbbb7713e4bf62ab54567cb02da722dd2d1"
boundary_interior_split_source = "src.dfp_phase1a_analysis._official_mask_to_boundary (Step 3's own pinned Cheng et al. 2021 primitive, reused unmodified against the dispute mask itself, never reimplemented)"

[subset_manifest_binding]
coco_stuff_manifest_relative_path = "evaluation_subsets/dfp_phase1a_coco_stuff_500.json"
coco_stuff_manifest_sha256 = "092a0af90bee1d2f3e407ac0b6ebfafae5a83d251bb0e234cbc7d933d91e5ee0"
ade20k_manifest_relative_path = "evaluation_subsets/dfp_phase1a_ade20k_500.json"
ade20k_manifest_sha256 = "eaf9923b906a22cc89882967359ac1a1764bdb34dfcdbad074ecb5450b8c7328"

[category_binding]
category_order = [
    "harmful_washout", "beneficial_correction", "third_label_transition",
    "disputed_boundary", "disputed_interior", "oracle_reverted",
    "horizon_persistence_reverting", "revert_set_fragmentation",
]
category_source = "src.dfp_phase1a_analysis (Step 3, reused unmodified): harmful_washout/beneficial_correction/third_label_transition = DisputeResult.harmful/.beneficial/.third_label; disputed_boundary/disputed_interior = the dispute mask split by _official_mask_to_boundary; oracle_reverted = OracleMaps-implied harmful-reversion pixels (DisputeResult.harmful); horizon_persistence_reverting = PersistenceMaps[primary_persistence_horizon] reversion pixels; revert_set_fragmentation = compute_reversion_coherence over the primary-horizon reversion mask"
eligibility_rule = "at_least_one_category_pixel_in_the_valid_region"
eligibility_pixel_count_threshold_forbidden = true
tie_rule = "exact_argmax_ties_select_lowest_class_index"
a_definition = "stitched T0/unary lowest-index-argmax winner"
b_definition = "stitched T320 lowest-index-argmax winner"

[selection_policy]
examples_per_category = 3
namespace = "talk2dino-dfp-phase1a-qualitative-report-v1"
separator = "\u0000"
encoding = "utf-8"
digest_algorithm = "sha256"
selection_key_formula = "SHA256(namespace + NUL + dataset_name + NUL + category_name + NUL + canonical_image_id)"
sort_key = ["selection_key", "canonical_image_id"]
traversal_order = "frozen_subset_manifest_canonical_selected_ids_order"
allow_cross_category_duplicates = true
shortage_policy = "select_all_eligible_never_fill_from_another_category_never_duplicate_never_weaken_eligibility_never_change_k"
zero_coverage_status = "empty_selection_list_with_explicit_zero_coverage_status"

[selection_schema]
schema_name = "talk2dino-dfp-phase1a-qualitative-selection-v1"
schema_version = 1

[bundle_schema]
schema_name = "talk2dino-dfp-phase1a-qualitative-bundle-v1"
schema_version = 1
overwrite_policy = "reject_existing_destination_atomic_staging_dir_rename_on_success_only"

[panel_binding]
panel_order = [
    "rgb", "gt", "unary_t0", "persistence_primary_horizon", "propagated_t320",
    "dispute_categories", "oracle_reverted", "reversion_coherence",
]
panel_source = [
    "input_rgb_array", "input_gt_label_map", "labels[unary_horizon]",
    "persistence[primary_persistence_horizon].full", "labels[final_horizon]",
    "DisputeResult_category_overlay", "OracleMaps.o_p_reversion_overlay",
    "compute_reversion_coherence_component_overlay",
]
rgb_interpolation = "bilinear"
label_interpolation = "nearest_neighbor"
antialiasing_for_labels_forbidden = true
output_height = 256
output_width = 256
overlay_opacity = 0.55
caption_policy = "strict_json_metadata_only_no_raster_text"

[palette_binding]
palette_source = "deterministic_reporting_palette_generated_by_src.dfp_phase1a_qualitative_render.generate_class_palette"
palette_formula = "for class index c: HSV(hue=(c * golden_angle_degrees) mod 360, saturation=0.65, value=0.95) converted to sRGB uint8 via colorsys, golden_angle_degrees = 137.507764"
palette_class_order = "lowest_class_index_first"
ignore_color_rgb = [0, 0, 0]
background_color_rgb = [32, 32, 32]
category_overlay_colors = { harmful_washout = [220, 30, 30], beneficial_correction = [30, 180, 60], third_label_transition = [220, 160, 20], disputed_boundary = [220, 30, 220], disputed_interior = [30, 140, 220], oracle_reverted = [220, 30, 30], horizon_persistence_reverting = [220, 120, 30], revert_set_fragmentation = [140, 30, 220] }

[rendering_policy]
image_mode = "RGB"
png_compression_level = 6
png_optimize = false
strip_png_metadata = true
strip_timestamps = true
locale_independent_formatting = true
numeric_caption_format = "{:.6f}"
decoded_digest_algorithm = "sha256_of_raw_rgb_uint8_array_bytes"
encoded_digest_algorithm = "sha256_of_png_file_bytes"

[future_step_bindings]
description = "Fields explicitly deferred to later DFP steps, never guessed or invented here."
excludes_in_this_step = [
    "real_coco_stuff_or_ade20k_qualitative_results",
    "phase1b_masked_propagation_panels",
    "final_dfp_selector_conclusions",
]
