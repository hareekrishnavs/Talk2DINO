# ---------------------------------------------------------------------
# Dataset-access scope (REPAIR_E27_WARMUP_SCOPE_DISCLOSURE: corrected to
# distinguish three DIFFERENT ID sets, traced directly against the
# committed CLI's own set-construction rule
# (`selected_ids = sorted({warmup_record["image_id"]} | {r["image_id"]
# for r in benchmark_records})`, `diagnostics/run_dfp_phase1b_t64_
# early_exit_benchmark.py`):
#
#   processed_ids            -- the 24 canonical benchmark_records'
#                                image IDs. These are ACTUALLY DECODED
#                                and run through real model inference,
#                                once per measured or warm-up trial
#                                (every trial iterates all 24).
#   resolution_only_ids       -- the single auxiliary manifest
#                                warmup_record's own image ID (disjoint
#                                from processed_ids). Confirmed by
#                                direct inspection of
#                                `src.dfp_phase1a_dataset_view.
#                                build_manifest_execution_view` (its own
#                                docstring: "before any image is
#                                authorized to be processed") that this
#                                function performs ID -> native-index/
#                                path METADATA resolution only -- no
#                                image is opened, decoded, or run
#                                through inference for an ID that never
#                                appears in `processed_ids`. The
#                                committed runner's own per-window loop
#                                (`run_trial`) never iterates the raw
#                                `warmup_record` -- only the 24
#                                `benchmark_records` -- so this ID is
#                                never independently processed as its
#                                own one-window pass.
#   provider_resolution_ids   -- processed_ids UNION resolution_only_ids
#                                (exactly the CLI's own `selected_ids`)
#                                -- the full set the production provider
#                                resolves metadata for at dataset-
#                                construction time.
#
# Previously this authority conflated provider_resolution_ids (25/19/6)
# with the actually-processed population, mislabeling it as "24
# measured + 1 warm-up" image decode/inference scope. The correct,
# independently-recomputed processed-image figures are 24/18/6 (see
# below) -- the prior 25/19/6 figures describe provider_resolution_ids,
# never processed_ids.
# ---------------------------------------------------------------------

[dataset_access_scope]
authorized_access = "image decode and geometry crop for exactly the 24 processed_ids (the canonical E17 benchmark_records' own image IDs) already present in the frozen E17 manifest -- no other image is decoded or run through inference. One additional auxiliary image ID (the manifest's own warmup_record) is metadata-resolved only (dataset-index/path lookup), never decoded or run through inference by the committed runner."
gt_access_authorized = false
gt_label_use_authorized = false
confirmation_accuracy_evaluation_authorized = false
decoding_or_inference_on_unrelated_images_authorized = false
metadata_indexing_scope = "limited to what the already-bound production_provider_module requires to resolve provider_resolution_ids (processed_ids plus the single auxiliary warmup_record ID) to native dataset positions -- no broader indexing"

[dataset_access_scope.population_overlap_disclosure]
development_split_size = 350
confirmation_split_size = 150
disclosure_note = "processed_ids (24 images) are actually decoded and run through real model inference; resolution_only_ids (1 image, the manifest's own auxiliary warmup_record) is metadata-resolved only and never decoded/inferred; provider_resolution_ids is their union (25 images), the scope the production provider indexes at dataset-construction time. 6 of the 24 processed images (and 6 of the 25 provider_resolution_ids) are members of the 150-image confirmation split; their pixels/geometry are read for wall-clock timing only (or, for the 1 resolution-only ID, only its dataset index/path is resolved). This is GT-free benchmark input access, categorically distinct from confirmation accuracy evaluation, which remains unauthorized: no GT label, no accuracy metric, no candidate decision is computed or used anywhere in this campaign. These confirmation-split images are never described as 'untouched' -- they are within the frozen benchmark input scope, just never subject to GT/accuracy access."

[dataset_access_scope.population_overlap_disclosure.processed_ids]
count = 24
development_overlap_count = 18
confirmation_overlap_count = 6
outside_frozen_population_count = 0

[dataset_access_scope.population_overlap_disclosure.resolution_only_ids]
count = 1
development_overlap_count = 1
confirmation_overlap_count = 0
outside_frozen_population_count = 0
disjoint_from_processed_ids = true

[dataset_access_scope.population_overlap_disclosure.provider_resolution_ids]
count = 25
development_overlap_count = 19
confirmation_overlap_count = 6
outside_frozen_population_count = 0

