# E27 defines NO new science, NO new artifact schema, and NO new
# implementation requirement. It re-pins (never re-derives) every
# scientific value, resource limit, schedule entry, and decision
# formula E25 already froze, and binds by SHA-256 to the exact,
# already-independently-verified implementation committed at
# af92d4acc64254674d2156a13b55bf4f5d368d3d. Its only new content is:
# (1) the exact resource/schedule/population execution scope for one
# future H100 campaign, (2) an explicit activation-prerequisite chain,
# and (3) a torch-free, code-level readiness verification that the
# operator MUST run, and receive a PASS from, before manually invoking
# the already-committed, unmodified launcher.
#
# CRITICAL, EXPLICIT ACKNOWLEDGEMENT: the committed CLI/launcher never
# read this file, and never read E26's own `authorization_boundary`,
# at runtime -- there is NO code-level gate inside the existing,
# unmodified launcher or CLI that consults E27 or refuses execution
# based on any authorization flag. E27's enforcement is therefore an
# OPERATOR-PROCESS prerequisite (a mandatory, separate, read-only
# verification command -- see `execution_readiness_contract` below),
# never a runtime check embedded in the launcher itself. This file
# must never be read as claiming otherwise.

