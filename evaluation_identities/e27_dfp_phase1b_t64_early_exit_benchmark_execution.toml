# REPAIR (REPAIR_E27_WARMUP_SCOPE_DISCLOSURE): the prior single field
# `warmup_record_count = 1` was misleading -- it correctly described the
# frozen E17 manifest's own singular `warmup_record` entry, but sat
# beside `measured_window_count = 24` in a way that implied each warm-up
# TRIAL processes only 1 window. It does not. Traced directly against
# the committed implementation
# (`src.dfp_phase1b_t64_early_exit_benchmark.run_trial`): `records =
# benchmark_records_in_canonical_order(manifest)` executes
# unconditionally, and the per-window loop iterates all 24 `records`
# regardless of `is_warmup` -- `is_warmup` only changes the trial's
# `is_warmup` classification field and whether `merge_trials` includes
# it in summary statistics, never which or how many windows are
# processed. This matches the implementation's own already-correct,
# already-independently-verified `docs/dfp_phase1b_t64_early_exit_
# benchmark_run.md` ("Two warm-up trials (one per variant, full
# 24-window runs, excluded only from summary statistics)"), which this
# authority previously contradicted.
#
# `manifest_auxiliary_warmup_record_count` now names ONLY the frozen
# manifest's own single `warmup_record` field -- its sole role is
# supplying one extra image ID to the CLI's dataset-provider ID
# resolution (see `dataset_access_scope` below); it is never processed
# as a standalone one-window warm-up pass. `warmup_trial_window_count`
# and `measured_trial_window_count` name the real per-trial window
# count (both 24) explicitly and separately from that auxiliary count.

# ---------------------------------------------------------------------
# Schedule: re-pinned verbatim from E25's execution_schedule /
# E26's process_isolation.measured_order. No automatic retry, no extra
# repeat, no adaptive horizon, no threshold change.
# ---------------------------------------------------------------------

[execution_scope.schedule.warmup]
ordered_list = ["T64_early_exit", "T320_reference"]
runs_before_measured_matrix = true
excluded_from_summary_statistics = true

[execution_scope.schedule.measured]
