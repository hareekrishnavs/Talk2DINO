same_allocated_gpu_node_required = true
identical_precision_and_settings_required = true
immediate_trial_verification_required = true
fail_fast_required = true
automatic_retry_authorized = false
extra_repeats_authorized = false
adaptive_horizons_authorized = false
threshold_change_authorized = false

