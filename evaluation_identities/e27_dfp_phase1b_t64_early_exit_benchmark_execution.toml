installed_pair_reopened_and_publicly_verified_required = true
success_before_verification_authorized = false
automatic_deletion_or_replacement_of_existing_output_authorized = false
new_artifact_schema_or_sidecar_authorized = false
unimplemented_cli_flag_authorized = false
campaign_provenance_recording_limitation = "no dedicated provenance schema exists beyond the CLI's own readiness report (stdout) and the SLURM job log (%x-%j.out); operators must retain both alongside the installed result/decision bundle for full campaign provenance"

# ---------------------------------------------------------------------
# Measurement bindings: re-pinned field NAMES and count relations only
# -- every formula stays exactly as E25/the implementation already
# define it, never redefined here.
# ---------------------------------------------------------------------

[measurement_bindings]
primary_timing_field = "measured_window_loop_wall_ns"
timing_phase_fields = [
    "process_total_wall_ns", "preflight_wall_ns", "dataset_construction_wall_ns",
    "model_construction_and_checkpoint_loading_wall_ns", "measured_window_loop_wall_ns",
    "artifact_validation_and_write_wall_ns", "unattributed_overhead_ns",
]
stage_timing_fields = ["input_preparation", "unary_model_forward", "graph_construction", "canonical_recurrence", "stitching_and_rescale", "output_validation"]
derived_fields = ["measured_window_loop_seconds", "window_throughput_per_second", "mean_seconds_per_window"]
memory_fields = ["host_peak_rss_bytes", "gpu_peak_memory_allocated_bytes", "gpu_peak_memory_reserved_bytes", "gpu_total_memory_bytes"]
scientific_output_fields = ["scientific_output_collection_digest", "per_window_output_digests", "finite_value_count", "non_finite_value_count"]

[measurement_bindings.expected_counts_per_measured_trial]
window_count = 24
model_forward_count = 24
graph_construction_count = 24
t64_recurrence_steps_executed = 1536
t320_recurrence_steps_executed = 7680

[measurement_bindings.window_throughput_disclosure]
represents_image_throughput = false
represents_full_5000_image_runtime = false
disclosure_note = "window_throughput_per_second measures the fixed 24-window benchmark loop only -- it is NOT image throughput and does NOT by itself establish full 5,000-image evaluation runtime. Any later runtime projection is a separate, explicitly labeled, unmeasured estimate outside this campaign's own scientific_output_contract, exactly as E25 already requires."

# ---------------------------------------------------------------------
# Decision: re-pinned verbatim from E25 (evaluation_identities/
# e25_dfp_phase1b_t64_early_exit_benchmark_artifacts.toml
# decision_rule_inputs_keys / outcome). E27 changes no threshold, no
# gate, no outcome name.
# ---------------------------------------------------------------------

[decision_binding]
primary_speedup_formula = "median(T320_reference measured_window_loop_wall_ns) / median(T64_early_exit measured_window_loop_wall_ns)"
end_to_end_speedup_threshold = 1.25
threshold_comparison = ">="
outcomes = ["PROCEED_TO_FREEZE_T64_CONFIRMATION_PROTOCOL", "STOP_T64_EARLY_EXIT_TRACK"]
proceed_outcome_authorizes_confirmation_execution = false
proceed_outcome_authorizes_full_5000_evaluation = false
proceed_outcome_authorizes_only = "freezing a SEPARATE, later T64 confirmation protocol authority -- nothing else"

# ---------------------------------------------------------------------
# Authorization boundary. Conditional future authorization: the four
# "true" flags below describe what E27, ONCE its own activation
# prerequisites are satisfied, authorizes for THIS ONE campaign -- they
# are never a claim that any of this is authorized RIGHT NOW, in this
# authoring task, or that the code itself enforces them at runtime (see
# `execution_gate_is_operator_process_not_runtime_launcher_check`
# above and `execution_readiness_contract` below).
# ---------------------------------------------------------------------

[authorization_boundary]
scoped_dataset_image_access_authorized = true
bound_model_construction_and_checkpoint_loading_authorized = true
cuda_initialization_authorized = true
h100_benchmark_campaign_authorized = true
artifact_verification_and_merge_authorized = true

agent_job_submission_during_this_task_authorized = false
gt_access_authorized = false
training_authorized = false
weight_modification_authorized = false
scientific_kernel_modification_authorized = false
alternate_population_authorized = false
extra_trials_authorized = false
confirmation_accuracy_evaluation_authorized = false
full_5000_image_evaluation_authorized = false
balp_candidate_evaluation_authorized = false
exact_masked_forward_provenance_authorized = false
overwrite_authorized = false
force_mode_authorized = false
e25_modification_authorized = false
e26_modification_authorized = false
new_authority_to_bypass_activation_prerequisites_authorized = false

# ---------------------------------------------------------------------
# Activation prerequisites -- ALL required before any of the
# conditional "true" flags above may be exercised for real.
# ---------------------------------------------------------------------

[activation_prerequisites]
list = [
    "e27_independently_verified",
    "e27_committed",
    "clean_committed_head_production_readiness_pass",
    "verified_implementation_and_dependency_hashes",
    "fresh_operator_selected_destination",
    "explicit_operator_submission",
]
all_required = true
this_task_satisfies_none_of_these_by_itself = true

# ---------------------------------------------------------------------
# Execution readiness contract: the mandatory, separate, read-only
# verification command an operator must run (and receive a PASS from)
# BEFORE manually invoking the existing, unmodified launcher. This is
# a code-level, torch-free CHECK this identity's own loader exposes --
# it is never invoked automatically by the launcher itself (the
# launcher was not, and in this task is not, modified to import it).
# ---------------------------------------------------------------------

[execution_readiness_contract]
verification_entry_point = "python3 -m src.dfp_phase1b_t64_early_exit_benchmark_execution_identity  (or: import src.dfp_phase1b_t64_early_exit_benchmark_execution_identity as e27; e27.verify_execution_readiness(repo_root=...))"
torch_free_required = true
checks = [
    "E27 itself loads with a closed schema and every direct dependency byte hash matches (including the implementation runner/CLI/launcher)",
    "E25 and E26 each independently load cleanly via their own unmodified loaders (transitively re-verifying their full dependency chains)",
    "required_ancestor_commit is an ancestor of (or equal to) the current repository HEAD",
    "the current working tree is completely clean",
]
never_checks_gpu_dataset_model_or_cuda = true
launcher_does_not_import_this_module = true
operator_must_run_this_separately_before_submission = true

# ---------------------------------------------------------------------
# Deferred next steps -- the exact remaining sequence.
# ---------------------------------------------------------------------

[deferred_next_steps]
sequence = [
    "independent_e27_verification",
    "commit_e27",
    "committed_head_production_readiness",
    "operator_manually_submits_the_verified_launcher",
    "independent_benchmark_result_verification",
]
no_step_in_this_sequence_is_performed_by_this_task = true

