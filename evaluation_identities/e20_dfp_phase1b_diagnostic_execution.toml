# ---------------------------------------------------------------------
# DFP Phase 1B Task 6B -- additive successor authority.
#
# Freezes the execution, checkpoint, profiling, and final-result CONTRACT
# for one future offline mechanistic/provenance diagnostic run over the
# already-frozen 500-image COCO-Stuff subset (1,090 canonical sliding
# windows), reusing the exact masked-forward provenance core unmodified.
#
# This identity implements no execution driver, no profiler, no
# checkpoint writer, no result writer, no CLI execution command, and no
# SLURM launcher. It runs no inference and submits no GPU job. It does
# not authorize the future 500-image run -- only its contract.
#
# It never redefines a scientific quantity already frozen by
# e15-dfp-phase1b-protocol / e15-dfp-phase1b-artifacts / the exact
# masked-forward core; it binds those schemas by hash and adds only
# population-specific values (already fixed by e15/e16/e18/e19) and new
# operational (non-scientific) profiling/checkpoint-progress fields.
# ---------------------------------------------------------------------

[identity]
name = "e20-dfp-phase1b-diagnostic-execution"
schema_name = "talk2dino-dfp-phase1b-diagnostic-execution-identity-v1"
schema_version = 1
status = "frozen_additive_successor_authority"
purpose = "Freezes the execution population (500 images / 1090 canonical windows), the exact scientific-execution binding (unmodified masked-forward provenance core), the operational profiling contract, the checkpoint/resume schema, and the final-result bundle schema for one future single-GPU offline mechanistic/provenance diagnostic run. Implements no execution driver, profiler, checkpoint writer, result writer, CLI execution command, or SLURM launcher. Authorizes no inference, no GPU job, and no exact masked-forward provenance on the full 5,000-image validation set."
successor_of = "e19-dfp-phase1b-conservation-tolerance"
successor_relation = "additive_only: binds but never edits, reinterprets, or re-hashes any E13-E19 file, the verified calibration artifact, or the installed Task 4 selection artifact; packages the already-frozen E15 Stage-A/Stage-B scientific schemas, E16 candidate-window-universe geometry, E18 operational chunk size, and E19 conservation tolerance into one execution/checkpoint/profiling/result contract for a not-yet-authorized future run"
does_not_modify_e13_through_e19 = true
required_ancestor_commit = "90bcf71671d69523bdc686fc695fdfb02b083a68"
required_ancestor_relation = "required_ancestor_commit must be an ancestor of (or equal to) the executing repository_commit -- verified via 'git merge-base --is-ancestor <required_ancestor_commit> <repository_commit>', exactly like E17/E18/E19's own convention. Every repository-file SHA-256 bound below is valid only for a worktree at or descended from this commit."
working_branch = "dfp-phase1a-diagnostics"

