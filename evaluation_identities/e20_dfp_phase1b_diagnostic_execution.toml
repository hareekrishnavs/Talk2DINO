image_count = 500
window_count = 1090
component_chunk_size = 16
device_type = "cuda"
gpu_count = 1
gpu_model = "NVIDIA H100 80GB HBM3"
maximum_job_wall_time_seconds = 28800
sharding_across_jobs_or_gpus_forbidden = true
single_logical_run_with_checkpoint_resume = true

[population.image_universe_binding]
source = "dependency_bindings.subset_manifest"
image_count_field = "selected_count"
image_count_value = 500
canonical_image_order_source = "subset_manifest's own 'selected_ids' field, taken verbatim in its own already-frozen canonical (lexicographic fixed-width-ID) order -- identical to e16-dfp-phase1b-conservation-calibration's [candidate_scope].image_order_source -- never re-sorted, re-derived, or filtered here"
selected_ids_digest = "38c61b8f830475944ae94e3dba88ea62905159a46f30cfd2a951bee67540e770"
native_dataset_index_reconciliation_source = "dependency_bindings.dataset_view_module's build_native_image_index(...) / build_manifest_execution_view(...) / compute_mapping_digest(...) -- the same frozen adapter e18-dfp-phase1b-chunk-selection's own execution-context relies on for canonical_id <-> native filesystem index reconciliation; never a fresh ad hoc mapping"
canonical_relative_paths_include_suffixes = true
no_filesystem_order_dependence = true
no_dict_order_dependence = true
no_hash_seed_dependence = true

[population.window_universe_binding]
source = "dependency_bindings.calibration_artifact"
window_count_field = "candidate_window_count"
window_count_value = 1090
candidate_universe_digest = "2163e2aeab0f7bf4e86cd3a33505388024d6cfb5ce7c1596c4d49691e364b390"
reconstruction_note = "the verified calibration artifact's own [candidate_scope]-governed candidate-window construction (e16-dfp-phase1b-conservation-calibration.[candidate_scope]) already ran SlidingWindowPlan.build(...) once per image, over the SAME 500-image coco_stuff_500 subset bound above, using the frozen crop=[448,448]/stride=[224,224] geometry from e13-dfp-phase1a-protocol's [score_interpolation_stitching] -- a pure per-image-canvas-dimension geometric computation with gt_annotation_prediction_dispute_or_model_output_influence_forbidden=true (e16.[candidate_scope]). candidate_window_count=1090 is that already-computed, already-independently-verified, digest-protected total candidate population; the 200 calibration windows are a size-200 SAMPLE drawn from it. This identity binds that persisted fact by content hash rather than re-deriving it from raw images (which would require dataset access this task never performs)."
candidate_windows_per_image_source = "identical provenance chain to e16-dfp-phase1b-conservation-calibration.[candidate_scope].candidate_windows_per_image_source -- dependency_bindings.window_plan_module's SlidingWindowPlan.build(...)"
gt_annotation_prediction_dispute_or_model_output_influence_forbidden = true
distinct_images_touched_by_200_calibration_windows = 175
consistency_note = "175 distinct images (of 500) touched by 200 sampled calibration windows, and candidate_window_count=1090 spanning all 500 images, are mutually consistent (mean ~2.18 candidate windows per image); no contradiction with any other repository-recorded window count"
independent_recomputation_from_raw_images_required = false
independent_recomputation_from_raw_images_performed_by_this_identity = false

# ---------------------------------------------------------------------
# Scientific execution binding: reuses the exact masked-forward
# provenance core UNMODIFIED. No scientific quantity, formula, sign
# convention, dtype, or tolerance is redefined here -- every value below
# is read verbatim from the already-frozen E13/E15/E16/E19 authority
# chain and the verified calibration artifact's own recorded execution
# environment.
# ---------------------------------------------------------------------

[scientific_execution_binding]
graph_k = 12
recurrence_steps = 320
recurrence_alpha = 0.98
recurrence_alpha_source = "e13-dfp-phase1a-protocol.[propagation].alpha, reused verbatim via e15-dfp-phase1b-protocol's authority_bindings.phase1a_protocol -- never redefined here"
canonical_recurrence_dtype = "float64"
masked_recurrence_dtype = "float64"
graph_storage_dtype = "float32"
residual_accumulation_dtype = "float64"
precision_source = "verified calibration artifact's own recorded propagation_precision_record, produced under e16-dfp-phase1b-conservation-calibration's same_propagation_precision_required=true constraint -- never re-selected or re-guessed here"
component_chunk_size = 16
component_chunk_size_source = "dependency_bindings.e18_chunk_selection_identity's frozen selected_chunk_size, cross-checked against the installed task4_selection_artifact"
signed_contribution_convention = "unchanged from e16-dfp-phase1b-conservation-calibration.[residual_definitions].rho_g.g_definition -- g^(w)_{x,r}: the selected window's own signed component contribution, computed from S0/S_final AFTER applying A_final,w"
final_resolution_pullback_operator = "A_final,w = R o A_stitch,w (dependency_bindings.stitching_pullback_module's apply_window_stitching_forward composed with dependency_bindings.final_rescale_pullback_module's apply_final_rescale_forward), exactly as reused by compute_signed_contributions / stitch_and_rescale_component_scores in dependency_bindings.masked_forward_core"
governed_residual_family = "rho_g"
governed_residual_formula = "rho_g^(w)(x) = sum_r g^(w)_{x,r} - delta_m^(w)(x), unchanged from e16-dfp-phase1b-conservation-calibration.[residual_definitions].rho_g.formula"
conservation_tolerance = 9.5367431640625e-07
conservation_tolerance_binary_exponent = -20
comparison_operator = "<="
acceptance_relation = "absolute_residual <= conservation_tolerance"
tolerance_source = "dependency_bindings.e19_tolerance_identity -- frozen, not re-derived or re-selected here"
non_finite_value_failure_behavior = "reject: a non-finite scientific array member is a fatal E15/E16/masked-forward-core-defined invariant violation, never silently dropped, clamped, or imputed"
tolerance_violation_failure_behavior = "reject: absolute_residual > conservation_tolerance raises the committed src/dfp_phase1b_artifact_schema.py::validate_stage_a_flat_arrays domain error, exactly as already enforced for e15-dfp-phase1b-artifacts's stage_a_schema; this identity adds no alternative acceptance path"
stage_a_schema_binding = "e15-dfp-phase1b-artifacts.[stage_a_schema] (talk2dino-dfp-phase1b-stage-a-features-v1, schema_version 1) -- bound and reused verbatim, never redefined"
stage_b_schema_binding = "e15-dfp-phase1b-artifacts.[stage_b_schema] (talk2dino-dfp-phase1b-stage-b-labels-v1, schema_version 1) -- bound and reused verbatim, never redefined; Stage B is out of scope for the 500-image mechanistic diagnostic itself (Stage B evaluation labels are a downstream Phase 1B step) and this identity authorizes no Stage B computation"
deterministic_scientific_serialization = "identical array member ordering, dtype, and byte layout to e15-dfp-phase1b-artifacts.[stage_a_schema].flat_disputed_pixel_members; no new scientific member is introduced by this identity"
scientific_collection_digest_definition = "sha256 over the canonical concatenation of every Stage-A flat array member's raw native-endian bytes, in the exact member order fixed by e15-dfp-phase1b-artifacts.[stage_a_schema].flat_disputed_pixel_members, preceded by image_count/dispute_offsets/window_count_per_image encoded the same way stage_a_schema.manifest_fields already requires; profiling fields are never included"

[scientific_execution_binding.unmodified_list]
list = [
    "component_definition", "query_class_selection", "prediction_variants", "recurrence",
    "contribution_sign", "resizing", "stitching", "conservation_formula", "tolerance", "chunk_size",
]

