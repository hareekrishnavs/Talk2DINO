canonical_k12_recurrence = "dependency_bindings.recurrence_capture_module: capture_dfp_phase1a_trajectory(...), which calls dependency_bindings.finite_step_regime_module's finite_step_propagate(...) unmodified"
final_resolution_stitching_rescale_for_canonical_field = "dependency_bindings.stitching_pullback_module: apply_window_stitching_forward(...); dependency_bindings.final_rescale_pullback_module: apply_final_rescale_forward(...)"
global_unary_component_construction = "dependency_bindings.global_unary_components_module: compute_global_unary_components(...)"
final_resolution_component_membership_pullback_construction = "dependency_bindings.final_rescale_pullback_module: build_final_stitching_pullback_plan(...), compute_window_final_soft_memberships(...)"
component_masked_seed_construction = "dependency_bindings.masked_forward_core: build_masked_seed_chunk(...)"
masked_k12_recurrence = "dependency_bindings.masked_forward_core: propagate_masked_seed_chunk(...)"
signed_component_contribution_computation = "dependency_bindings.masked_forward_core: compute_signed_contributions(...)"
component_score_stitch_final_rescale = "dependency_bindings.masked_forward_core: stitch_and_rescale_component_scores(...)"
conservation_residual_computation_and_validation = "dependency_bindings.masked_forward_core: build_conservation_measurements(...), compute_signed_margin_conservation_residual(...); dependency_bindings.phase1b_artifact_schema_module: validate_stage_a_flat_arrays(..., conservation_tolerance=...)"
scientific_row_array_assembly = "SCHEMA-BOUND, not a single function: assembly into e15-dfp-phase1b-artifacts.[stage_a_schema].flat_disputed_pixel_members member layout, validated by dependency_bindings.phase1b_artifact_schema_module"

[profiling_stage_contract.overhead_accounting]
leaf_stage_scopes = ["window", "component_chunk", "image", "run"]
leaf_stages_non_overlapping = true
parent_aggregate_labeling = "inclusive; a parent/group aggregate (e.g. a window total, an image total, the run total) must never be summed together with its own child leaf-stage totals -- it already contains them"
window_total_definition = "sum of the 9 window-scoped leaf stages (input_preparation .. scientific_row_array_assembly, excluding the 4 component_chunk-scoped stages) plus, for each component chunk of that window, the sum of the 4 component_chunk-scoped leaf stages for that chunk"
unattributed_overhead_definition = "total wall time for the enclosing scope minus the sum of that scope's own non-overlapping leaf-stage elapsed times; negative overhead is invalid and must be rejected, never clamped to zero"
double_counting_forbidden = true

# ---------------------------------------------------------------------
# Timing semantics.
# ---------------------------------------------------------------------

[timing_semantics]
cpu_clock = "time.perf_counter_ns"
cpu_unit = "integer_nanoseconds"
cpu_start_definition = "immediately before the bound stage's entry"
cpu_end_definition = "immediately after the bound stage's required completion (its defined exit point, not merely enqueue when the stage is itself CPU-only)"
cuda_timing_mechanism = "cuda_events_on_the_active_execution_stream"
cuda_event_start_definition = "recorded immediately before the bound CUDA stage begins"
cuda_event_end_definition = "recorded immediately after enqueueing that stage's final CUDA operation"
cuda_synchronization_policy = "synchronize only at the defined measurement boundary (elapsed-time query), never mid-stage; unsynchronized CPU wall time must never be substituted for CUDA event timing"
cuda_elapsed_unit = "float64_milliseconds_as_returned_by_the_cuda_event_elapsed_time_api"
cuda_to_persisted_unit_conversion = "persist the float64 milliseconds value directly, unrounded; if a nanosecond integer field is also required for cross-comparison with CPU timings, convert via nanoseconds = round_half_even(milliseconds * 1e6) and record both the original float64 milliseconds and the derived integer nanoseconds, never only the derived value"
cuda_warmup_labeling = "initialization/warm-up CUDA work (first-call kernel compilation, cuDNN/cuBLAS algorithm selection, context creation) must be recorded under a separate warmup-labeled record, never merged into a scientific stage's steady-state timing"
cuda_synchronization_overhead_disclosure = "any CPU time spent blocked in a synchronization call at a measurement boundary must be disclosed as a distinct field, never silently folded into the adjacent stage's elapsed time"
cuda_timing_unavailable_for_cpu_only_stages = "a CPU-only stage (e.g. authority_preflight_verification, dataset_index_and_manifest_adapter_construction, scientific_row_array_assembly) records cuda_elapsed_ms = null (unavailable), never a fabricated 0.0"
total_run_wall_time_definition = "measured independently of any stage-total reconstruction, via one time.perf_counter_ns() pair spanning the entire run process from authority_preflight_verification entry to final_result_validation_and_installation exit (or to the last checkpoint write on an incomplete run)"

# ---------------------------------------------------------------------
# Host-memory measurement semantics.
# ---------------------------------------------------------------------

[host_memory_semantics]
fields = ["host_rss_bytes_before", "host_rss_bytes_after", "process_peak_rss_bytes_after_stage"]
host_rss_source = "/proc/self/status VmRSS line"
process_peak_rss_source = "/proc/self/status VmHWM line (cumulative high-water mark -- never labeled a per-stage-local peak)"
final_process_peak_rss_source = "resource.getrusage(resource.RUSAGE_SELF).ru_maxrss, with an explicitly frozen platform conversion (Linux: kibibytes; the conversion factor used must itself be recorded alongside the raw value)"
proc_status_parsing_rule = "match the line beginning 'VmRSS:' or 'VmHWM:' (exact prefix, case-sensitive), take the sole embedded integer token as kibibytes"
proc_status_unit = "integer_kibibytes_as_reported_by_the_kernel"
proc_status_to_bytes_conversion = "bytes = KiB * 1024, exact integer arithmetic, no floating point"
unavailable_vs_zero = "a field that could not be read (missing /proc, parse failure, permission denied) is recorded as null (unavailable), never as 0"
malformed_value_handling = "a negative, non-finite, or non-integer parsed value is rejected as malformed, not silently coerced"
background_sampling_interval = "not authorized by this identity -- no background memory sampler is frozen; only before/after and cumulative-peak measurements at defined stage boundaries"
cumulative_high_water_mark_naming_forbidden_as_stage_peak = true

# ---------------------------------------------------------------------
# GPU-memory measurement semantics (detailed profiling mode only).
# ---------------------------------------------------------------------

[gpu_memory_semantics]
fields = [
    "gpu_allocated_bytes_before", "gpu_reserved_bytes_before",
    "gpu_allocated_bytes_after", "gpu_reserved_bytes_after",
    "gpu_peak_allocated_bytes_during_stage", "gpu_peak_reserved_bytes_during_stage",
    "gpu_device_index", "gpu_device_model",
]
stage_local_peak_mechanism = "torch.cuda.reset_peak_memory_stats(device) immediately before stage entry; torch.cuda.max_memory_allocated(device) and torch.cuda.max_memory_reserved(device) immediately after the stage's defined CUDA measurement boundary (after the same synchronization point used for cuda_synchronization_policy)"
reset_placement = "at stage entry, after any before-stage snapshot is taken, before the stage's own CUDA work begins"
synchronization_placement = "identical to timing_semantics.cuda_synchronization_policy -- query peak stats only at the defined measurement boundary"
exact_device_requirement = "device index is fixed and recorded; a run touching more than one CUDA device is a contract violation (single_gpu_only, per population.gpu_count=1)"
reset_does_not_free_or_move_memory = true
values_are_operational_metadata_only = true
unavailable_for_cpu_only_stages = "gpu_* fields = null for a stage with no CUDA work, never fabricated as 0"
integer_bytes_required = true
non_negative_validation_required = true
nvidia_smi_process_wide_values_forbidden_as_silent_replacement = "if nvidia-smi (or any other process-wide/device-wide source) values are ever also recorded, they must be a distinct, separately-labeled field -- never silently substituted for the allocator-reported (torch.cuda.*) values above"

# ---------------------------------------------------------------------
# Profiling aggregation.
# ---------------------------------------------------------------------

[profiling_aggregation]
statistics = ["count", "sum", "mean", "min", "max", "median", "p90", "p95", "p99"]
percentile_convention = "nearest_rank"
percentile_rule = "sort ascending; rank = max(1, ceil(p * n)); value = sorted_values[rank - 1] (0-indexed)"
zero_records_behavior = "count=0; sum/mean/min/max/median/p90/p95/p99 = null (undefined), never 0.0 or NaN"
one_record_behavior = "count=1; sum=mean=min=max=median=p90=p95=p99 = that single value"
unavailable_cuda_field_behavior = "a record with cuda_elapsed_ms = null is excluded from CUDA-timing aggregates but still counted in count and in any CPU-side aggregate for that same stage; excluding a null-valued record from a numeric aggregate must never silently zero-fill it"
mixed_scope_aggregation_forbidden = "image-scoped and window-scoped (and component_chunk-scoped) records for the same stage name are never averaged or combined into one aggregate; aggregation groups strictly by (stage_name, scope)"
non_finite_value_rejection = "NaN or +-infinity in any profiling numeric field is rejected at record-validation time, never aggregated"
integer_overflow_handling = "aggregate sums accumulate in Python's arbitrary-precision int/float; a persisted integer field exceeding int64 range is rejected rather than silently wrapped"
duplicate_record_identity_rejection = "two records sharing the same canonical record identity (stage_name, scope, and the scope's covariate key: run_id / canonical_image_id / (canonical_image_id, window_ordinal) / (canonical_image_id, window_ordinal, component_chunk_index)) are rejected as a duplicate, never averaged or last-write-wins merged"
aggregation_group_key = "(stage_name, scope)"

[profiling_aggregation.workload_covariates]
list = [
    "canonical_image_index", "canonical_image_id", "window_index", "window_canonical_identity",
    "windows_per_image", "component_count", "query_class_count", "component_chunk_count",
    "node_count", "disputed_pixel_count", "component_chunk_size",
]
disputed_pixel_count_authorization_note = "disputed_pixel_count is already an E15/E16-authorized scientific-adjacent count (e15-dfp-phase1b-artifacts.[stage_a_schema].manifest_fields.dispute_count_per_image); recorded here only as a profiling covariate, never recomputed with a different definition"
no_new_scientific_statistic_introduced_for_profiling = true

# ---------------------------------------------------------------------
# Checkpoint schema (closed, versioned). Binds e15's own
# checkpoint_resume_schema/path_policy/atomic_write_policy rather than
# inventing an alternative.
# ---------------------------------------------------------------------

[checkpoint_schema]
schema_name = "talk2dino-dfp-phase1b-diagnostic-checkpoint-v1"
schema_version = 1
binds_e15_checkpoint_resume_schema = true
binds_e15_path_policy = true
binds_e15_atomic_write_policy = true
top_keys = [
    "schema_name", "schema_version", "identity_bindings", "progress",
    "scientific_state", "profiling_state", "complete", "final",
]

[checkpoint_schema.identity_bindings]
keys = [
    "e20_identity_name", "e20_identity_schema_version", "e20_identity_sha256",
    "e15_protocol_sha256", "e15_artifacts_sha256", "e18_chunk_selection_sha256", "e19_tolerance_sha256",
    "subset_manifest_sha256", "window_universe_digest", "scientific_schema_name", "scientific_schema_version",
    "run_mode", "device_type", "gpu_model", "gpu_count", "component_chunk_size", "conservation_tolerance",
]
e20_identity_sha256_circularity_note = "the checkpoint records THIS identity's own file hash for provenance, exactly as e19's own module binds itself by hash elsewhere in this repository's convention; the identity file itself never records a checkpoint's hash, so no cycle exists"

[checkpoint_schema.progress]
keys = [
    "expected_image_count", "expected_window_count", "next_canonical_image_index",
    "completed_image_ids", "completed_window_count", "total_processed_component_chunks",
    "generation", "complete", "final_result_produced",
]
expected_image_count_value = 500
expected_window_count_value = 1090
completed_image_ids_order = "exact prefix, in the frozen canonical (lexicographic fixed-width-ID) manifest order -- never reordered"

[checkpoint_schema.scientific_state]
keys = ["stage_a_artifact_filename", "stage_a_schema_name", "stage_a_schema_version", "stage_a_row_count", "stage_a_byte_sha256", "scientific_collection_digest", "progress_to_rows_relation"]
progress_to_rows_relation = "stage_a_row_count must equal the flat disputed-pixel row count implied by completed_image_ids' dispute_offsets prefix -- an exact relation, never approximate"
binds_alternative_scientific_data = false
invents_no_new_scientific_array = true

[checkpoint_schema.profiling_state]
keys = ["profiling_mode", "profiling_record_filename", "profiling_schema_name", "profiling_schema_version", "profiling_record_count", "profiling_digest", "incomplete_final_stage_handling"]
incomplete_final_stage_handling = "an in-progress (unterminated) stage record at interruption time is persisted with an explicit incomplete=true marker and excluded from all aggregate reconstruction; it is never promoted to a completed timing sample"
profiling_state_excluded_from_scientific_digest = true

# ---------------------------------------------------------------------
# Resume rules.
# ---------------------------------------------------------------------

[resume_rules]
fresh_requires_no_existing_checkpoint_or_artifacts = true
fresh_overwrite_requires_separate_explicit_authorization = true
resume_requires_valid_incomplete_checkpoint = true
bindings_must_match_exactly = true
completed_ids_must_be_exact_prefix_of_frozen_manifest = true
completed_windows_must_match_that_prefixs_canonical_windows = true
skipped_duplicated_reordered_or_cross_fed_rows_forbidden = true
partial_generations_rejected = true
corrupted_hashes_rejected = true
v1_or_unknown_schema_rejected = true
complete_unfinalized_checkpoint_may_enter_finalize_only_path = true
already_finalized_runs_rejected_for_resume = true
resume_must_not_reprocess_completed_images = true
scientific_state_restoration_exact = true
profiling_record_disagreement_rejected_note = "a resumed run's profiling records for an already-completed image must not be regenerated or altered; only new records for not-yet-completed work may be appended"

# ---------------------------------------------------------------------
# Fresh/resume scientific equivalence contract.
# ---------------------------------------------------------------------

[fresh_resume_equivalence]
scientific_arrays_bit_identical_where_schema_promises_it = true
required_equal_fields = [
    "row_order", "selected_ids", "window_order", "offsets", "flat_arrays",
    "scientific_collection_digest", "final_scientific_result_document_excluding_operational_fields",
]
profiling_may_differ_in = ["wall_time", "host_memory_measurements", "gpu_memory_measurements"]
profiling_must_preserve = [
    "unique_record_identities", "no_duplicate_completed_stage_records_after_resume",
    "correct_interrupted_attempt_labeling", "aggregate_reconstruction_from_accepted_records_only",
]
interrupted_partial_stage_record_disposition = "stored as an explicit incomplete record (never discarded silently, never treated as completed) -- matches checkpoint_schema.profiling_state.incomplete_final_stage_handling"

# ---------------------------------------------------------------------
# Profiling artifact schema (closed, versioned, operational-only).
# ---------------------------------------------------------------------

[profiling_artifact_schema]
schema_name = "talk2dino-dfp-phase1b-diagnostic-profiling-v1"
schema_version = 1
operational_only = true
included_in_scientific_digest = false
top_keys = [
    "schema_name", "schema_version", "e20_identity_sha256", "profiling_mode", "complete", "final",
    "run_identity", "device_record", "software_record", "timing_method", "host_memory_method",
    "gpu_memory_method", "stage_name_enumeration", "records", "aggregates", "workload_covariates",
    "total_run_wall_time_ns", "total_scientific_processing_wall_time_ns", "checkpoint_io_wall_time_ns",
    "unattributed_overhead_ns", "runtime_budget", "warnings", "source_scientific_collection_digest",
]
record_identity_uniqueness_key = "(stage_name, scope, scope_covariate_key)"
runtime_budget_fields = ["maximum_job_wall_time_seconds", "elapsed_job_wall_time_seconds", "remaining_budget_seconds"]

# ---------------------------------------------------------------------
# Final-result bundle schema (closed, versioned).
# ---------------------------------------------------------------------

[final_result_schema]
schema_name = "talk2dino-dfp-phase1b-diagnostic-result-v1"
schema_version = 1
top_keys = [
    "schema_name", "schema_version", "e20_identity_sha256", "run_mode", "image_count", "window_count",
    "component_chunk_size", "conservation_tolerance", "scientific_artifacts", "scientific_collection_digest",
    "profiling_artifact_reference", "profiling_mode", "checkpoint_source", "finalization_state",
    "device_record", "software_record", "total_job_wall_time_seconds", "within_8_hour_allocation",
    "complete", "final", "offline_mechanistic_analysis", "deployed_inference_method", "full_5000_image_evaluation",
]
image_count_required_value = 500
window_count_required_value = 1090
complete_required = true
final_required = true
partial_generations_forbidden = true
within_8_hour_allocation_definition = "total_job_wall_time_seconds <= 28800"
within_8_hour_allocation_is_disclosure_not_acceptance_gate = true
scientific_validity_independent_of_runtime_budget = true
offline_mechanistic_analysis_required_value = true
deployed_inference_method_required_value = false
full_5000_image_evaluation_required_value = false

[final_result_schema.scientific_artifacts]
keys_per_artifact = ["filename", "schema_name", "schema_version", "row_count", "size_bytes", "sha256"]
references_e15_stage_a_schema = true

# ---------------------------------------------------------------------
# Atomicity and path policy: binds e15's own [path_policy] and
# [atomic_write_policy] verbatim; adds only the population-specific
# filenames a future writer/installer must use.
# ---------------------------------------------------------------------

[atomicity_and_path_policy]
binds_e15_path_policy = true
binds_e15_atomic_write_policy = true
run_specific_output_root = "one single output root directory per run; every artifact for that run is a safe basename under it -- never an absolute or private path recorded in any authority document"
canonical_filenames = [
    "phase1b_diagnostic_checkpoint.json",
    "phase1b_diagnostic_stage_a.npz",
    "phase1b_diagnostic_profiling.json",
    "phase1b_diagnostic_result.json",
]
lexical_dotdot_rejected = true
physical_containment_required = true
symlink_escape_rejected = true
exclusive_fresh_creation_by_default = true
same_filesystem_staging_required = true
fsync_requirements = "consistent with e15-dfp-phase1b-artifacts.[atomic_write_policy] (fsync staged files and the destination directory entry before the atomic rename that publishes them)"
atomic_rename_required = true
verified_rollback_for_multi_file_replacement_required = true
no_orphaned_partial_final_bundle = true
source_checkpoint_and_scientific_artifacts_immutable_during_finalization = true
installers_not_implemented_by_this_task = true

# ---------------------------------------------------------------------
# Authorization boundary: the ground truth. A verifier checks these
# booleans directly, never infers them from prose.
# ---------------------------------------------------------------------

[authorization_boundary]
authority_only_task = true
execution_driver_implemented_by_task6b = false
profiler_implemented_by_task6b = false
checkpoint_writer_implemented_by_task6b = false
result_writer_implemented_by_task6b = false
cli_execution_command_implemented_by_task6b = false
slurm_launcher_implemented_by_task6b = false
real_inference_executed_by_task6b = false
gpu_execution_performed_by_task6b = false
phase1b_500_image_execution_authorized = false
phase1b_5000_image_exact_provenance_authorized = false
full_5000_image_miou_evaluation_authorized = false
lightweight_final_method_selected = false
sharding_across_jobs_or_gpus_authorized = false

# ---------------------------------------------------------------------
# Disclosure.
# ---------------------------------------------------------------------

[disclosure]
offline_mechanistic_provenance_analysis = true
not_the_deployed_test_time_method = true
not_a_claim_of_efficient_inference = true
not_a_5000_image_paper_evaluation = true
not_a_lightweight_final_method = true
not_a_replacement_for_full_validation_set_miou_evaluation = true
population_is_500_images_1090_windows = true
conservation_tolerance_is_frozen_not_reselected = true
chunk_size_is_frozen_not_reselected = true
single_h100_single_gpu_contract = true
eight_hour_allocation_is_operational_disclosure_not_scientific_gate = true
profiling_on_off_scientific_equivalence_required = true
task6b_performs_no_inference = true
task6b_creates_no_execution_output = true
future_500_image_execution_requires_separate_explicit_authorization = true
future_5000_image_exact_provenance_requires_separate_explicit_authorization_and_is_not_implied_here = true

# ---------------------------------------------------------------------
# Prohibited.
# ---------------------------------------------------------------------

[prohibited]
list = [
    "modifying_e13_through_e19_identities",
    "modifying_the_verified_calibration_artifact_or_installed_task4_selection_artifact",
    "modifying_masked_forward_recurrence_graph_stitching_pullback_or_component_code",
    "redefining_component_definition_query_class_selection_prediction_variants_recurrence_contribution_sign_resizing_stitching_conservation_formula_tolerance_or_chunk_size",
    "implementing_an_execution_driver_profiler_checkpoint_writer_result_writer_or_cli_execution_command",
    "implementing_a_slurm_launcher",
    "running_real_inference_or_initializing_cuda",
    "accessing_coco_stuff_images_or_annotations",
    "sharding_the_500_image_run_across_multiple_jobs_or_gpus",
    "authorizing_the_500_image_diagnostic_execution",
    "authorizing_exact_masked_forward_provenance_on_the_5000_image_validation_set",
    "authorizing_the_full_5000_image_miou_evaluation",
    "selecting_a_lightweight_final_method",
    "adding_a_new_scientific_statistic_only_to_aid_profiling",
    "creating_a_circular_hash_dependency",
]

[future_step_bindings]
description = "Fields explicitly deferred to a later task, never guessed or invented here."
next_step_items = [
    "independently re-verify this E20 identity and its loader/CLI module against the committed HEAD",
    "implement the execution driver, profiler, checkpoint writer, and result writer bound by this contract -- a separate, later, separately-authorized task",
    "explicitly authorize the 500-image diagnostic execution itself -- never this identity",
    "the 5,000-image exact masked-forward provenance question and the full 5,000-image mIoU evaluation -- never this identity",
]
