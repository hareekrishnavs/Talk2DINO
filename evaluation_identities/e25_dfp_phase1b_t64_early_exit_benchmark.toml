# This identity freezes the SCIENTIFIC AND OPERATIONAL CONTRACT for a
# future T64-versus-T320 early-exit performance benchmark. It is NOT a
# continuation of BALP candidate evaluation: BALP itself is already
# closed (E22's frozen strict eligibility rule applied to the completed
# E23 execution independently yielded 0/16 eligible candidates,
# NO_BALP_CANDIDATE_PROCEEDS, frozen by E24). T64 here is the already-
# measured T=64 CONTROL from that same completed 350-image development
# result -- re-examined only as a possible operational (wall-clock)
# shortcut for the unmodified T320 recurrence, never as a new accuracy
# candidate, never preregistered before development, and not yet
# validated on the confirmation split or the full 5,000-image
# population. T64 must always be labeled a POST-DEVELOPMENT SELECTED
# OPERATIONAL CANDIDATE -- never a preregistered method, never a new
# accuracy winner.
#
# This identity implements no benchmark runner, no CLI execute path, no
# sbatch launcher, no model/dataset provider, and no trial-merging code
# beyond pure schema/identity validation helpers. It runs no inference,
# submits no GPU job, accesses no dataset image or GT annotation, loads
# no model weight, and initializes no CUDA. It authorizes no
# confirmation evaluation and no full 5,000-image evaluation.

[identity]
name = "e25-dfp-phase1b-t64-early-exit-benchmark"
schema_name = "talk2dino-dfp-phase1b-t64-early-exit-benchmark-identity-v1"
schema_version = 1
description = "Freezes the scientific/operational contract for a future T64_early_exit-versus-T320_reference wall-clock benchmark on the frozen E17 24-window population: exact recurrence-horizon semantics (T64 genuinely stops after step 64, never runs steps 65-320), a 2-warm-up/6-measured fresh-process trial schedule with a counterbalanced order, exact timing/memory/scientific-output contracts, exact summary formulas, and a closed two-outcome decision rule (PROCEED_TO_FREEZE_T64_CONFIRMATION_PROTOCOL / STOP_T64_EARLY_EXIT_TRACK) requiring >=1.25x end-to-end speedup. Implements no runner, no CLI execute path, no launcher, and authorizes no real GPU execution, no confirmation evaluation, and no full 5,000-image evaluation."
required_ancestor_commit = "453b2d2dec90dcf0623ac94eb177aa5be64db40e"
working_branch = "dfp-phase1a-diagnostics"
successor_of = "e24-dfp-phase1b-balp-development-closure"
mutates_or_version_bumps_earlier_identity = false

