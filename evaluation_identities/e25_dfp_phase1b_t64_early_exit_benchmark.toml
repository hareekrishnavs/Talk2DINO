canonical_manifest_digest = "4b962001ccab863b4c7a156cdbde5f55b66b3ff26a9d429a8b6f148550551847"
benchmark_record_digest = "8193ef03f5d1dee843098ded6ce896f0f5fe072d49f37d2657ad9b6507fec142"
deterministic_order = "benchmark_slot ascending (0..23), identical for every trial and every variant"
warmup_record_distinction = "the manifest's own single warmup_record (selection_rank=1), frozen by E17, never one of the 24 measured benchmark_records -- reused verbatim, never re-selected"
gt_annotation_field_present_in_manifest = false
population_fixed_before_execution = true
same_population_required_across_all_variants_and_trials = true

# ---------------------------------------------------------------------
# Execution schedule.
# ---------------------------------------------------------------------

[execution_schedule]
required_device_type = "cuda"
required_gpu_model = "h100_80gb"
gpu_count = 1
cpus_per_task = 8
host_memory = "80G"
max_wall_time = "02:00:00"
fresh_process_per_trial_required = true
same_node_required = true
same_gpu_model_required = true
same_requested_resources_required = true
same_software_environment_required = true
same_committed_head_required = true
repository_worktree_clean_required = true

[execution_schedule.warmup]
t64_early_exit = 1
t320_reference = 1
runs_before_measured_matrix = true
excluded_from_summary_statistics = true
schema_valid_required = true

[execution_schedule.measured_repeats]
t64_early_exit = 3
t320_reference = 3
total_measured_trials = 6

[execution_schedule.counterbalanced_order]
description = "Six fresh-process measured trials, strictly sequential, in this exact counterbalanced order."
ordered_trial_list = [
    { trial_index = 0, variant = "T320_reference", repeat = 0 },
    { trial_index = 1, variant = "T64_early_exit", repeat = 0 },
    { trial_index = 2, variant = "T64_early_exit", repeat = 1 },
    { trial_index = 3, variant = "T320_reference", repeat = 1 },
    { trial_index = 4, variant = "T320_reference", repeat = 2 },
    { trial_index = 5, variant = "T64_early_exit", repeat = 2 },
]

# ---------------------------------------------------------------------
# Timing definitions.
# ---------------------------------------------------------------------

[timing_definitions.primary]
name = "measured_window_loop_wall_ns"
clock_source = "time.perf_counter_ns"
unit = "integer nanoseconds"
definition_steps = [
    "all authority verification, dataset construction, model construction, and checkpoint loading have completed",
    "synchronize CUDA immediately before processing the first measured window",
    "start time.perf_counter_ns()",
    "process all 24 fixed measured windows in canonical (benchmark_slot ascending) order",
    "synchronize CUDA after the final measured window",
    "stop time.perf_counter_ns()",
]

[timing_definitions.derived]
measured_window_loop_seconds = "measured_window_loop_wall_ns / 1e9"
window_throughput_per_second = "measured_window_count / measured_window_loop_seconds"
mean_seconds_per_window = "measured_window_loop_seconds / measured_window_count"

[timing_definitions.process_phase_fields]
list = [
    "process_total_wall_ns", "preflight_wall_ns", "dataset_construction_wall_ns",
    "model_construction_and_checkpoint_loading_wall_ns", "measured_window_loop_wall_ns",
    "artifact_validation_and_write_wall_ns", "unattributed_overhead_ns",
]
accounting_identity = "process_total_wall_ns == preflight_wall_ns + dataset_construction_wall_ns + model_construction_and_checkpoint_loading_wall_ns + measured_window_loop_wall_ns + artifact_validation_and_write_wall_ns + unattributed_overhead_ns"
all_values_non_negative_integers = true
unknown_timing_silently_recorded_as_zero_forbidden = true

# ---------------------------------------------------------------------
# Stage profiling (best-effort, secondary; never the runtime-decision
# quantity).
# ---------------------------------------------------------------------

[stage_profiling_contract]
stages = ["input_preparation", "unary_model_forward", "graph_construction", "canonical_recurrence", "stitching_and_rescale", "output_validation"]
primary_runtime_decision_field = "measured_window_loop_wall_ns"
sum_of_stage_timings_forbidden_as_primary = true
gpu_event_boundaries_identical_across_variants_required = true
per_small_operation_synchronize_forbidden = true
single_outer_synchronize_boundary_required = true
profiling_must_not_alter_scientific_output = true

[stage_profiling_contract.count_fields]
list = ["recurrence_steps_executed", "model_forward_count", "graph_construction_count", "window_count"]

[stage_profiling_contract.required_relations]
t64_recurrence_steps_executed = "window_count * 64"
t320_recurrence_steps_executed = "window_count * 320"
model_forward_count = "window_count"
graph_construction_count = "window_count"

# ---------------------------------------------------------------------
# Memory telemetry.
# ---------------------------------------------------------------------

[memory_telemetry_contract]
fields = ["host_peak_rss_bytes", "gpu_peak_memory_allocated_bytes", "gpu_peak_memory_reserved_bytes", "gpu_total_memory_bytes"]
host_rss_source = "the committed /proc/self/status VmRSS parser (execmod.ProfilingRecorder.host_rss_bytes convention) or an independently bound equivalent"
gpu_peak_reset_call = "torch.cuda.reset_peak_memory_stats()"
gpu_peak_reset_timing = "immediately before the measured window loop begins"
synchronize_before_final_gpu_memory_collection_required = true
all_values_non_negative_integers = true
allocated_must_not_exceed_reserved = true
reserved_must_not_exceed_total_device_memory = true
missing_gpu_telemetry_on_cuda_trial_is_validation_failure = true

# ---------------------------------------------------------------------
# Scientific-output guard rails (operational benchmark, scientifically
# guarded outputs).
# ---------------------------------------------------------------------

[scientific_output_contract]
per_trial_fields = ["variant_id", "scientific_output_collection_digest", "per_window_output_digests", "finite_value_counts", "non_finite_value_counts"]
within_variant_digest_equality_required = true
within_variant_digest_equality_scope = "all three measured trials of the same variant must have bitwise-identical scientific_output_collection_digest"
cross_variant_digest_equality_required = false
warmup_output_schema_valid_required = true
warmup_excluded_from_performance_summaries = true
non_finite_value_count_must_be_zero = true
performance_instrumentation_must_not_change_scientific_digest = true

[scientific_output_contract.future_implementation_test_obligation]
description = "The future benchmark-runner implementation's own tests must independently prove BOTH of the following on controlled (non-production-scale) fixtures: (1) T64_early_exit's output equals the EXACT step-64 state obtained by taking a canonical 320-step finite_step_propagate reference trajectory (steps=320, snapshot_steps including 64) and reading its own step-64 snapshot -- i.e. T64's shortened call is mathematically equivalent to the prefix of the full trajectory; AND (2) the REAL T64_early_exit benchmark trial genuinely executes only 64 steps (e.g. via a step-count instrumentation/call-counting proof on the real call path), never silently running 320 and merely discarding steps 65-320's output. Both properties must be proven together -- proving only (1) would not rule out a disguised full-320 run that merely reports the step-64 snapshot."

# ---------------------------------------------------------------------
# Summary statistics.
# ---------------------------------------------------------------------

[summary_statistics]
per_variant_fields = [
    "median_measured_window_loop_seconds", "minimum_measured_window_loop_seconds", "maximum_measured_window_loop_seconds",
    "median_window_throughput_per_second", "maximum_host_peak_rss_bytes",
    "maximum_gpu_peak_memory_allocated_bytes", "maximum_gpu_peak_memory_reserved_bytes",
]
t64_speedup_over_t320_formula = "median_T320_measured_window_loop_seconds / median_T64_measured_window_loop_seconds"
t64_recurrence_speedup_over_t320_formula = "median_T320_recurrence_seconds / median_T64_recurrence_seconds"
recurrence_only_speedup_substitution_for_end_to_end_speedup_forbidden = true
five_thousand_image_runtime_projection_from_24_window_benchmark_as_measured_fact_forbidden = true

[summary_statistics.projection_rules]
must_be_explicitly_labeled_unmeasured = true
must_be_separated_from_benchmark_measurements = true
excluded_from_proceed_decision = true
must_include_exact_formula_and_assumptions = true
historical_approximately_1h18m_baseline_usable_as_e25_performance_baseline = false
historical_baseline_usable_as_context_only_if_log_commit_hardware_and_execution_contract_are_verified_and_bound = true

# ---------------------------------------------------------------------
# Decision rule.
# ---------------------------------------------------------------------

[decision_rule]
outcomes = ["PROCEED_TO_FREEZE_T64_CONFIRMATION_PROTOCOL", "STOP_T64_EARLY_EXIT_TRACK"]
outcome_set_closed = true
adaptive_threshold_authorized = false
end_to_end_speedup_threshold = 1.25
threshold_comparison_operator = "greater_than_or_equal"
authorizes_confirmation_evaluation_directly = false
authorizes_full_5000_image_evaluation_directly = false

[decision_rule.proceed_requires_all_of]
list = [
    "all warm-up and measured trials complete successfully",
    "all trial artifacts verify",
    "within-variant scientific digests are identical",
    "zero non-finite outputs",
    "exact model-forward, graph-construction, and recurrence-step counts",
    "no OOM",
    "all memory relations pass",
    "T64 median measured-window-loop time is lower than T320",
    "primary end-to-end speedup t64_speedup_over_t320 >= 1.25",
    "the frozen development accuracy disclosure remains T64 minus T320 = -0.074828045106592 percentage points",
]

[decision_rule.proceed_does_not_itself_authorize]
list = [
    "the_150_image_confirmation_evaluation", "candidate_selection_as_a_final_paper_method",
    "the_full_5000_image_evaluation", "a_deployment_claim", "a_latency_claim_outside_the_measured_h100_contract",
]

