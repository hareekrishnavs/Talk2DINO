# ---------------------------------------------------------------------
# Recurrence execution contract: the exact, load-bearing technical
# mechanism that makes a genuine T64 early exit possible without
# modifying any bound scientific module. Verified directly against
# finite_step_regime_module's and recurrence_capture_module's own
# committed source before this identity was authored.
# ---------------------------------------------------------------------

[recurrence_execution_contract]
mechanism = "finite_step_propagate(graph, s0, alpha=0.98, steps=<N>, snapshot_steps=(<N>,)) called directly, once per selected window, per variant"
t64_call_steps = 64
t320_call_steps = 320
t64_snapshot_steps = [64]
t320_snapshot_steps = [320]
loop_structure_note = "finite_step_propagate's own `for step in range(1, steps + 1)` loop structurally terminates at `steps` -- calling it with steps=64 makes step 65 unreachable code for that call, never merely unread output"
capture_dfp_phase1a_trajectory_usable_for_t64 = false
capture_dfp_phase1a_trajectory_usable_for_t320 = true
snapshot_of_a_320_step_run_forbidden_for_t64 = true
graph_reused_across_variants = true
graph_constructed_fresh_per_window_per_trial = true
unary_model_forward_count_per_window_per_variant = 1
graph_construction_count_per_window_per_variant = 1
candidate_specific_recurrence_authorized = false
exact_masked_forward_provenance_authorized = false
component_construction_authorized = false

# ---------------------------------------------------------------------
# Benchmark design: the two frozen variants and everything that must
# stay identical between them except the recurrence horizon.
# ---------------------------------------------------------------------

[benchmark_design]
variants = ["T64_early_exit", "T320_reference"]
variant_count = 2

[benchmark_design.t64_early_exit]
recurrence_start = "canonical S0, identical to T320_reference"
graph = "canonical k12 directed top-k graph, identical to T320_reference"
k = 12
alpha = 0.98
affinity_function = "relu_cosine_power"
affinity_power = 3.0
maximum_recurrence_step = 64
output_step = 64
forbidden_steps = "65-320 (must not execute)"

[benchmark_design.t320_reference]
recurrence_start = "canonical S0"
graph = "canonical k12 directed top-k graph"
k = 12
alpha = 0.98
affinity_function = "relu_cosine_power"
affinity_power = 3.0
maximum_recurrence_step = 320
output_step = 320

[benchmark_design.held_identical_between_variants]
list = [
    "selected_windows_and_order", "dataset_records", "image_preprocessing", "unary_model", "checkpoint",
    "text_embeddings", "graph_construction", "graph_instance_semantics", "numerical_precision",
    "stitching_and_rescaling", "device", "software_environment", "model_mode", "deterministic_settings",
    "output_validation",
]

[benchmark_design.per_window_call_budget]
unary_model_forward_calls = 1
graph_construction_calls = 1
recurrence_passes = 1
candidate_specific_recurrence_calls = 0

# ---------------------------------------------------------------------
# Fixed benchmark population: reuses E17's already-frozen, already-
# independently-audited 24-window manifest verbatim. No GT annotation
# field exists anywhere in the manifest (verified directly against its
