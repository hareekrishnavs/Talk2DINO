relative_path = "evaluation_identities/e3_paired_soft_routing.toml"
sha256 = "db9cb8d407d6b5770d13c2b6546a33008206ae44ebcdc55f6b7384813eec477c"
note = "governs the CLIP-text-to-shared-space projection used to derive per-class text prototypes; the class NAME strings themselves are governed transitively by [authority_bindings.phase1a_protocol]'s own coco_stuff_dataset.class_names_digest"

[authority_bindings.final_resolution_stitching_pullback_code]
relative_path = "src/dfp_phase1a_stitching_pullback.py"
sha256 = "6e15dd8b967eeaa317ab417ded2127d04f9064accf97fca6275e7cf962a1ac04"

[authority_bindings.composed_final_resolution_pullback_code]
relative_path = "src/dfp_phase1a_final_rescale_pullback.py"
sha256 = "fe771097e0204dde1f48d236f6142ec32880743e0fb4638425938e489af14298"

[authority_bindings.global_unary_component_code]
relative_path = "src/dfp_phase1a_global_unary_components.py"
sha256 = "612403bcc5faa58be4dc54d1b941bc6989abd8e4f3214ff8c33e70926b03fb2f"

[authority_bindings.soft_membership_code]
relative_path = "src/dfp_phase1a_soft_membership.py"
sha256 = "7bef9b800aa2770166422f715456d994e67fa218347bba6bb9d5b66695d03ac9"

[gate1_verified_facts]
run_mode = "coco_stuff_500"
image_count = 500
gate1_verdict = "PROCEED_TO_PHASE_1B"
boundary_trigger_status = "FIRED"
boundary_iou_authority_status_in_phase1a = "not_yet_bound"
next_prerequisite_from_gate1 = "BIND_BOUNDARY_IOU"
boundary_iou_successor_authority_now_bound_for_phase1b = true

# ---------------------------------------------------------------------
# Scientific purpose (Section 4)
# ---------------------------------------------------------------------

[scientific_purpose]
hypothesis = "Does component-level diffusion evidence provenance provide statistically and practically meaningful information for distinguishing harmful T0->T320 washouts from beneficial T0->T320 corrections, beyond unary confidence, propagation margin, text similarity and early-horizon persistence?"
phase1b_is_diagnostic_not_final_selector = true
gt_free_features_must_be_sealed_before_labeling = "GT may define evaluation labels only after GT-free provenance features are sealed (Stage A digest finalized before Stage B begins)"
gt_forbidden_in_component_construction = true
gt_forbidden_in_soft_membership = true
gt_forbidden_in_graph_construction = true
gt_forbidden_in_recurrence = true
gt_forbidden_in_contribution_calculation = true
gt_forbidden_in_feature_extraction = true
diagnostic_fitted_models_are_analysis_tools_only = true
fitted_diagnostic_model_forbidden_as_final_method = "no fitted diagnostic model produced under this protocol may be reported as the training-free final DFP method"
final_5000_image_evaluation_untouched = "the final 5,000-image COCO evaluation remains untouched and confirmatory; this protocol governs only the frozen stratified 500-image development subset"
subset_scope = "coco_stuff_500 only; ade20k_500 was never run for Gate-1 and is out of scope for this protocol"

# ---------------------------------------------------------------------
# Canonical prediction and dispute definitions (Section 5)
# ---------------------------------------------------------------------

[canonical_predictions]
t0_definition = "canonical stitched final ori-resolution unary field"
t320_definition = "canonical stitched final ori-resolution propagated field"
a_definition = "lowest_index_argmax_of_T0_stitched_prediction"
b_definition = "lowest_index_argmax_of_T320_stitched_prediction"
tie_rule = "exact_argmax_ties_select_lowest_class_index"
dispute_set_definition = "D = {x : a(x) != b(x), GT(x) != ignore_index}"

[margins]
m0_definition = "m0(x) = S0(x,b) - S0(x,a); m0(x) <= 0"
m320_definition = "m320(x) = S320(x,b) - S320(x,a); m320(x) > 0"
delta_m_definition = "delta_m(x) = m320(x) - m0(x); delta_m(x) > 0"

[target_categories]
harmful_definition = "GT(x) == a(x) and GT(x) != b(x)"
beneficial_definition = "GT(x) == b(x) and GT(x) != a(x)"
third_label_definition = "GT(x) not in {a(x), b(x)}"
binary_gate2_population_definition = "GT(x) in {a(x), b(x)}"
positive_binary_label = "harmful = 1"
negative_binary_label = "beneficial = 0"
third_label_excluded_from_binary_negative_class = true
ignore_pixels_excluded_from_every_target_population = true

# ---------------------------------------------------------------------
# Canonical provenance components (Section 6)
# ---------------------------------------------------------------------

[component_construction]
source = "final ori-resolution T0 argmax map"
domain = "complete final image"
connectivity = 8
same_class_connected_components = true
ordering = "deterministic, by first flat pixel index in canonical row-major order"
gt_forbidden = true
per_window_components_forbidden = true
morphological_closing_forbidden = true
component_merging_after_observing_labels_forbidden = true
semantic_supercohort_as_causal_unit_forbidden = true
top_k_plus_residual_approximation_forbidden = true

[soft_membership_pullback]
composition_formula = "A_final = R composed with A_stitch"
per_source_patch_copy_sum_to_one = "sum_r M[r,w,j] = 1"
membership_nonnegative = "M[r,w,j] >= 0"
component_source_mass_is_diagnostic_only = true
component_source_mass_not_pixel_area = true
component_source_mass_not_patch_equivalent_area = true

# ---------------------------------------------------------------------
# Exact component evidence decomposition (Section 7)
# ---------------------------------------------------------------------

[component_evidence_decomposition]
masked_unary_seed_formula = "Y0^(r)[w,j,c] = M[r,w,j] * Y0[w,j,c]"
masked_unary_stitch_formula = "S0^(r) = A_final(Y0^(r))"
masked_propagated_stitch_formula = "S320^(r) = A_final(K320(P) Y0^(r))"
signed_component_evidence_formula = "G[x,r] = [S320^(r)(x,b) - S320^(r)(x,a)] - [S0^(r)(x,b) - S0^(r)(x,a)]"
conservation_identity = "sum_r G[x,r] = m320(x) - m0(x) = delta_m(x)"
exact_masked_forward_propagation_required = true
exact_chunking_only = true
same_graph_and_recurrence_as_canonical_t320_required = true
adjoint_approximation_forbidden_in_primary_implementation = true
dense_influence_kernel_forbidden = true
top_k_truncation_forbidden = true
residual_supercomponent_forbidden = true
altered_precision_between_canonical_and_masked_runs_forbidden = true
component_sum_accumulation_dtype = "fp64"
early_stopping_forbidden = true
equilibrium_solver_forbidden = true
recurrence_variant_required = "k12"
k11_counterfactual_forbidden = true
storage_requirement = "the artifact must store enough information to independently verify conservation without storing the full component-by-pixel evidence matrix"

# ---------------------------------------------------------------------
# Per-window class restriction (Section 8)
# ---------------------------------------------------------------------

[per_window_class_restriction]
q_w_definition = "Q_w = { a(x), b(x) : x is disputed and final window w contributes nonzero stitching weight to x }"
only_q_w_classes_carried_through_masked_propagation = true
derivation_source = "final stitched disputed pixels"
window_identifier_field = "position.relative_path"
window_identifier_bare_or_guessed_forbidden = true
ordering = "deterministic lowest-class-index ordering"
q_w_never_replaced_by_image_global_classes = true
q_w_never_restricted_to_raw_patch_argmax_classes = true
empty_q_w_requires_no_masked_propagation = true

# ---------------------------------------------------------------------
# Frozen provenance features (Section 9)
# ---------------------------------------------------------------------

[provenance_features.margins_and_controls]
unary_resistance_formula = "unary_resistance = -m0"
propagated_margin_formula = "propagated_margin = m320"
margin_change_formula = "margin_change = delta_m"
eta_net_formula = "eta_net = m320 / (m320 - m0)"
eta_net_denominator_note = "because m320 > 0 and m0 <= 0, the denominator (m320 - m0) is a sum of magnitudes and is always strictly positive"
epsilon_in_eta_net_denominator_forbidden = true
small_margin_exclusion_forbidden = true

[provenance_features.horizon_controls]
horizons_stored = [16, 32, 64]
b_wins_at_h_formula = "b_wins_at_h = 1[argmax S_h(x) = b(x)]"
a_wins_at_h_formula = "a_wins_at_h = 1[argmax S_h(x) = a(x)]"
third_wins_at_h_formula = "third_wins_at_h = 1 - b_wins_at_h - a_wins_at_h (otherwise case)"
primary_cheap_horizon_baseline = 32

[provenance_features.text_space_control]
text_cosine_ab_formula = "text_cosine_ab = cosine(t_a, t_b)"
text_prototype_source = "exact text prototypes bound to [authority_bindings.text_prototype_projection]"
gt_dependent_standardization_forbidden_during_feature_generation = true

[provenance_features.component_evidence]
g_plus_definition = "G_plus = { G[x,r] : G[x,r] > 0 }"
sort_order = "1) descending contribution; 2) ascending deterministic component ID for exact ties"
n_positive_components_field = "n_positive_components"
positive_evidence_sum_formula = "positive_evidence_sum = sum_r max(G[x,r], 0)"
negative_evidence_sum_formula = "negative_evidence_sum = sum_r min(G[x,r], 0)"
top_positive_component_id_field = "top_positive_component_id"
top_positive_evidence_field = "top_positive_evidence"
top1_positive_share_field = "top1_positive_share"
k_star_definition = "k_star(x) = minimum k such that m320(x) - sum_{q=1..k} G_positive_sorted[q] <= 0"
k_star_always_finite_for_valid_disputed_pixel = true
k_star_non_finite_case_behavior = "reject an invalid non-finite case rather than inventing infinity"
n_positive_components_stored_beside_k_star = "because the integer count is fragmentation-confounded"
phi_formula = "phi(x) = sum_{q=1..k_star} G_positive_sorted[q] / positive_evidence_sum"
phi_epsilon_forbidden = true
top1_positive_share_formula = "top1_positive_share = top_positive_evidence / positive_evidence_sum"
additional_concentration_diagnostics_forbidden_without_successor_authorization = "no Gini, entropy, or additional features may be added after observing results unless a later successor protocol explicitly authorizes them"

# ---------------------------------------------------------------------
# GT-isolation architecture (Section 10)
# ---------------------------------------------------------------------

[gt_isolation.stage_a]
label = "GT-free provenance feature artifact"
may_contain = [
    "image_identifiers", "dispute_offsets", "pixel_indices", "a_b_classes", "margins",
    "horizon_states", "text_cosine", "component_evidence_features", "conservation_diagnostics",
    "compute_diagnostics",
]
must_not_contain = [
    "gt_class", "harmful_beneficial_third_label_target", "oracle_decision",
    "gt_boundary_label", "any_fitted_prediction_using_gt",
]
must_be_finalized_and_content_hashed_before_stage_b_begins = true
driver_api_must_not_accept_gt_arrays_or_dataset_annotation_objects = true
tests_must_poison_gt_access_during_stage_a = true

[gt_isolation.stage_b]
label = "evaluation-label artifact"
binds_exact_stage_a_digest = true
may_add = [
    "gt_class", "harmful_beneficial_third_label_category", "boundary_interior_indicator",
    "deterministic_fold_id", "confusion_sufficient_statistics", "boundary_iou_sufficient_statistics",
    "diagnostic_model_outputs",
]

# ---------------------------------------------------------------------
# Deterministic fold assignment (Section 11)
# ---------------------------------------------------------------------

[fold_assignment]
fold_count = 5
images_per_fold = 100
pixels_never_split_across_folds = true
namespace = "talk2dino-dfp-phase1b-fold-assignment-v1"
key_formula = "key(image_id) = SHA256(namespace + NUL + canonical_image_id)"
sort_key = "(key, canonical_image_id)"
fold_id_formula = "fold_id = sorted_rank mod 5"
random_library_forbidden = true
filesystem_order_forbidden = true
python_hash_forbidden = true
required_stored_fields = ["fold_assignment", "fold_assignment_digest"]
required_checks = ["exactly_100_images_per_fold", "every_dispute_pixel_inherits_its_images_fold"]

# ---------------------------------------------------------------------
# Diagnostic feature evaluation (Section 12)
# ---------------------------------------------------------------------

[diagnostic_feature_evaluation]
gate2_uses_out_of_fold_predictions_only = true
primary_binary_task = "harmful_vs_beneficial"
third_label_excluded_from_model_fitting_and_binary_auroc_auprc = true
third_label_feature_and_risk_distributions_reported_separately = true

[diagnostic_feature_evaluation.cheap_control_model]
inputs = ["unary_resistance", "propagated_margin", "eta_net", "t16_horizon_state", "t32_horizon_state", "t64_horizon_state", "text_cosine_ab"]

[diagnostic_feature_evaluation.provenance_augmented_model]
inputs = [
    "unary_resistance", "propagated_margin", "eta_net", "t16_horizon_state", "t32_horizon_state",
    "t64_horizon_state", "text_cosine_ab", "k_star", "n_positive_components", "phi",
    "top1_positive_share", "positive_evidence_sum", "negative_evidence_sum",
]

[diagnostic_feature_evaluation.forbidden_primary_model_inputs]
forbidden = ["image_rgb", "gt", "class_frequency", "class_id", "thing_stuff_label", "dataset_statistics", "component_size"]
may_be_reported_as_subgroup_diagnostics_only_if_explicitly_listed = true

[diagnostic_model]
kind = "fixed_logistic_regression"
regularization = "l2"
c = 1.0
intercept_enabled = true
solver = "lbfgs"
max_iterations = 1000
convergence_tolerance = 0.0001
input_dtype = "float64"
standardization = "training_fold_only"
class_balancing_forbidden_unless_explicitly_frozen = true
class_balancing_frozen = false
hyperparameter_search_forbidden = true
early_model_selection_forbidden = true
test_fold_labels_in_standardization_or_fitting_forbidden = true
implementation = "scikit-learn LogisticRegression"
diagnostic_only_never_final_selector = true

# ---------------------------------------------------------------------
# Deterministic training subsampling (Section 13)
# ---------------------------------------------------------------------

[training_subsampling]
key_components = ["frozen_namespace", "canonical_image_id", "final_pixel_linear_index", "target_category"]
key_namespace = "talk2dino-dfp-phase1b-training-subsample-v1"
hash_algorithm = "SHA256"
retain_rule = "lowest keys, up to a fixed maximum per image per binary category"
maximum_per_image_per_binary_category = 4096
fewer_available_uses_all = true
held_out_evaluation_pixels_never_subsampled = true
required_reports = ["training_sample_counts", "full_held_out_evaluation_counts"]

# ---------------------------------------------------------------------
# Fold-safe transformations (Section 14)
# ---------------------------------------------------------------------

[fold_safe_transformations]
mean_std_from_training_folds_only = true
apply_training_statistics_to_held_out_fold = true
zero_variance_training_feature_behavior = "transform to zero and record it"
full_dataset_statistics_forbidden = true
binary_horizon_indicators_never_standardized = true
raw_single_feature_aurocs_unstandardized = true
descriptive_full_dataset_summaries_allowed_only_if_labelled_descriptive_and_never_fed_into_out_of_fold_fitting = true

# ---------------------------------------------------------------------
# Primary Gate-2 metrics (Section 15)
# ---------------------------------------------------------------------

[gate2_metrics]
primary = "out_of_fold_pixel_level_auroc"
secondary = "out_of_fold_pixel_level_auprc"
also_reported = [
    "harmful_prevalence", "per_image_auroc_where_both_classes_occur", "macro_mean_across_valid_images",
    "thing_stuff_subgroup_results", "boundary_interior_subgroup_results", "transition_text_similarity_bins",
    "third_label_risk_distribution", "coverage_of_gt_in_ab",
]
subgroup_metrics_are_descriptive_only = "subgroup metrics are descriptive and do not independently pass the gate"

[gate2_metrics.units]
auroc_unit = "fraction_0_1"
auprc_unit = "fraction_0_1"
delta_auroc_unit = "absolute_fraction_0_1"
delta_auprc_unit = "absolute_fraction_0_1"
percent_0_100_forbidden_for_auroc_auprc = true
percentage_points_wording_forbidden_for_a_fraction_0_1_value = true
human_readable_equivalents = "provenance AUROC minimum 0.65 = 65%; AUROC/AUPRC improvement minimum 0.02 absolute = 2.0 percentage points -- 0.02 on the fraction_0_1 scale must never itself be written as \"0.02 pp\""

# ---------------------------------------------------------------------
# Image-level paired bootstrap (Section 16)
# ---------------------------------------------------------------------

[bootstrap]
replicates = 10000
resampling_unit = "image"
sampling = "500 image IDs with replacement"
paired_comparison = "identical sampled images for cheap and provenance models"
interval = "percentile_95_percent"
quantiles = [0.025, 0.975]
numpy_quantile_method = "linear"
seed_namespace = "talk2dino-dfp-phase1b-bootstrap-seed-v1"
seed_derivation = "seed = int.from_bytes(SHA256(seed_namespace)[:8], byteorder='big') % (2**32)"
pixels_bootstrapped_independently_forbidden = true
interval_endpoint_unit = "absolute_fraction_0_1"
paired_difference_unit = "absolute_fraction_0_1"

[bootstrap.per_replicate_rules]
include_all_eligible_pixels_of_sampled_images = true
duplicate_pixels_when_image_sampled_multiple_times = true
compute_auroc_auprc_only_when_both_classes_present = true
record_number_of_valid_replicates = true
minimum_valid_replicate_fraction = 0.95
fail_below_minimum_valid_replicate_fraction = true

# ---------------------------------------------------------------------
# Gate-2 stop/proceed criteria (Section 17)
# ---------------------------------------------------------------------

[gate2_criteria]
outcomes = ["PROCEED_TO_GATE_3", "STOP_DFP", "INCONCLUSIVE"]
thresholds_frozen_before_any_phase1b_result = true
threshold_loosening_after_seeing_results_forbidden = true

[gate2_criteria.mandatory_conditions]
c1_conservation_and_artifact_validation_pass = true
c2_single_feature_auroc_lower_bound_threshold = 0.5
c2_single_feature_candidates = ["neg_phi", "neg_k_star", "top1_positive_share"]
c3_provenance_auroc_minimum = 0.65
c4_auroc_improvement_minimum_absolute_fraction = 0.02
c5_auroc_improvement_bootstrap_lower_bound_strictly_positive = true
c6_auprc_improvement_minimum_absolute_fraction = 0.02
c7_auprc_improvement_bootstrap_lower_bound_strictly_positive = true
c8_minimum_valid_bootstrap_replicate_fraction = 0.95
c9_exact_computation_within_resource_ceiling_without_approximation = true
c10_boundary_iou_sufficient_statistics_for_every_frozen_baseline_variant = true
c11_pamr_statistics_present_and_valid_for_both_pamr_variants = true

[gate2_criteria.stop_conditions]
provenance_auroc_below = 0.60
auroc_improvement_upper_bound_at_or_below_zero = true
conservation_fails_after_confirmed_implementation_correctness = true
