format_version = "talk2dino-dfp-phase1b-protocol-identity-v1"

# DFP Phase 1B scientific protocol pre-registration. This is a
# diagnostic-protocol identity, exactly like e13-dfp-phase1a-protocol:
# it never loads CUDA, a model, or a dataset, and it computes no
# scientific quantity. It freezes the Phase 1B hypothesis, the GT-free
# component-evidence provenance decomposition, the GT-isolation
# architecture, fold assignment, the diagnostic feature-evaluation
# procedure, the image-level bootstrap, and the Gate-2 stop/proceed
# criteria -- BEFORE any provenance computation, masked propagation, or
# diagnostic model fitting occurs.
#
# Dependency direction (acyclic, by design):
#   e13-dfp-phase1a-protocol (+ e12-matched-k11-k12-t320, e3-paired-
#   soft-routing, the frozen 500-image subset manifest)
#     -> Gate-1 result (gate1_analysis.json / analysis_provenance.json)
#        + e14-dfp-phase1b-boundary-iou
#     -> THIS identity (e15-dfp-phase1b-protocol)
#     -> e15-dfp-phase1b-artifacts (binds THIS identity's own SHA-256;
#        this identity never binds the artifact identity's hash, which
#        would create a cycle).
#
# This identity does not modify, cascade a new hash through, or
# retroactively reinterpret e13-dfp-phase1a-protocol,
# e13-dfp-phase1a-artifacts, e14-dfp-phase1b-boundary-iou, or the
# frozen subset manifest -- all four are bound below by exact path and
# SHA-256 and re-verified against the live files every time this
# identity loads.
#
# RGB/local-boundary baseline: see [rgb_local_boundary_baseline] below.
# The historical Talk2DINO PAMR operator is now bound directly in this
# identity (e15 was still uncommitted when this repair was made, so the
# binding is applied in place rather than via a successor identity).
# The bound configuration is the SOLE PAMR instantiation site anywhere
# in this repository (src/open_vocabulary_segmentation/models/dinotext/
# dinotext.py::apply_pamr, hardcoding num_iter=10, dilations=[1, 2, 4,
# 8, 12, 24] -- never overridden by any YAML anywhere in this codebase),
# activated for COCO-Stuff via the officially-documented reproduction
# command in this repository's own top-level README.md ("# COCOStuff"
# section: --eval_cfg .../stuff/dinotext_stuff_vitb_mlp_infonce.yml
# --eval_base .../stuff/eval_stuff_pamr.yml). T0_PAMR/T320_PAMR apply
# this SAME bound operator to DFP's own already-computed T0/T320 score
# tensors (never a separate model re-evaluation) -- see
# [pamr_variants] below.
#
# AUROC/AUPRC units: every AUROC/AUPRC threshold and improvement value
# in [gate2_criteria] is on the raw fraction_0_1 metric scale (never
# percent_0_100), and every improvement/delta is an absolute difference
# on that same 0-1 scale (never itself expressed in percentage points).
# 0.02 on this scale is the human-readable equivalent of "+2.0
# percentage points" -- see [gate2_metrics.units] below. This repair
# renames the two threshold fields that previously carried a misleading
# "_pp" suffix while holding a 0-1-scale value.

[identity]
name = "e15-dfp-phase1b-protocol"
schema_name = "talk2dino-dfp-phase1b-protocol-identity-v1"
schema_version = 1
description = "Freezes the DFP Phase 1B scientific protocol: the component-evidence provenance hypothesis, GT-free feature decomposition, GT-isolation architecture (Stage A / Stage B), deterministic fold assignment, diagnostic feature-evaluation procedure (cheap-control vs provenance-augmented logistic diagnostic model), image-level paired bootstrap, and the Gate-2 PROCEED_TO_GATE_3/STOP_DFP/INCONCLUSIVE criteria. Implements no evaluator, no inference, no masked propagation, and computes no provenance value."
storage_representation_only = true
diagnostic_not_deployable_selector = true

[dependency_graph]
direction = "phase1a_protocol_and_gate1_and_boundary_iou -> phase1b_protocol -> phase1b_artifacts"
acyclic_required = true
this_identity_binds_artifact_identity_hash = false
artifact_identity_binds_this_identity_hash = true
rationale = "the artifact identity is generated after this protocol and must bind it for provenance; this protocol is frozen before the artifact identity exists and therefore cannot bind a hash that does not yet exist without creating a circular dependency"

[authority_bindings.phase1a_protocol]
relative_path = "evaluation_identities/e13_dfp_phase1a_protocol.toml"
sha256 = "227549b03ec6b1262c465a18b7fc67529fa5a0b5deef419c33ec79a80feb2173"

[authority_bindings.phase1a_artifacts]
relative_path = "evaluation_identities/e13_dfp_phase1a_artifacts.toml"
sha256 = "9b8827c77fc81a7e676dece6284f69c630d61eadf916c9c2adf72f0bb30584ce"

[authority_bindings.coco_stuff_500_subset_manifest]
relative_path = "evaluation_subsets/dfp_phase1a_coco_stuff_500.json"
sha256 = "75373aca8ef6d434ae02a7e90b6dcc9ba13fd8a31d1e87d858a2f542c19ef482"

[authority_bindings.boundary_iou_successor_identity]
relative_path = "evaluation_identities/e14_dfp_phase1b_boundary_iou.toml"
sha256 = "fe4c33d4376d40fcd53f7751405ffc60e5856ce9919f548df3c039809ebc0ab8"

[authority_bindings.gate1_analysis]
relative_path = "gate1_analysis.json"
path_kind = "logical_artifact_name_not_a_private_filesystem_path"
sha256 = "bd0cb034d6368e78ca8db19d0d86d3b785d0527fe4aef4c77b841edeb34769dd"

[authority_bindings.gate1_analysis_provenance]
relative_path = "analysis_provenance.json"
path_kind = "logical_artifact_name_not_a_private_filesystem_path"
sha256 = "6e67c7cfa3ba4ab7f24e70f117823a91ef0e8ec435784d479e0117ead48d51a3"

[authority_bindings.k12_graph_recurrence]
relative_path = "evaluation_identities/e12_matched_k11_k12_t320.toml"
sha256 = "1f4eea731ae7b803a5e2d572d0a1f59b3275ec240d36061d03540706e3bbc259"

