resolved_parameter_digest_formula = "SHA256(json.dumps(resolved_params, sort_keys=True, separators=(',', ':')).encode('utf-8')), where resolved_params = {operator:'PAMR', num_iter:iterations, dilations:dilations, kernel:kernel, affinity:sigma_or_affinity_parameters, insertion_point:pipeline_insertion_point, image_input:input_image_definition, image_normalization:image_normalization, resize_interpolation:resize_and_interpolation, scope:window_or_global_scope, argmax_order:argmax_order, determinism:determinism, training_free:training_free} -- every value taken verbatim from this SAME [rgb_local_boundary_baseline] table, so the digest is mechanically self-verifying against this file (see src.dfp_phase1b_identity.compute_resolved_pamr_parameter_digest)"
