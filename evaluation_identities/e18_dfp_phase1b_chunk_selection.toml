# ---------------------------------------------------------------------
# Prohibited (mirrors e13/e15/e16/e17's own [prohibited] convention).
# ---------------------------------------------------------------------

[prohibited]
list = [
    "modifying_e13_e14_e15_e16_or_e17_identities",
    "modifying_the_completed_benchmark_output_or_any_raw_trial",
    "freezing_a_numeric_conservation_tolerance",
    "full_phase1b_execution",
    "five_thousand_image_evaluation_or_sharding_or_merging",
    "gpu_use_in_this_task",
    "slurm_submission_in_this_task",
    "real_benchmark_execution_in_this_task",
    "trusting_the_recorded_selected_chunk_size_without_recomputation",
    "inventing_a_safety_threshold_not_present_in_e17",
    "declaring_chunk_16_scientifically_superior",
    "claiming_statistical_significance_from_two_repeats",
]

[future_step_bindings]
description = "Fields explicitly deferred to a later task, never guessed or invented here."
next_step_items = [
    "install the durable phase1b_chunk_selection.json artifact under its committed /scratch destination, after independent re-verification and commit of this identity",
    "wire the selected operational component_chunk_size into any later full Phase 1B production run configuration (never this identity)",
    "separately, and only much later, freeze a numeric conservation tolerance (never this identity, never derived from this benchmark)",
    "separately, and only much later, authorize full Phase 1B execution or the 5,000-image evaluation (never this identity)",
]
