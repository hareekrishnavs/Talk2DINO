format_version = "Talk2Dino-DFP-Phase1B-Chunk-Selection-Identity-V1"

# ---------------------------------------------------------------------
# E18: an ADDITIVE SUCCESSOR to E17. E17 froze a purely operational
# six-trial measurement protocol and explicitly selected no chunk size
# (`e17...[operational_scope].winner_selection_authorized_by_this_identity
# = false`). This identity is the separate, later, narrowly-scoped step
# E17's own [future_step_bindings] deferred: it binds the completed,
# independently-verified E17 benchmark output (the real
# `merged_result.json` from SLURM job 21331697, produced at the
# committed Task 3 HEAD), freezes a deterministic post-hoc selection
# rule, and records the resulting OPERATIONAL chunk-size choice.
#
# This identity does not modify E17, E16, E15, E14, or E13 in any way.
# It does not freeze a numeric conservation tolerance. It does not
# authorize full Phase 1B execution or the 5,000-image evaluation. See
# [authorization_boundary] below -- those booleans are the ground
# truth for this identity's authority boundary.
#
# The selection rule below was frozen as a DETERMINISTIC FUNCTION of
# the eligibility/statistic/tie-break definitions BEFORE being applied
# by `src/dfp_phase1b_chunk_selection.py` to the real six verified
# trials; the winner recorded in [selection_result] is the frozen
# rule's OUTPUT, not an independently chosen input. The selector module
# recomputes this from the raw trials on every load and refuses to
# trust the recorded winner without that recomputation.
# ---------------------------------------------------------------------

[identity]
name = "e18-dfp-phase1b-chunk-selection"
schema_name = "talk2dino-dfp-phase1b-chunk-selection-identity-v1"
schema_version = 1
purpose = "Freezes a deterministic, post-hoc-applied operational selection rule over the completed and independently-verified E17 chunk-size benchmark, and records the resulting operational component_chunk_size choice for production use. Selects no scientific metric, defines no conservation tolerance, and authorizes no full Phase 1B or 5,000-image execution."
creation_status = "narrow_additive_successor_authority -- not yet installed against a committed durable /scratch selection artifact; that installation happens only after independent re-verification and commit"
successor_of = "e17-dfp-phase1b-chunk-benchmark"
successor_relation = "additive_only: binds but never edits, reinterprets, or re-hashes any E13-E17 file; consumes E17's completed benchmark output as a read-only input"
required_ancestor_commit = "e4caef84b98d048f160dc935282679ed20efcc99"
required_ancestor_relation = "required_ancestor_commit must be an ancestor of (or equal to) the executing repository_commit -- verified via 'git merge-base --is-ancestor <required_ancestor_commit> <repository_commit>', exactly like E17's own convention. This is the exact Task 3 commit that produced the bound merged_result.json; the benchmark code hashes below are only valid for a worktree at or descended from this commit."
working_branch = "dfp-phase1a-diagnostics"

[operational_scope]
purpose = "operational_chunk_size_selection"
scientific_metric = false
preregistered_hypothesis_test = false
statistical_significance_claimed = false
post_hoc_engineering_selection = true
selection_rule_frozen_before_being_applied_to_trials = true
conservation_tolerance_defined = false
full_phase1b_execution_authorized = false
five_thousand_image_evaluation_authorized = false
gpu_execution_performed_by_this_step = false
operational_chunk_size_selected = true

# ---------------------------------------------------------------------
# Dependency bindings: exact relative path + SHA-256 for every file
# whose bytes this selection mathematically depends on. Log text is
# deliberately NOT bound here -- the verified raw trials and merged
# result are the sole numerical authority.
# ---------------------------------------------------------------------

[dependency_bindings.e17_identity]
relative_path = "evaluation_identities/e17_dfp_phase1b_chunk_benchmark.toml"
sha256 = "cf022800d64b70f08f6f1421c82a278e50ce378c3fe3df0e59384e15814a1876"
untouched_by_this_identity = true

[dependency_bindings.benchmark_manifest]
relative_path = "evaluation_subsets/dfp_phase1b_chunk_benchmark_24.json"
sha256 = "be2c77466a2c1d64f0f39f17f4d073ce1de92dc526a59e47ae8c3dabb8c644ab"
untouched_by_this_identity = true

[dependency_bindings.benchmark_runner_module]
relative_path = "src/dfp_phase1b_chunk_benchmark.py"
sha256 = "d0822e1d0019f717eeacf6ec82eab48caab6c95036a21ca745bd3640fae35c07"
untouched_by_this_identity = true

[dependency_bindings.benchmark_cli_module]
relative_path = "diagnostics/run_dfp_phase1b_chunk_benchmark.py"
sha256 = "ae54c1c473ac55614e6f767e24c80317422cff7a2493a2562eafc8b7c32e8b1e"
untouched_by_this_identity = true

[dependency_bindings.merged_result]
relative_path = "merged_result.json"
relative_path_is_symbolic_not_repository_relative = true
relative_path_note = "the real completed Task 3 merged result lives under scratch benchmark output, never inside this repository -- see [source_benchmark_run] below for its actual absolute location, bound here by content hash only"
sha256 = "8acbcd6c71ba537c898c8472950a6391d175186d6c0f8e88a772844bb8141868"
untouched_by_this_identity = true

[dependency_bindings.selector_module]
relative_path = "src/dfp_phase1b_chunk_selection.py"
sha256 = "7311e4e458903693a9644f8b19aab6df506ea4854875ea5a551c2216f3c089eb"
untouched_by_this_identity = "N/A -- this IS this identity's own selector; hashed here so the selection artifact can bind the exact executed selection code"
self_reference_note = "This TOML records this file's hash; this file does not record this TOML's own hash anywhere -- no circularity."

[dependency_bindings.analysis_cli_module]
relative_path = "diagnostics/analyze_dfp_phase1b_chunk_benchmark.py"
sha256 = "8da9f2d985847ee0359d5f5d6468737ff84e49fe022abde897425994f301e1d2"
untouched_by_this_identity = "N/A -- this is the selection's own CLI, hashed so the selection artifact can bind the exact executed entry point"

# ---------------------------------------------------------------------
# Source benchmark run: identifies exactly which real, completed,
# independently-verified Task 3 execution this identity consumes.
# ---------------------------------------------------------------------

[source_benchmark_run]
slurm_job_id = "21331697"
repository_commit = "e4caef84b98d048f160dc935282679ed20efcc99"
device_type = "cuda"
gpu_model_name = "NVIDIA H100 80GB HBM3"
trial_count = 6
scheduler_state = "COMPLETED"
scheduler_exit_code = "0:0"

# ---------------------------------------------------------------------
# Selection contract: the deterministic rule, frozen before being
# applied. No value in this table may be chosen from an observed
# timing or memory value.
# ---------------------------------------------------------------------

[selection_contract]
candidate_chunk_sizes = [16, 32, 64]
required_repeats_per_candidate = 2
required_measured_windows_per_trial = 24
elapsed_time_field = "timing.primary_elapsed_ns"
elapsed_time_field_note = "exactly Task 3's own frozen primary-timing field (see e17...[measurement.primary_timing]) -- excludes warm-up, preflight, merge, and verification time; excludes model/dataset construction and checkpoint loading, which are excluded from primary_elapsed_ns by E17's own timing-boundary definition"
primary_statistic = "arithmetic_mean_of_the_two_complete_measured_trial_primary_elapsed_ns_values"
tie_definition = "exact equality of the reconstructed arithmetic-mean statistic in integer/half-integer nanoseconds -- no epsilon, no rounding before comparison"
tie_break_sequence = [
    "lower_max_host_process_lifetime_peak_rss_bytes",
    "lower_max_gpu_peak_reserved_bytes",
    "smaller_numerical_chunk_size",
]

[selection_contract.eligibility_conditions]
description = "A candidate chunk size is safe/eligible only if BOTH of its trials satisfy every one of these conditions."
list = [
    "trial.complete is true and trial.final is true",
    "trial passes src.dfp_phase1b_chunk_benchmark.verify_trial_document (the committed Task 3 verifier)",
    "trial (trial_index, repeat_index, chunk_size) is a member of the frozen E17 trial schedule",
    "len(trial.window_identity) == required_measured_windows_per_trial (24)",
    "trial.timing.primary_elapsed_ns is a finite non-negative integer",
    "every trial.memory.* field is a finite non-negative integer",
    "trial.abort_status.aborted is false",
    "trial.device_record.gpu_model_name equals e17...[benchmark_design].required_gpu_model",
    "trial.device_record.device_type equals e17...[benchmark_design].required_device_type",
    "trial.software_record is identical across all six trials (checked once, benchmark-wide)",
    "trial.scientific_output_digests.collection_digest equals the common digest shared by all six trials",
    "trial.memory.host_process_lifetime_peak_rss_bytes does not exceed the E17 safety_contract host threshold",
    "trial.memory.gpu_peak_reserved_bytes does not exceed the E17 safety_contract GPU threshold",
]

# ---------------------------------------------------------------------
# Safety contract: references E17's own [measurement.safety_guard]
# values relationally -- invents no new threshold.
# ---------------------------------------------------------------------

[safety_contract]
description = "Mirrors e17...[measurement.safety_guard] exactly; validated relationally against the live E17 TOML on every load, never merely hand-copied."
host_rss_abort_fraction_of_allocation = 0.90
gpu_reserved_abort_fraction_of_allocation = 0.90
allocated_host_memory_gib = 80
allocated_gpu_memory_gib = 80
comparison_operator = "strictly_greater_than"
boundary_semantics = "usage > threshold_fraction * allocation is unsafe; usage == threshold_fraction * allocation is safe (matches E17's own boundary_semantics exactly)"
host_threshold_bytes = 77309411328
gpu_threshold_bytes = 77309411328

# ---------------------------------------------------------------------
# Selection result: the frozen rule's OUTPUT over the real, verified
# six-trial run. Every numeric field here is independently
# recomputed and compared by the selector module on every load --
# never trusted as an input.
# ---------------------------------------------------------------------

[selection_result]
scientific_output_digest = "0ab0dcf6db4fca0774825b70767d64de5a7d416576071e82faaa1133fabf7bbf"
all_candidates_scientifically_equal = true
