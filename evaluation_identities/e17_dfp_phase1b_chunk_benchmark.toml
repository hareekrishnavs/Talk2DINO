# ---------------------------------------------------------------------
# Source artifact requirements: the exact completed E16 artifact this
# benchmark's providers must reproduce bit-for-bit for scientific
# output, regardless of chunk size.
# ---------------------------------------------------------------------

[source_artifact]
required_complete = true
required_final = true
required_run_mode = "coco_stuff_500"
required_expected_selected_window_count = 200
required_completed_selected_window_count = 200
device_type_at_calibration_time = "cuda"
gpu_model_at_calibration_time = "NVIDIA H100 80GB HBM3"
actual_calibration_chunk_size = 16

# ---------------------------------------------------------------------
# Frozen benchmark design. No value here may be chosen from an
# observed benchmark result, component count, or timing.
# ---------------------------------------------------------------------

[benchmark_design]
chunk_sizes = [16, 32, 64]
benchmark_window_count = 24
measured_repeats = 2
warmup_window_count_per_trial = 1
required_device_type = "cuda"
required_gpu_model = "NVIDIA H100 80GB HBM3"
same_gpu_allocation_required = true
same_model_checkpoint_required = true
same_dataset_required = true
same_window_manifest_required = true
same_precision_required = true
fresh_process_per_trial_required = true
one_visible_cuda_device_required = true
repository_worktree_clean_required = true
trial_count = 6

[benchmark_design.trial_schedule]
description = "Six fresh-process trials, one committed SLURM allocation, run strictly sequentially in this exact order. Counterbalances first/last-execution ordering effects (warm hardware/cache/clock-boost state) across the two measured repeats."
repeat_0 = [16, 32, 64]
repeat_1 = [64, 32, 16]
ordered_trial_list = [
    { trial_index = 0, repeat = 0, chunk_size = 16 },
    { trial_index = 1, repeat = 0, chunk_size = 32 },
    { trial_index = 2, repeat = 0, chunk_size = 64 },
    { trial_index = 3, repeat = 1, chunk_size = 64 },
    { trial_index = 4, repeat = 1, chunk_size = 32 },
    { trial_index = 5, repeat = 1, chunk_size = 16 },
]

# ---------------------------------------------------------------------
# Benchmark-window selection algorithm: performance-neutral, frozen
# BEFORE any benchmark timing or component count is ever observed.
# ---------------------------------------------------------------------

[selection_algorithm]
source = "the verified E16 calibration artifact's own 200 selected_window_records, exactly as installed and independently re-verified -- never a fresh selection, never re-derived from the candidate universe"
node_count_constant = 1024
node_count_derivation = "(crop_height // patch_size) * (crop_width // patch_size) = (448 // 14) * (448 // 14) -- frozen E13 protocol crop/patch-size values, identical for every window in this run"
query_class_count_derivation = "rho_0.sample_count // node_count_constant, cross-checked against rho_320.sample_count // node_count_constant, for every one of the 200 selected rows -- independently reconstructable from the artifact alone, exactly as independently verified in the Task 2 v2 workload report"
sort_key = "(query_class_count ascending, selection_rank ascending)"
slot_count = 24
slot_position_formula = "floor(((2*i + 1) * 200) / (2 * 24)) for benchmark slot i in 0..23, applied to the zero-based position within the sorted 200-row list"
slot_positions = [4, 12, 20, 29, 37, 45, 54, 62, 70, 79, 87, 95, 104, 112, 120, 129, 137, 145, 154, 162, 170, 179, 187, 195]
positions_and_records_must_be_unique = true
warmup_selection_rule = "the smallest original selection_rank not present among the 24 measured records"
warmup_never_contributes_to_timing_or_scientific_digests = true
selection_independent_of = [
    "component_count", "runtime", "wall_clock_time", "memory", "residual_magnitude",
    "filesystem_enumeration_order", "dictionary_insertion_order", "pythonhashseed",
    "any_quantity_observed_from_a_gpu_benchmark",
]

# ---------------------------------------------------------------------
# Measurement boundaries. No numeric threshold, tolerance, or winner
# criterion appears anywhere in this section.
# ---------------------------------------------------------------------

[measurement.primary_timing]
clock_source = "time.perf_counter_ns"
unit = "integer nanoseconds"
starts_after = [
    "process_creation", "imports", "identity_verification",
    "dataset_and_model_construction", "checkpoint_loading", "warmup_window", "initial_cuda_synchronize",
]
stops_after = ["all_24_measured_records_complete", "final_cuda_synchronize"]
excludes = ["startup", "model_loading", "warmup", "json_serialization", "final_artifact_installation"]

[measurement.secondary_timing]
description = "Synchronized timing specifically around the component-chunk/masked-forward workload, recorded only where an existing safe call boundary permits it without duplicating or altering any scientific operation. If unavailable, recorded as unavailable and the primary timing is retained unmodified."
availability_depends_on_safe_instrumentation_seam = true

[measurement.per_record_timing]
description = "Synchronized per-canonical-image-group timing only, recorded only when the production call boundary (one process_selected_image call per image) is exact. Never divided among that image's individual windows and presented as a measured per-window time."
division_of_group_time_into_per_window_time_forbidden = true

[measurement.gpu_memory]
reset_call = "torch.cuda.reset_peak_memory_stats()"
reset_timing = "after warm-up completes and CUDA is synchronized, before the 24 measured records begin"
recorded_fields = [
    "gpu_baseline_allocated_bytes", "gpu_baseline_reserved_bytes",
    "gpu_peak_allocated_bytes", "gpu_peak_reserved_bytes",
    "gpu_end_allocated_bytes", "gpu_end_reserved_bytes",
]
synchronize_before_reading_final_values = true
measurement_scope = "measured_24_window_subset_only_after_post_warmup_reset"

[measurement.host_memory]
recorded_fields = [
    "host_process_lifetime_peak_rss_bytes", "host_process_lifetime_vmhwm_bytes", "host_current_rss_bytes",
]
sampled_current_rss_must_never_be_labeled_peak = true
measurement_scope = "process_lifetime_includes_imports_model_construction_checkpoint_loading_and_warmup"
scope_note = "ru_maxrss and VmHWM cannot be reset mid-process on Linux, so they unavoidably cover the ENTIRE trial process -- NOT the measured-24-window subset alone. This is structurally different from the GPU peak fields above, which ARE reset after warm-up and ARE measured-subset-scoped. Field names make this explicit; no field may claim host memory is measured-subset-scoped."

[measurement.safety_guard]
description = "Operational abort guard only -- not a scientific tolerance. Checked between measured image groups within a trial. These four values are the SOLE source of truth for the guard: no independent Python default may exist anywhere in the runner/CLI."
host_rss_abort_fraction_of_allocation = 0.90
gpu_reserved_abort_fraction_of_allocation = 0.90
allocated_host_memory_gib = 80
allocated_gpu_memory_gib = 80
comparison_operator = "strictly_greater_than"
boundary_semantics = "usage > threshold_fraction * allocation triggers abort; usage == threshold_fraction * allocation continues"
on_trigger = "fail cleanly, record the reason, leave the trial file incomplete -- never mark an aborted trial complete/final"

# ---------------------------------------------------------------------
# Scientific-output invariance: the one hard pass/fail gate in this
# identity, and the only one with zero tolerance.
# ---------------------------------------------------------------------

[scientific_invariance]
digest_algorithm = "sha256"
per_window_included_fields = [
    "rho_M", "rho_0", "rho_320", "rho_g",
    "canonical_candidate_index", "canonical_image_id", "canonical_window_ordinal", "selection_rank",
]
per_window_excluded_fields = [
    "runtime", "memory", "device_uuid", "timestamp", "chunk_size", "trial_index", "repeat_index", "filesystem_path",
]
digest_over_records_formula = "identical convention to E16's own selection_algorithm.digests.digest_over_records_formula -- sha256 over length-prefixed canonical-JSON-encoded per-window records, in frozen manifest slot order (0..23)"
require_repeat_0_equals_repeat_1_per_chunk_size = true
require_all_three_chunk_sizes_bitwise_digest_identical = true
numeric_tolerance_permitted = false
rounding_before_comparison_permitted = false
mismatch_outcome = "SCIENTIFIC_OUTPUT_MISMATCH"
mismatch_blocks_task4 = true
mismatch_cannot_be_dismissed_by_an_invented_tolerance = true
descriptive_max_absolute_difference_recorded_when_arrays_available = true
descriptive_max_absolute_difference_is_evidence_only_never_a_threshold = true

# ---------------------------------------------------------------------
# Benchmark-code provenance: binds the ACTUAL executed benchmark code
# and repository state into every trial, not merely the E16 scientific
# dependency chain.
# ---------------------------------------------------------------------

[code_provenance]
required_fields_in_every_trial = [
    "authority_sha256", "manifest_sha256", "identity_loader_sha256", "runner_sha256", "cli_sha256", "launcher_sha256",
    "repository_commit", "required_ancestor_commit", "repository_worktree_clean",
]
repository_commit_must_equal_current_head_at_execution_time = true
required_ancestor_commit_must_be_ancestor_of_repository_commit = true
required_ancestor_commit_equality_to_repository_commit_not_required = true
repository_worktree_clean_includes_untracked_files = true
dirty_worktree_rejected_before_torch_import = true
verifier_current_head_need_not_equal_historical_trial_commit = true
all_six_trials_must_agree_on_every_code_provenance_field = true
merged_artifact_must_preserve_and_reverify_code_provenance = true

# ---------------------------------------------------------------------
# Result schema summary (full closed schemas live in the Python
# validator; this table freezes only the policy constraints).
# ---------------------------------------------------------------------

[result_schema.per_trial]
no_winner_or_recommendation_field = true
required_top_level_fields = [
    "schema_name", "schema_version", "authority_sha256", "manifest_sha256",
    "trial_index", "repeat_index", "chunk_size", "complete", "final",
    "device_record", "software_record", "window_identity", "timing", "workload_records",
    "memory", "scientific_output_digests", "abort_status", "code_provenance",
]

[result_schema.merged]
requires_all_six_frozen_trials_present_exactly_once = true
rejects_duplicate_or_missing_trials = true
verifies_hashes_and_closed_schemas = true
verifies_identical_hardware_software_model_input_bindings_across_all_six_trials = true
verifies_identical_code_provenance_across_all_six_trials = true
verifies_scientific_output_digest_equality_across_all_six_trials = true
preserves_all_raw_measurements = true
computes_only_descriptive_summaries_per_chunk_size = true
no_winner_selection = true
no_tolerance_binding = true
installed_atomically = true
allowed_descriptive_summary_fields = [
    "primary_elapsed_ns_per_repeat", "median_of_two_primary_times_ns", "min_ns", "max_ns",
    "gpu_peak_allocated_bytes", "gpu_peak_reserved_bytes", "host_process_lifetime_peak_rss_bytes",
    "component_chunk_query_totals", "throughput_windows_per_second_over_fixed_24_window_set",
]
extrapolation_to_5000_images_forbidden = true

# ---------------------------------------------------------------------
# Prohibited (mirrors e13/e15/e16's own [prohibited] convention).
# ---------------------------------------------------------------------

[prohibited]
list = [
    "real_benchmark_execution_in_this_task",
    "gpu_use_in_this_task",
    "slurm_submission_in_this_task",
    "modifying_e13_e14_e15_or_e16_identities",
    "modifying_the_calibration_artifact_or_workload_bundle",
    "modifying_graph_recurrence_stitching_pullback_or_masked_forward_mathematics",
    "modifying_the_existing_calibration_runner_to_expose_benchmark_metrics",
    "selecting_or_recommending_a_chunk_size_in_this_identity",
    "freezing_a_numeric_conservation_tolerance",
    "full_phase1b_execution",
    "five_thousand_image_evaluation_or_sharding_or_merging",
    "selecting_the_24_window_subset_using_component_count_runtime_memory_or_residual_magnitude",
    "dividing_an_image_group_timing_into_a_fabricated_per_window_timing",
    "declaring_scientific_equivalence_via_a_numeric_tolerance",
    "hardcoding_memory_guard_defaults_independent_of_this_identity",
    "labeling_process_lifetime_host_memory_as_measured_subset_scoped",
]

[future_step_bindings]
description = "Fields explicitly deferred to a later task, never guessed or invented here."
next_step_items = [
    "submit the frozen six-trial SLURM allocation on the required H100 hardware",
    "independently verify the resulting merged benchmark artifact",
    "only after that independent verification passes, a separate later task may consider (never this identity) how any operational finding informs a production chunk-size choice -- never as a scientific or tolerance decision",
]
