# ---------------------------------------------------------------------
# E17: freezes a purely OPERATIONAL performance-comparison protocol for
# the already-committed `component_chunk_size` parameter of the E16
# conservation-calibration runner (`src.dfp_phase1b_calibration_run.
# process_selected_image`). E16 authorizes RECORDING this value in the
# artifact but deliberately does not freeze it to one number -- this
# identity exists only to measure, not to select, a chunk size.
#
# This identity is a NEW LEAF authority. It binds, but does not modify
# or reinterpret, the completed and independently verified E16
# conservation-calibration artifact, the E16 identity itself, the
# independently-verified Task 2 workload-report bundle used only to
# derive query_class_count for a performance-neutral window selection,
# the frozen COCO-Stuff-500 subset manifest, and every scientific
# implementation module the calibration runner already reuses
# (graph/recurrence, masked-forward, stitching, final-rescale). No
# hash anywhere in this file cascades into E13, E14, E15, or E16 --
# this identity is a pure downstream consumer, and it changes NO
# scientific formula, tolerance, or artifact schema.
#
# This identity authorizes OPERATIONAL PERFORMANCE MEASUREMENT ONLY.
# See [operational_scope] below.
#
# EVERY non-hash scalar/list leaf in this file is either exact-value
# pinned by `src/dfp_phase1b_chunk_benchmark_identity.py`'s own
# mechanically-generated `CANONICAL_VALUES` table (built by flattening
# this exact committed file -- never hand-retyped), or is a hash/path
# field validated relationally against live file bytes. No leaf here
# is merely type-checked.
# ---------------------------------------------------------------------

[identity]
name = "e17-dfp-phase1b-chunk-benchmark"
schema_name = "talk2dino-dfp-phase1b-chunk-benchmark-identity-v1"
schema_version = 1
purpose = "Freezes a preregistered, performance-neutral 24-window benchmark subset, a six-trial counterbalanced chunk-size (16/32/64) execution schedule, exact timing/memory measurement boundaries, exact benchmark-code provenance binding, and a closed per-trial/merged result schema for comparing the wall-clock/memory cost of the already-committed component_chunk_size parameter on identical real hardware, model, dataset, and input. Selects no chunk size, freezes no tolerance, and authorizes no full Phase 1B or 5,000-image execution."
required_ancestor_commit = "df0094da5367b3ef5b7982099c540efe8d00b418"
required_ancestor_relation = "required_ancestor_commit must be an ancestor of (or equal to) the executing repository_commit -- NOT required to be exactly equal. The final benchmark implementation commit is legitimately a descendant of this frozen prerequisite. Verified via 'git merge-base --is-ancestor <required_ancestor_commit> <repository_commit>'."
working_branch = "dfp-phase1a-diagnostics"

[operational_scope]
purpose = "operational_chunk_size_performance_comparison"
scientific_metric = false
full_phase1b_execution_authorized = false
five_thousand_image_evaluation_authorized = false
tolerance_selection_authorized = false
chunk_size_recommendation_authorized_by_this_identity = false
winner_selection_authorized_by_this_identity = false

