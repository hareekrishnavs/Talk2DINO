# ---------------------------------------------------------------------
# DFP Phase 1B -- additive successor authority.
#
# Freezes the SCIENTIFIC KERNEL that computes the eight E15 Stage-A
# component-evidence provenance features
# (n_positive_components, positive_evidence_sum, negative_evidence_sum,
# top_positive_component_id, top_positive_evidence, top1_positive_share,
# k_star, phi) from the already-frozen, already-committed signed
# component-evidence matrix G[x,r] produced by the exact masked-forward
# provenance core. This identity implements no execution driver, no
# runner, no profiler, no checkpoint/result writer, no CLI execution
# command, and no SLURM launcher; it runs no real inference, accesses
# no COCO-Stuff images or annotations, initializes no CUDA context
# merely on load, and submits no job.
#
# It never redefines a scientific quantity already frozen by
# e15-dfp-phase1b-protocol / e15-dfp-phase1b-artifacts / the exact
# masked-forward core; it binds those schemas by hash, reuses their
# formulas verbatim (never re-derives, re-selects, or re-interprets
# them), and adds only the numerical kernel that was previously frozen
# as TEXT-ONLY authority with no corresponding implementation.
# ---------------------------------------------------------------------

[identity]
name = "e21-dfp-phase1b-provenance-features"
schema_name = "talk2dino-dfp-phase1b-provenance-features-identity-v1"
schema_version = 1
status = "frozen_additive_successor_authority"
purpose = "Freezes the numerical kernel that computes the eight E15 Stage-A component-evidence provenance features (n_positive_components, positive_evidence_sum, negative_evidence_sum, top_positive_component_id, top_positive_evidence, top1_positive_share, k_star, phi) from the signed component-evidence matrix G[x,r], exactly per e15-dfp-phase1b-protocol's [provenance_features.component_evidence] formulas. Repairs the gap in which these eight fields were frozen only as TEXT authority with no implementation, blocking the profiled 500-image diagnostic runner. Implements no execution driver, runner, profiler, checkpoint/result writer, CLI execution command, or SLURM launcher. Authorizes no inference, no GPU job, and no 500-image or 5000-image execution."
successor_of = "e20-dfp-phase1b-diagnostic-execution"
successor_relation = "additive_only: binds but never edits, reinterprets, or re-hashes any E13-E20 file, the verified calibration artifact, the installed Task 4 selection artifact, or the exact masked-forward core; adds exactly one new scientific-kernel module implementing formulas already frozen verbatim by e15-dfp-phase1b-protocol, plus the loader/CLI/test scaffolding a new authority requires under this repository's convention"
does_not_modify_e13_through_e20 = true
required_ancestor_commit = "38df8087abd3e0fbc163523c471c2cdd01e7d96c"
required_ancestor_relation = "required_ancestor_commit must be an ancestor of (or equal to) the executing repository_commit -- verified via 'git merge-base --is-ancestor <required_ancestor_commit> <repository_commit>', exactly like E17/E18/E19/E20's own convention. Every repository-file SHA-256 bound below is valid only for a worktree at or descended from this commit."
working_branch = "dfp-phase1a-diagnostics"

