# ---------------------------------------------------------------------
# Kernel binding: the exact public API this identity freezes, and the
# E15 formulas it reuses verbatim (never re-derived, re-selected, or
# reinterpreted here -- restated only for cross-reference).
# ---------------------------------------------------------------------

[kernel_binding]
module = "src.dfp_phase1b_provenance_features"
result_type = "ComponentEvidenceFeatures"
function = "compute_component_evidence_features"
function_signature = "compute_component_evidence_features(G: torch.Tensor, m320: torch.Tensor, *, component_ids: torch.Tensor) -> ComponentEvidenceFeatures"
g_input_name = "G"
g_input_definition = "the already-computed signed component-evidence matrix G[x,r], per e15 [component_evidence_decomposition].signed_component_evidence_formula; this kernel never computes G itself"
m320_input_name = "m320"
m320_input_definition = "the per-disputed-pixel propagated margin m320(x), per e15 [margins].m320_definition; e15 [provenance_features.margins_and_controls].propagated_margin_formula aliases propagated_margin = m320 -- this kernel uses the literal m320 name used by the k_star formula itself"
component_ids_input_name = "component_ids"
component_ids_input_definition = "the canonical, deterministic component identity for each column of G, independent of column position, per e15 [component_construction].ordering"
output_fields = [
    "k_star", "phi", "top1_positive_share", "positive_evidence_sum", "negative_evidence_sum",
    "n_positive_components", "top_positive_component_id", "top_positive_evidence",
]
reused_e15_formulas_verbatim = [
    "g_plus_definition", "sort_order", "positive_evidence_sum_formula", "negative_evidence_sum_formula",
    "k_star_definition", "phi_formula", "top1_positive_share_formula",
]
formulas_re_derived_by_this_kernel = false
formulas_re_selected_by_this_kernel = false
accumulation_dtype = "float64"
accumulation_dtype_source = "e15 [component_evidence_decomposition].component_sum_accumulation_dtype = 'fp64'"
tolerance_or_epsilon_used_in_feature_construction = false
tolerance_or_epsilon_forbidden_source = "e15 [provenance_features.component_evidence].phi_epsilon_forbidden = true; k_star crossing condition uses exact '<=' with no epsilon"
gpu_or_cpu = "operates on whatever device the caller's input tensors are on; never silently transfers a CUDA tensor to CPU, never initializes CUDA merely to run"
input_mutation = "never mutates G, m320, or component_ids; every returned tensor is a freshly allocated buffer, never a view into an input tensor"

# ---------------------------------------------------------------------
# Kernel interface schema: exact input/output tensor shape/dtype
# contract, restated here for a downstream consumer that binds this
# identity without reading the kernel module's own docstring.
# ---------------------------------------------------------------------

[kernel_interface_schema]
g_shape = "[disputed_pixel_count, component_count]"
g_dtype = "float64"
m320_shape = "[disputed_pixel_count]"
m320_dtype = "float64"
