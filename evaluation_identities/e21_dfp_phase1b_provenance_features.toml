top1_positive_share_dtype = "float64"
positive_evidence_sum_dtype = "float64"
negative_evidence_sum_dtype = "float64"
n_positive_components_dtype = "int64"
top_positive_component_id_dtype = "int64"
top_positive_evidence_dtype = "float64"
output_dtype_source = "src/dfp_phase1b_artifact_schema.py [stage_a_schema.flat_disputed_pixel_members] dtype declarations, already committed and unmodified by this identity"
zero_disputed_pixel_rows_behavior = "returns zero-length tensors for every field; a legitimate degenerate case, never fabricated"
non_finite_input_behavior = "reject the whole call (DfpPhase1bProvenanceFeaturesError), never a per-row silent skip"
duplicate_component_id_behavior = "reject the whole call"
device_mismatch_behavior = "reject the whole call; never silently move a tensor to another device"

# ---------------------------------------------------------------------
# Domain invariants this kernel relies on: each a NECESSARY MATHEMATICAL
# CONSEQUENCE of already-frozen E15 authority (never a new convention
# invented by this identity), listed here for auditability. When
# observed violated at runtime, the kernel fails closed rather than
# inventing a fallback value -- generalizing e15's own
# k_star_non_finite_case_behavior ("reject an invalid non-finite case
# rather than inventing infinity") to every domain-invariant violation
# this kernel can detect.
# ---------------------------------------------------------------------

[domain_invariants]
m320_strictly_positive = "m320(x) > 0 for every valid disputed pixel; e15 [margins].m320_definition"
m0_non_positive = "m0(x) <= 0 for every valid disputed pixel; e15 [margins].m0_definition"
delta_m_strictly_positive = "delta_m(x) = m320(x) - m0(x) > 0; e15 [margins].delta_m_definition"
conservation_identity = "sum_r G[x,r] = delta_m(x); e15 [component_evidence_decomposition].conservation_identity"
positive_evidence_sum_at_least_delta_m = "positive_evidence_sum = delta_m(x) - negative_evidence_sum >= delta_m(x) >= m320(x), because negative_evidence_sum <= 0 and m0(x) <= 0 -- derived, not independently frozen"
positive_evidence_sum_strictly_positive = "positive_evidence_sum > 0 for every valid disputed pixel; also directly required by src/dfp_phase1b_artifact_schema.py [stage_a_schema.relational_validation]"
n_positive_components_at_least_one = "n_positive_components >= 1 for every valid disputed pixel; implied by positive_evidence_sum > 0"
k_star_always_exists_in_range = "a k in [1, n_positive_components] satisfying the k_star crossing condition always exists for a valid disputed pixel, because positive_evidence_sum >= m320(x); k_star is therefore always finite and >= 1, matching e15 k_star_always_finite_for_valid_disputed_pixel = true"
violation_behavior = "reject with DfpPhase1bProvenanceFeaturesError; never invent a fallback k_star, phi, or share value for a pixel that violates one of the invariants above"

