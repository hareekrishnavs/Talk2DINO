# ---------------------------------------------------------------------
# Candidate scope: which images and windows the candidate universe is
# built from. No GT, annotation, prediction, dispute, or model output
# may influence membership or order.
# ---------------------------------------------------------------------

[candidate_scope]
run_mode = "coco_stuff_500"
image_count = 500
image_order_source = "dependency_bindings.subset_manifest's own 'selected_ids' field, taken verbatim in its own already-frozen canonical (lexicographic fixed-width-ID) order -- never re-sorted, re-derived, or filtered here"
candidate_windows_per_image_source = "dependency_bindings.window_plan's SlidingWindowPlan.build(...), applied once per image to that image's resolved inference-canvas geometry, using the frozen crop=[448,448]/stride=[224,224] from e13_dfp_phase1a_protocol.toml's own [score_interpolation_stitching] block -- e15_protocol does not itself contain this section, it only transitively hash-binds e13_dfp_phase1a_protocol.toml via its own [authority_bindings.phase1a_protocol]; never re-derived or re-guessed here"
gt_annotation_prediction_dispute_or_model_output_influence_forbidden = true
candidate_existence_requires_only = ["image_manifest_ordinal", "inference_canvas_height", "inference_canvas_width", "canonical_window_ordinal_and_geometry_from_window_plan", "patch_grid_height_and_width_from_bound_pipeline_metadata"]

# ---------------------------------------------------------------------
# Canonical candidate identity: one exact record per candidate window,
# and one frozen, unambiguous byte encoding of that record.
# ---------------------------------------------------------------------

[candidate_identity]
fields = [
    "run_mode",
    "image_id",
    "image_path",
    "image_manifest_ordinal",
    "inference_canvas_height",
    "inference_canvas_width",
    "canonical_window_ordinal",
    "top",
    "left",
    "bottom",
    "right",
    "crop_height",
    "crop_width",
    "patch_grid_height",
    "patch_grid_width",
]
field_count = 15
integer_fields = [
    "image_manifest_ordinal", "inference_canvas_height", "inference_canvas_width",
    "canonical_window_ordinal", "top", "left", "bottom", "right",
    "crop_height", "crop_width", "patch_grid_height", "patch_grid_width",
]
string_fields = ["run_mode", "image_id", "image_path"]
non_negative_integer_fields_required = true
image_id_must_match_subset_manifest_selected_ids_entry = true
image_path_must_be_posix_relative_no_traversal = true

[candidate_identity.encoding]
encoding_name = "talk2dino-dfp-phase1b-calibration-candidate-record-v1"
byte_encoding = "utf-8"
container = "json object"
key_order = [
    "bottom", "canonical_window_ordinal", "crop_height", "crop_width",
    "image_id", "image_manifest_ordinal", "image_path",
    "inference_canvas_height", "inference_canvas_width",
    "left", "patch_grid_height", "patch_grid_width", "right", "run_mode", "top",
]
key_order_is_alphabetical = true
json_dumps_equivalent = "json.dumps(record, sort_keys=True, separators=(',', ':'), ensure_ascii=True)"
item_separator = ","
key_separator = ":"
whitespace_between_tokens = "none"
ensure_ascii = true
floats_forbidden_in_record = true
booleans_forbidden_in_record = true
null_forbidden_in_record = true
trailing_newline_appended = false
integer_serialization = "canonical base-10 ASCII digits, no sign for non-negative fields, no leading zeros other than the single digit '0', produced by Python's native int-to-JSON serialization"
path_separator_in_image_path = "posix forward slash '/' only, regardless of host OS"

# ---------------------------------------------------------------------
# Canonical candidate order: the order candidates are enumerated in,
# and the order selected windows are stored in the final artifact.
# This is NOT the selection-rank order (see [selection_algorithm]).
# ---------------------------------------------------------------------

[candidate_order]
primary_key = "image_manifest_ordinal"
primary_direction = "ascending"
secondary_key = "canonical_window_ordinal"
secondary_direction = "ascending"
coordinates_are_validation_fields_only = true
coordinates_are_not_an_ordering_authority = true
candidate_identities_must_be_unique = true
canonical_candidate_index_definition = "zero-based position of a candidate record within the complete candidate universe once sorted into canonical candidate order"

# ---------------------------------------------------------------------
# Selection algorithm: exactly how 200 of the candidates are chosen.
# Deterministic, independent of filesystem/dict/hash-seed order and of
# any prediction, GT, dispute, or runtime-performance signal.
# ---------------------------------------------------------------------

[selection_algorithm]
window_selection_namespace = "talk2dino-dfp-phase1b-calibration-window-selection-v1"
window_selection_namespace_source = "verbatim reuse of e15_protocol's own conservation_calibration.procedure.window_selection_namespace value -- never redefined here"
window_count = 200
selection_key_formula = "sha256(namespace.encode('utf-8') + b'\\x00' + candidate_record_canonical_json_bytes).hexdigest() -- lowercase 64-hex"
ranking_key = "(selection_key_hex, canonical_candidate_index)"
ranking_direction = "ascending"
ranking_is_total_order = "canonical_candidate_index is unique per candidate, so this ranking key can never produce an unresolved tie; it is frozen regardless as defense-in-depth"
select_first_n = 200
fail_closed_if_universe_smaller_than_window_count = true
selected_rows_stored_in_canonical_candidate_order_not_selection_rank_order = true

[selection_algorithm.digests]
digest_algorithm = "sha256"
digest_over_records_formula = "sha256(b''.join(len(record_bytes).to_bytes(8, 'big') + record_bytes for record_bytes in records_in_the_stated_order)).hexdigest() -- lowercase 64-hex; length-prefixing removes any concatenation-boundary ambiguity"
candidate_universe_digest = "digest_over_records applied to every candidate record's [candidate_identity.encoding] bytes, in canonical candidate order (the complete universe)"
selected_windows_digest = "digest_over_records applied to the 200 selected candidate records' [candidate_identity.encoding] bytes, in canonical candidate order (not selection-rank order)"
selection_trace_record_encoding = "utf-8 json object with alphabetical key order ['canonical_candidate_index', 'selection_key', 'selection_rank'], same separators/ensure_ascii/no-trailing-newline rules as [candidate_identity.encoding]"
selection_trace_digest = "digest_over_records applied to the 200 selection_trace_records, ordered by selection_rank ascending (0..199)"
persisted_digest_fields = ["candidate_universe_digest", "selected_windows_digest", "selection_trace_digest"]

[selection_algorithm.independence]
independent_of_filesystem_enumeration_order = true
independent_of_dictionary_insertion_order = true
independent_of_pythonhashseed = true
independent_of_worker_count = true
independent_of_model_predictions = true
independent_of_ground_truth = true
independent_of_gpu_availability = true
independent_of_component_or_dispute_counts = true
independent_of_residual_magnitude = true

# ---------------------------------------------------------------------
# Calibration execution contract: what the FUTURE runner must do for
# each of the 200 selected windows. Frozen here; not implemented here.
# ---------------------------------------------------------------------

[execution_contract]
selected_window_count_required = 200
same_process_and_job_required = true
same_graph_instance_required_for_paired_canonical_and_masked_calculation = true
k = 12
steps = 320
alpha_source = "e13_dfp_phase1a_protocol.toml's own [propagation].alpha (0.98) -- e15_protocol does not itself contain a [propagation] section, it only transitively hash-binds e13_dfp_phase1a_protocol.toml via its own [authority_bindings.phase1a_protocol]; this value is reused verbatim, never redefined here"
graph_storage_dtype = "float32"
canonical_recurrence_dtype = "float64"
masked_recurrence_dtype = "float64"
residual_accumulation_dtype = "float64"
mixed_precision_forbidden = true
autocast_forbidden = true
tf32_forbidden = true
early_stopping_forbidden = true
equilibrium_solver_forbidden = true
k11_path_forbidden = true
dense_influence_kernel_forbidden = true
adjoint_approximation_forbidden = true
top_k_residual_approximation_forbidden = true
measurement_only = true
issues_conservation_pass_fail_decision = false
reuses_committed_masked_forward_apis_only = true
duplicate_seed_construction_forbidden = true
duplicate_recurrence_forbidden = true
duplicate_signed_contribution_formula_forbidden = true
duplicate_conservation_formula_forbidden = true
duplicate_stitching_forbidden = true
duplicate_final_rescale_forbidden = true
duplicate_membership_construction_forbidden = true

# ---------------------------------------------------------------------
# Residual definitions: bound exactly to the existing symbols/functions
# already committed in dependency_bindings.masked_forward_core. No new,
# incompatible mathematics is introduced.
# ---------------------------------------------------------------------

[residual_definitions]
primary_measurement = "rho_g"
all_recorded_families = ["rho_M", "rho_0", "rho_320", "rho_g"]
tolerance_defined_here = false

[residual_definitions.rho_M]
bound_function = "compute_membership_partition_residual"
formula = "rho_M(j) = sum_r M[r,w,j] - 1"
domain_tensor = "membership_rows: [component_count, node_count] for the selected window's FULL component set"
sample_axis = "node_count (one residual value per window node j)"

[residual_definitions.rho_0]
bound_function = "compute_seed_reconstruction_residual"
formula = "rho_0(j,c) = sum_r Y0^(r)[w,j,c] - Y0[w,j,c]"
domain_tensor = "seed_by_component: [component_count, node_count, query_class_count] summed over components, compared to unary_window_scores: [node_count, query_class_count]"
sample_axis = "node_count * query_class_count, at the raw per-window recurrence-state level (pre-stitch, pre-final-rescale)"

[residual_definitions.rho_320]
bound_function = "compute_propagated_reconstruction_residual"
formula = "rho_320(j,c) = sum_r Y_320^(r)[w,j,c] - Y_320[w,j,c]"
domain_tensor = "propagated_by_component: [component_count, node_count, query_class_count] summed over components, compared to canonical_propagated: [node_count, query_class_count] from the SAME-job canonical reference"
sample_axis = "node_count * query_class_count, at the raw per-window recurrence-state level (pre-stitch, pre-final-rescale), at T=320"

[residual_definitions.rho_g]
bound_function = "compute_signed_margin_conservation_residual"
formula = "rho_g^(w)(x) = sum_r g^(w)_{x,r} - delta_m^(w)(x)"
final_resolution_operator = "A_final,w = R ∘ A_stitch,w (dependency_bindings.stitching_pullback's apply_window_stitching_forward composed with dependency_bindings.final_rescale_pullback's apply_final_rescale_forward, exactly as already reused by compute_signed_contributions/stitch_and_rescale_component_scores)"
g_definition = "g^(w)_{x,r}: the selected window's own signed component contribution, computed from S0/S_final AFTER applying A_final,w -- never from the pre-stitch per-window recurrence state"
delta_m_definition = "delta_m^(w)(x): the same selected window's canonical (unmasked) T320-minus-T0 contribution to the b(x)-a(x) margin, after applying the identical A_final,w operator"
a_b_source = "a(x) and b(x) come only from canonical final-resolution T0 and T320 predictions; ground truth is forbidden as an input to a(x)/b(x) or to any part of this measurement"
disputed_pixel_domain = "final-resolution pixels within the selected window's own final-resolution support where a(x) != b(x) (the frozen disputed set); pixels outside this set are excluded, exactly as compute_signed_contributions already requires"
stitch_denominator_source = "the complete canonical window plan for the image (every window contributing to that image's stitched field), never a per-window-only or partial denominator"
zero_disputed_pixel_windows_are_valid = "a selected window with zero disputed final-resolution pixels remains a valid, completed, calibrated window; its rho_g sample_count is 0 and its floating summary fields are recorded as null, never as a fabricated 0.0 or omitted row"

# ---------------------------------------------------------------------
# Raw measurement summary fields: recorded per selected window, per
# residual family. No tolerance, epsilon, threshold, or verdict field.
# ---------------------------------------------------------------------

[raw_measurement_summary]
per_residual_family_fields = [
    "sample_count", "finite_count", "non_finite_count",
    "signed_minimum", "signed_maximum",
    "maximum_absolute_residual", "mean_absolute_residual", "root_mean_square_residual",
    "absolute_residual_sum", "squared_residual_sum",
]
sum_fields_exist_to_permit_exact_aggregate_reconstruction = true
aggregate_mean_absolute_formula = "sum_over_windows(absolute_residual_sum) / sum_over_windows(sample_count), computed only when sum_over_windows(sample_count) > 0, else null"
aggregate_rms_formula = "sqrt(sum_over_windows(squared_residual_sum) / sum_over_windows(sample_count)), computed only when sum_over_windows(sample_count) > 0, else null"
non_finite_values_forbidden_in_a_completed_artifact = true
zero_sample_family_floating_fields_must_be_json_null = true
nan_or_infinity_must_never_be_serialized = true
low_magnitude_exclusion_forbidden = true
residual_clipping_forbidden = true
rounding_to_zero_forbidden = true

[raw_measurement_summary.forbidden_fields]
list = [
    "tolerance", "default_tolerance", "epsilon", "threshold", "multiplier", "safety_factor",
    "percentile_cutoff", "calibrated_tolerance", "recommended_tolerance",
    "pass", "fail", "passed", "failed", "acceptable", "within_tolerance", "verdict",
]

# ---------------------------------------------------------------------
# Closed calibration artifact schema.
# ---------------------------------------------------------------------

[artifact_schema]
schema_name = "talk2dino-dfp-phase1b-conservation-calibration-v1"
schema_version = 1
required_artifact_relative_path = "phase1b_conservation_calibration.json"
required_artifact_relative_path_source = "verbatim reuse of e15_protocol's own conservation_calibration.required_artifact_relative_path -- never redefined here"
expected_selected_window_count = 200
completed_artifact_requires_exactly_expected_row_count = true
completed_artifact_requires_non_finite_count_zero_everywhere = true

[artifact_schema.top_level_keys]
list = [
    "schema_name", "schema_version",
    "complete", "final",
    "calibration_identity_sha256",
    "bound_e15_protocol_sha256", "bound_e15_artifacts_sha256", "bound_masked_forward_sha256",
    "repository_commit",
    "run_mode",
    "bound_subset_manifest_sha256", "selected_ids_digest",
    "candidate_window_count", "expected_selected_window_count", "completed_selected_window_count",
    "candidate_universe_digest", "selected_windows_digest", "selection_trace_digest",
    "device_record", "software_record", "propagation_precision_record",
    "selected_window_records",
    "aggregate_residual_summaries",
]

[artifact_schema.selected_window_record_keys]
list = [
    "bottom", "canonical_window_ordinal", "crop_height", "crop_width",
    "image_id", "image_manifest_ordinal", "image_path",
    "inference_canvas_height", "inference_canvas_width",
    "left", "patch_grid_height", "patch_grid_width", "right", "run_mode", "top",
    "canonical_candidate_index", "selection_rank", "selection_key",
    "completed",
    "rho_M", "rho_0", "rho_320", "rho_g",
]

[artifact_schema.residual_summary_record_keys]
list = [
    "sample_count", "finite_count", "non_finite_count",
    "signed_minimum", "signed_maximum",
    "maximum_absolute_residual", "mean_absolute_residual", "root_mean_square_residual",
    "absolute_residual_sum", "squared_residual_sum",
]

[artifact_schema.validation_requirements]
list = [
    "exact top-level key set (no missing, no unknown)",
    "exact selected-window-record key set (no missing, no unknown)",
    "schema_name and schema_version match exactly; schema_version type(value) is int, excluding bool and float",
    "bool never accepted where int is required",
    "float never accepted where int is required",
    "no NaN or Infinity anywhere",
    "exactly expected_selected_window_count distinct rows required when complete/final are both true",
    "selected_window_records stored in canonical candidate order, not selection-rank order",
    "no duplicate canonical_candidate_index, selection_rank, or selection_key across rows",
    "candidate_universe_digest, selected_windows_digest, and selection_trace_digest independently recomputable and must match the stored values",
    "aggregate_residual_summaries must be exactly reconstructable from the per-window absolute_residual_sum/squared_residual_sum/sample_count fields",
    "all SHA-256 fields are lowercase 64-hex",
    "repository_commit is a full lowercase 40-hex git commit id",
]

# ---------------------------------------------------------------------
# Device / software / precision binding: recorded, never preselected.
# ---------------------------------------------------------------------

[device_software_precision_binding.device_record]
required_fields = [
    "device_type", "gpu_model_name", "cuda_compute_capability",
    "total_device_memory_bytes", "cuda_driver_version", "cuda_runtime_version",
]
device_type_required_value = "cuda"
gpu_model_preselection_forbidden = true

[device_software_precision_binding.software_record]
required_fields = [
    "repository_commit", "python_version", "torch_version", "numpy_version",
    "cuda_version", "cudnn_version",
    "deterministic_algorithms_enabled", "tf32_enabled", "autocast_enabled",
]

[device_software_precision_binding.propagation_precision_record]
required_fields = [
    "graph_storage_dtype", "canonical_recurrence_dtype", "masked_recurrence_dtype",
    "residual_accumulation_dtype", "alpha", "steps", "k", "chunk_size",
]

# ---------------------------------------------------------------------
# Measurement vs. tolerance selection boundary.
# ---------------------------------------------------------------------

[measurement_versus_tolerance_boundary]
authorizes_deterministic_measurement_only = true
calibration_runner_implemented_by_this_identity = false
calibration_artifact_must_be_generated_on_intended_phase1b_device_class = true
calibration_artifact_must_be_independently_verified = true
later_successor_authority_required_to_bind_verified_artifact_and_freeze_tolerance = true
full_phase1b_execution_remains_unauthorized_until_that_later_authority_is_committed_and_independently_verified = true
tolerance_inference_suggestion_or_addition_in_this_identity_forbidden = true

