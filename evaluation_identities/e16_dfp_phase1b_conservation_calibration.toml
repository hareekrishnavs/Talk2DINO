format_version = "Talk2Dino-DFP-Phase1B-Conservation-Calibration-Identity-V1"

# ---------------------------------------------------------------------
# E16: freezes the scientific authority and closed artifact schema for
# the DFP Phase 1B 200-window FP64 conservation-calibration runner.
#
# This identity is a NEW LEAF authority. It binds, but does not modify
# or reinterpret, e15-dfp-phase1b-protocol, e15-dfp-phase1b-artifacts,
# the exact masked-forward provenance core, the frozen COCO-Stuff-500
# subset manifest, the canonical sliding-window-plan implementation,
# and the committed stitching / final-resolution pullback
# implementations. No hash anywhere in this file cascades into E13,
# E14, or E15 -- this identity is a pure downstream consumer.
#
# This identity authorizes DETERMINISTIC MEASUREMENT ONLY. It does not
# implement the calibration runner, does not select or suggest a
# numeric conservation tolerance, and does not authorize full Phase 1B
# execution. See [measurement_versus_tolerance_boundary] below.
# ---------------------------------------------------------------------

[identity]
name = "e16-dfp-phase1b-conservation-calibration"
schema_name = "talk2dino-dfp-phase1b-conservation-calibration-identity-v1"
schema_version = 1
purpose = "Freezes the deterministic 200-window selection algorithm, the same-job canonical/masked FP64 execution contract, the exact raw conservation-residual definitions, and the closed phase1b_conservation_calibration.json artifact schema required before the DFP Phase 1B conservation-calibration runner may be implemented. Implements no runner, selects no tolerance, and authorizes no real image, GPU, or SLURM execution."
storage_representation_only = true
implements_runner = false
implements_tolerance_selection = false
required_ancestor_commit = "3d4f0a7ad889fe9feca91474a6f30e137a0741f6"
working_branch = "dfp-phase1a-diagnostics"

