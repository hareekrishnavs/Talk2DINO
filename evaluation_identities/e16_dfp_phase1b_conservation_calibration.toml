]

[future_step_bindings]
description = "Fields explicitly deferred to later steps, never guessed or invented here."
next_step_items = [
    "implement the 200-window conservation-calibration runner against this identity",
    "generate phase1b_conservation_calibration.json on the GPU/device class intended for Phase 1B",
    "independently verify the generated calibration artifact",
    "freeze a new successor authority binding the verified artifact and the numeric conservation tolerance",
    "Phase 1B execution driver, authorized only after that successor authority is committed and independently verified",
]
